ට භාවිත කරයි."],["Which catalyst is added to speed up the decomposition of H₂O₂ (2H₂O₂ → 2H₂O + O₂)?",["NaCl","MnO₂","CaCO₃","water only"],"MnO₂ acts as a catalyst, releasing O₂ quickly. It is used to make O₂ in the school laboratory."],"2022 Q27"],["RATE",1,["ජීවී සෛලවල ඇති ජෛව උත්ප්‍රේරක හඳුන්වන්නේ කුමක් ලෙසද?",["හෝමෝන","එන්සයිම","විටමින්","ප්‍රතිදේහ"],"එන්සයිම ප්‍රෝටීනවලින් සෑදුණු ජෛව උත්ප්‍රේරක වේ. උදා. ඇමයිලේස්, පෙප්සින්, ලයිපේස්."],["What are the biological catalysts in living cells called?",["hormones","enzymes","vitamins","antibodies"],"Enzymes are biological catalysts made of protein, e.g. amylase, pepsin, lipase."],"2023 Q32"],["RATE",3,["Zn කැබැල්ලක් HCl සමඟ ප්‍රතික්‍රියා කරමින් තිබියදී එයට තවත් සාන්ද්‍ර HCl ප්‍රමාණයක් එක් කළ විට H₂ පිටවීමේ ශීඝ්‍රතාවයට කුමක් වේද?",["අඩු වේ","නොවෙනස්ව පවතී","ප්‍රතික්‍රියාව නතර වේ","නැවත වැඩි වේ"],"අම්ල සාන්ද්‍රණය වැඩි වූ විට ගැටුම් වැඩි වන නිසා ශීඝ්‍රතාව නැවත වැඩි වේ (Zn ඉතිරිව ඇති තාක්)."],["While a piece of Zn is reacting with HCl, more concentrated HCl is added. What happens to the rate of H₂ release?",["it decreases","it stays the same","the reaction stops","it increases again"],"Higher acid concentration means more collisions, so the rate increases again (as long as Zn remains)."],"2024 Q37"],["RATE",1,["Mg සහ HCl ප්‍රතික්‍රියාවේ ශීඝ්‍රතාව අම්ල සාන්ද්‍රණය මත රඳා පවතින ආකාරය පරීක්ෂා කිරීමේදී නියතව තබා ගත යුතු නොවන්නේ කුමක්ද?",["Mg පටියේ දිග සහ ස්කන්ධය","අම්ලයේ සාන්ද්‍රණය","උෂ්ණත්වය","අම්ලයේ පරිමාව"],"පරීක්ෂා කරන (ස්වාධීන) විචල්‍යය වන අම්ල සාන්ද්‍රණය වෙනස් කළ යුතුය. අනෙක් සියලු සාධක නියතව තැබිය යුතුය."],["In an experiment on how acid concentration affects the rate of the Mg + HCl reaction, which should NOT be kept constant?",["the length and mass of Mg ribbon","the acid concentration","the temperature","the volume of acid"],"The acid concentration is the independent variable being tested, so it is changed. All other factors must be kept the same."],"2025 Q23"],["REPRO",2,["මිනිස් ගැහැණු ප්‍රජනක පද්ධතියේ කලලය (embryo) තැන්පත් වී වර්ධනය වන ස්ථානය කුමක්ද?",["ඩිම්බ කෝෂය","පැලෝපීය නාලය","ගර්භාෂ බිත්තිය","යෝනි මාර්ගය"],"සංසේචනය පැලෝපීය නාලයේදී සිදු වේ. කලලය ගර්භාෂයට පැමිණ එහි බිත්තියේ තැන්පත් වේ (implantation)."],["Where does the embryo implant and develop in the human female reproductive system?",["ovary","fallopian tube","wall of the uterus","vagina"],"Fertilization happens in the fallopian tube. The embryo moves to the uterus and implants in its wall."],"2019 Q13"],["REPRO",0,["මවගේ සහ කළලයේ රුධිරය අතර ද්‍රව්‍ය හුවමාරුව සිදු කරන ව්‍යුහය කුමක්ද?",["වැදෑමහ (placenta)","ගර්භාෂ ග්‍රීවය","ඩිම්බ කෝෂය","පැලෝපීය නාලය"],"වැදෑමහ හරහා ඔක්සිජන් සහ පෝෂක කළලයට යන අතර CO₂ සහ අපද්‍රව්‍ය මවගේ රුධිරයට එයි. රුධිර දෙක කෙලින්ම මිශ්‍ර නොවේ."],["Which structure exchanges substances between the mother's and the foetus's blood?",["placenta","cervix","ovary","fallopian tube"],"Oxygen and nutrients pass to the foetus through the placenta, and CO₂ and wastes pass to the mother. The two bloods do not mix directly."],"2020 Q19"],["REPRO",0,["ඩිම්බ නිපදවන ඉන්ද්‍රිය සහ ඩිම්බය ගර්භාෂය දෙසට ගෙන යන නාලය පිළිවෙළින් මොනවාද?",["ඩිම්බ කෝෂය සහ පැලෝපීය නාලය","ගර්භාෂය සහ යෝනි මාර්ගය","පැලෝපීය නාලය සහ ඩිම්බ කෝෂය","ගර්භාෂය සහ පැලෝපීය නාලය"],"ඩිම්බ කෝෂ ඩිම්බ සහ ඊස්ට්‍රජන්, ප්‍රොජෙස්ටරෝන් නිපදවයි. පැලෝපීය නාලය ඩිම්බය ගර්භාෂයට ගෙන යයි."],["Which organ produces eggs, and which tube carries the egg towards the uterus?",["ovary and fallopian tube","uterus and vagina","fallopian tube and ovary","uterus and fallopian tube"],"The ovaries produce eggs and the hormones oestrogen and progesterone. The fallopian tube carries the egg to the uterus."],"2021 Q12"],["REPRO",1,["මිනිසාගේ ඩිම්බයක් ශුක්‍රාණුවක් සමඟ සංසේචනය වන්නේ සාමාන්‍යයෙන් කොතැනදීද?",["ගර්භාෂයේදී","පැලෝපීය නාලයේදී","ඩිම්බ කෝෂයේදී","ගර්භාෂ ග්‍රීවයේදී"],"ඩිම්බ මෝචනයෙන් පසු ඩිම්බය පැලෝපීය නාලයට ඇතුළු වේ. ශුක්‍රාණු එතැනට පැමිණ සංසේචනය සිදු වේ."],["Where does fertilization of a human egg by a sperm usually take place?",["in the uterus","in the fallopian tube","in the ovary","in the cervix"],"After ovulation the egg enters the fallopian tube. Sperm reach it there and fertilization happens."],"2021 Q13"],["REPRO",1,["සපුෂ්ප ශාකයක සංසේචනයෙන් පසු ඩිම්බකෝෂය (ovary) සහ ඩිම්බය (ovule) පිළිවෙළින් කුමක් බවට පත් වේද?",["බීජය සහ ඵලය","ඵලය සහ බීජය","පෙති සහ බීජය","ඵලය සහ පරාග"],"සංසේචනයෙන් පසු ඩිම්බකෝෂය ඵලය බවටත්, ඩිම්බය බීජය බවටත් පත් වේ."],["After fertilization in a flowering plant, the ovary and the ovule become, respectively,",["the seed and the fruit","the fruit and the seed","the petals and the seed","the fruit and the pollen"],"After fertilization the ovary becomes the fruit and the ovule becomes the seed."],"2022 Q12"],["REPRO",0,["පිරිමි ප්‍රජනක පද්ධතියේ ශුක්‍රාණු සහ ටෙස්ටොස්ටෙරෝන් නිපදවන ඉන්ද්‍රිය කුමක්ද?",["වෘෂණ (testes)","ශුක්‍ර ආශයිකා","පුරස්ථි ග්‍රන්ථිය","අපිවෘෂණය"],"ශුක්‍රාණු වෘෂණවල ශුක්‍ර නාලිකාවල නිපදවේ. වෘෂණ ටෙස්ටොස්ටෙරෝන් හෝමෝනයද ස්‍රාවය කරයි."],["Which organ of the male reproductive system produces sperm and testosterone?",["testes","seminal vesicles","prostate gland","epididymis"],"Sperm are made in the seminiferous tubules of the testes, which also secrete testosterone."],"2022 Q19"],["REPRO",2,["ඔසප් චක්‍රයේ ඩිම්බ මෝචනයෙන් පසු ඩිම්බකෝෂ පුටිකාවේ ඉතිරි කොටස කුමක් බවට පත් වේද? එය නිපදවන හෝමෝනය කුමක්ද?",["ග්‍රාෆියන් පුටිකාව; FSH","ප්‍රාථමික පුටිකාව; ඊස්ට්‍රජන්","පීත දේහය (corpus luteum); ප්‍රොජෙස්ටරෝන්","වැදෑමහ; ඉන්සියුලින්"],"පරිණත ග්‍රාෆියන් පුටිකාවෙන් ඩිම්බය මෝචනය වූ පසු ඉතිරි කොටස පීත දේහය වී ප්‍රොජෙස්ටරෝන් ස්‍රාවය කර ගර්භාෂ බිත්තිය පවත්වයි."],["After ovulation, what does the rest of the ovarian follicle become, and which hormone does it make?",["Graafian follicle; FSH","primary follicle; oestrogen","corpus luteum; progesterone","placenta; insulin"],"After the egg is released from the mature Graafian follicle, the remainder becomes the corpus luteum, which secretes progesterone to maintain the uterine lining."],"2024 Q7"],["REPRO",2,["අමීබා ප්‍රජනනය වන ආකාරය පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["ලිංගික ප්‍රජනනයෙන් පමණි","බීජාණු මගින් පමණි","ද්විඛණ්ඩනය (binary fission) මගින් අලිංගිකව; නව සෛල දෙක ප්‍රවේණිකව සර්වසමයි","අංකුරණය (budding) මගින් පමණි"],"අමීබාවේ න්‍යෂ්ටිය අනූනන විභාජනයෙන් බෙදී, සෛලය සමාන කොටස් දෙකකට වෙන් වේ. මෙය ද්විඛණ්ඩනයයි."],["Which statement about how amoeba reproduces is correct?",["only by sexual reproduction","only by spores","asexually by binary fission; the two new cells are genetically identical","only by budding"],"The amoeba's nucleus divides by mitosis and the cell splits into two equal parts. This is binary fission."],"2025 Q25"],["RESP",2,["ශ්වසන පෘෂ්ඨයක ලක්ෂණයක් නොවන්නේ කුමක්ද?",["තුනී වීම","විශාල පෘෂ්ඨ වර්ගඵලයක් තිබීම","වියළි වීම","රුධිර කේශනාලිකා ජාලයක් තිබීම"],"වායු දිය වී විසරණය වීමට ශ්වසන පෘෂ්ඨ තෙත් විය යුතුය. පෙනහළු ගර්තිකා තුනී, තෙත්, විශාල වර්ගඵලයක් සහ කේශනාලිකා ජාලයක් සහිතයි."],["Which is NOT a feature of a respiratory surface?",["being thin","having a large surface area","being dry","having a network of blood capillaries"],"Gases must dissolve to diffuse, so respiratory surfaces must be moist. Alveoli are thin, moist, have a large area and many capillaries."],"2018 Q29"],["RESP",2,["දැඩි ව්‍යායාමයකදී මාංශ පේශිවල නිර්වායු ශ්වසනයෙන් සෑදෙන, පේශි වෙහෙස ඇති කරන ද්‍රව්‍යය කුමක්ද?",["එතනෝල්","ග්ලූකෝස්","ලැක්ටික් අම්ලය","ඔක්සිජන්"],"ඔක්සිජන් ප්‍රමාණවත් නැති විට පේශි ග්ලූකෝස් ලැක්ටික් අම්ලය බවට පරිවර්තනය කරයි. යීස්ට් නිර්වායු ශ්වසනයෙන් එතනෝල් සහ CO₂ සාදයි."],["During hard exercise, which substance is formed by anaerobic respiration in muscles and causes muscle fatigue?",["ethanol","glucose","lactic acid","oxygen"],"When oxygen is short, muscles convert glucose to lactic acid. Yeast makes ethanol and CO₂ by anaerobic respiration."],"2020 Q21"],["RESP",1,["නිර්වායු ශ්වසනය පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["එය ස්වායු ශ්වසනයට වඩා වැඩි ශක්තියක් ලබා දෙයි","එය ස්වායු ශ්වසනයට වඩා අඩු ශක්තියක් ලබා දෙයි","එයට ඔක්සිජන් අවශ්‍යයි","එය සතුන් තුළ පමණක් සිදු වේ"],"නිර්වායු ශ්වසනයේදී ග්ලූකෝස් සම්පූර්ණයෙන් බිඳී නොයන නිසා අඩු ශක්තියක් පමණක් නිදහස් වේ. එය ශාක, සතුන් සහ ක්ෂුද්‍ර ජීවීන් තුළ සිදු විය හැක."],["Which statement about anaerobic respiration is true?",["it releases more energy than aerobic respiration","it releases less energy than aerobic respiration","it needs oxygen","it happens only in animals"],"In anaerobic respiration glucose is not fully broken down, so less energy is released. It can occur in plants, animals and microbes."],"2022 Q25"],["RESP",2,["දිගු කාලීන කැස්ස, රාත්‍රී දහඩිය, බර අඩු වීම සහ කෙළෙහි ලේ යාම වැනි රෝග ලක්ෂණ ඇති, බැක්ටීරියාවක් නිසා ඇති වන පෙනහළු රෝගය කුමක්ද?",["ඇදුම","සිලිකෝසිස්","ක්ෂය රෝගය (tuberculosis)","පෙනහළු පිළිකා"],"ක්ෂය රෝගය Mycobacterium tuberculosis බැක්ටීරියාව නිසා ඇති වන බෝවන රෝගයකි. BCG එන්නත මගින් වළක්වා ගත හැක."],["Which bacterial lung disease has symptoms such as a long-lasting cough, night sweats, weight loss and blood in sputum?",["asthma","silicosis","tuberculosis","lung cancer"],"Tuberculosis is an infectious disease caused by the bacterium Mycobacterium tuberculosis. The BCG vaccine helps prevent it."],"2023 Q11"],["RESP",2,["ආශ්වාසයේදී (inspiration) ප්‍රාචීරය (diaphragm) සහ උරස් කුහරයේ පරිමාව වෙනස් වන්නේ කෙසේද?",["ප්‍රාචීරය ලිහිල් වී ඉහළට යයි, පරිමාව අඩු වේ","ප්‍රාචීරය ලිහිල් වී ඉහළට යයි, පරිමාව වැඩි වේ","ප්‍රාචීරය සංකෝචනය වී පැතලි වේ, පරිමාව වැඩි වේ","ප්‍රාචීරය සංකෝචනය වී පැතලි වේ, පරිමාව අඩු වේ"],"ආශ්වාසයේදී ප්‍රාචීරය සංකෝචනය වී පැතලි වේ. උරස් කුහරයේ පරිමාව වැඩි වී පීඩනය අඩු වන නිසා වාතය පෙනහළුවලට ඇතුළු වේ."],["During inspiration, how do the diaphragm and the volume of the chest cavity change?",["the diaphragm relaxes and rises; the volume decreases","the diaphragm relaxes and rises; the volume increases","the diaphragm contracts and flattens; the volume increases","the diaphragm contracts and flattens; the volume decreases"],"During inspiration the diaphragm contracts and flattens. The chest volume increases, pressure falls, and air enters the lungs."],"2024 Q30"],["RESP",3,["ප්‍රශ්වාසයේදී (expiration) පර්ශුකා අතර මාංශ පේශි (intercostal muscles) සහ ප්‍රාචීරය හැසිරෙන්නේ කෙසේද?",["දෙකම සංකෝචනය වේ","පර්ශුකා පේශි සංකෝචනය වේ, ප්‍රාචීරය ලිහිල් වේ","පර්ශුකා පේශි ලිහිල් වේ, ප්‍රාචීරය සංකෝචනය වේ","දෙකම ලිහිල් වේ"],"ප්‍රශ්වාසයේදී (සන්සුන් හුස්ම පිට කිරීම) පේශි දෙකම ලිහිල් වී උරස් කුහරයේ පරිමාව අඩු වේ. පීඩනය වැඩි වී වාතය පිට වේ."],["During expiration, how do the intercostal muscles and the diaphragm behave?",["both contract","intercostals contract, diaphragm relaxes","intercostals relax, diaphragm contracts","both relax"],"During (quiet) expiration both sets of muscles relax, the chest volume decreases, pressure rises and air is pushed out."],"2025 Q24"],["WAVE",3,["ශබ්දයක ඝෝෂාව (loudness) රඳා පවතින්නේ තරංගයේ කුමන ලක්ෂණය මතද?",["සංඛ්‍යාතය","තරංග ආයාමය","වේගය","විස්තාරය (amplitude)"],"විස්තාරය වැඩි වන විට ශබ්දය වැඩි ඝෝෂාකාරී වේ. තාරතාව (pitch) සංඛ්‍යාතය මත රඳා පවතී."],["The loudness of a sound depends on which property of the wave?",["frequency","wavelength","speed","amplitude"],"A larger amplitude gives a louder sound. Pitch depends on frequency."],"2019 Q33"],["WAVE",1,["ජල පෘෂ්ඨයේ තරංගයක ඉහළම ලක්ෂ්‍යය මධ්‍ය මට්ටමට වඩා 3 cm ඉහළින් ඇති අතර, අනුයාත ශීර්ෂ දෙකක් අතර දුර 10 cm වේ. විස්තාරය සහ තරංග ආයාමය පිළිවෙළින් කීයද?",["6 cm සහ 10 cm","3 cm සහ 10 cm","3 cm සහ 5 cm","6 cm සහ 20 cm"],"විස්තාරය = මධ්‍ය මට්ටමේ සිට ශීර්ෂයට උස = 3 cm. තරංග ආයාමය = අනුයාත ශීර්ෂ දෙකක් අතර දුර = 10 cm."],["The crest of a water wave is 3 cm above the rest level, and two neighbouring crests are 10 cm apart. What are the amplitude and wavelength, respectively?",["6 cm and 10 cm","3 cm and 10 cm","3 cm and 5 cm","6 cm and 20 cm"],"Amplitude = height of a crest above the rest level = 3 cm. Wavelength = distance between neighbouring crests = 10 cm."],"2021 Q33"],["WAVE",3,["යාන්ත්‍රික තරංග පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["ඒවා රික්තයක් හරහා ගමන් කරයි","ඒවා ආලෝකයේ වේගයෙන් ගමන් කරයි","රේඩියෝ තරංග යාන්ත්‍රික තරංග වේ","ඒවාට ගමන් කිරීමට මාධ්‍යයක් අවශ්‍යයි"],"ශබ්දය, ජල තරංග වැනි යාන්ත්‍රික තරංගවලට මාධ්‍යයක් අවශ්‍යයි. විද්‍යුත් චුම්බක තරංග (ආලෝකය, රේඩියෝ) රික්තයක් හරහා යයි."],["Which statement about mechanical waves is true?",["they travel through a vacuum","they travel at the speed of light","radio waves are mechanical waves","they need a medium to travel"],"Mechanical waves such as sound and water waves need a medium. Electromagnetic waves (light, radio) can cross a vacuum."],"2022 Q14"],["WAVE",1,["නැවකින් පතුලට යවන අතිධ්වනි (ultrasound) ස්පන්දනයක් තත්පර 2කට පසු ආපසු ලැබේ. ජලයේ ශබ්ද වේගය 1500 m s⁻¹ නම් මුහුදේ ගැඹුර කීයද?",["750 m","1500 m","3000 m","6000 m"],"ශබ්දය පතුලට ගොස් ආපසු එයි, එබැවින් එක් පැත්තක කාලය 1 s. ගැඹුර = 1500 × 1 = 1500 m."],["A ship sends an ultrasound pulse to the sea bed and the echo returns after 2 s. If sound travels at 1500 m s⁻¹ in water, how deep is the sea?",["750 m","1500 m","3000 m","6000 m"],"The sound goes down and back, so one way takes 1 s. Depth = 1500 × 1 = 1500 m."],"2023 Q19"],["WAVE",2,["පහත ඒවා අතරින් විද්‍යුත් චුම්බක තරංගයක් නොවන්නේ කුමක්ද?",["X කිරණ","ක්ෂුද්‍ර තරංග (microwaves)","අතිධ්වනි (ultrasound)","අධෝරක්ත කිරණ"],"අතිධ්වනි යනු ඉතා ඉහළ සංඛ්‍යාත ශබ්ද තරංගයි (යාන්ත්‍රික). අනෙක් ඒවා විද්‍යුත් චුම්බක වර්ණාවලියේ කොටස් වේ."],["Which of these is NOT an electromagnetic wave?",["X-rays","microwaves","ultrasound","infrared"],"Ultrasound is very high-frequency sound (a mechanical wave). The others are part of the electromagnetic spectrum."],"2023 Q9"],["WAVE",3,["රේඩියෝ තරංගයක් පෘථිවියේ සිට කිලෝමීටර 300ක් ඉහළින් ඇති චන්ද්‍රිකාවකට යාමට ගත වන කාලය කීයද? (c = 3 × 10⁸ m s⁻¹)",["1 s","0.1 s","0.01 s","0.001 s"],"දුර = 300 km = 3 × 10⁵ m. කාලය = දුර ÷ වේගය = 3 × 10⁵ ÷ 3 × 10⁸ = 10⁻³ s = 0.001 s."],["How long does a radio wave take to reach a satellite 300 km above the Earth? (c = 3 × 10⁸ m s⁻¹)",["1 s","0.1 s","0.01 s","0.001 s"],"Distance = 300 km = 3 × 10⁵ m. Time = distance ÷ speed = 3 × 10⁵ ÷ 3 × 10⁸ = 10⁻³ s = 0.001 s."],"2024 Q20"],["WAVE",0,["තීර්යක් තරංග (transverse waves) පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["අංශු තරංගය ගමන් කරන දිශාවට ලම්බකව කම්පනය වේ","අංශු තරංගය ගමන් කරන දිශාවටම කම්පනය වේ","ශබ්දය තීර්යක් තරංගයකි","ඒවා සම්පීඩන සහ විරලන සාදයි"],"තීර්යක් තරංගවල (උදා. ජල තරංග, ආලෝකය) අංශු ලම්බකව කම්පනය වේ. ශබ්දය අන්වායාම තරංගයක් වන අතර සම්පීඩන හා විරලන සාදයි."],["Which statement about transverse waves is true?",["particles vibrate at right angles to the direction the wave travels","particles vibrate along the direction the wave travels","sound is a transverse wave","they form compressions and rarefactions"],"In transverse waves (e.g. water waves, light) particles vibrate at right angles. Sound is longitudinal and forms compressions and rarefactions."],"2024 Q25"],["WAVE",1,["ශබ්ද තරංග සහ ආලෝක තරංගවල ස්වභාවය පිළිවෙළින් නිවැරදිව දැක්වෙන්නේ කුමන විකල්පයේද?",["තීර්යක් යාන්ත්‍රික සහ අන්වායාම විද්‍යුත් චුම්බක","අන්වායාම යාන්ත්‍රික සහ තීර්යක් විද්‍යුත් චුම්බක","තීර්යක් විද්‍යුත් චුම්බක සහ අන්වායාම යාන්ත්‍රික","අන්වායාම විද්‍යුත් චුම්බක සහ තීර්යක් යාන්ත්‍රික"],"ශබ්දය මාධ්‍යයක් අවශ්‍ය අන්වායාම යාන්ත්‍රික තරංගයකි. ආලෝකය රික්තයක් හරහා යන තීර්යක් විද්‍යුත් චුම්බක තරංගයකි."],["Which option correctly describes the nature of sound waves and light waves, respectively?",["transverse mechanical and longitudinal electromagnetic","longitudinal mechanical and transverse electromagnetic","transverse electromagnetic and longitudinal mechanical","longitudinal electromagnetic and transverse mechanical"],"Sound is a longitudinal mechanical wave needing a medium. Light is a transverse electromagnetic wave that can cross a vacuum."],"2025 Q13"],["WEP",3,["කාර්යයේ (work) SI ඒකකය කුමක්ද?",["වොට් (W)","නිව්ටන් (N)","පැස්කල් (Pa)","ජූල් (J)"],"කාර්යය = බලය × බලයේ දිශාවට විස්ථාපනය. 1 J = 1 N × 1 m. වොට් ජවයේ ඒකකයයි."],["What is the SI unit of work?",["watt (W)","newton (N)","pascal (Pa)","joule (J)"],"Work = force × displacement in the direction of the force. 1 J = 1 N × 1 m. The watt is the unit of power."],"2021 Q3"],["WEP",3,["ජවයේ (power) SI ඒකකය වන වොට් (1 W) යනු කුමක්ද?",["1 J s","1 N m","1 N s","1 J s⁻¹"],"ජවය = කාර්යය ÷ කාලය. 1 W = තත්පරයකට ජූල් 1 = 1 J s⁻¹."],["What is the watt (1 W), the SI unit of power?",["1 J s","1 N m","1 N s","1 J s⁻¹"],"Power = work ÷ time. 1 W = 1 joule per second = 1 J s⁻¹."],"2023 Q2"],["ECO",3,["තණකොළ → පළඟැටියා → කටුස්සා → උකුස්සා යන ආහාර දාමයේ DDT සාන්ද්‍රණය වැඩිම වන්නේ කුමන ජීවියාගේද?",["තණකොළ","පළඟැටියා","කටුස්සා","උකුස්සා"],"ජෛව විශාලනය: ජීර්ණය නොවන DDT ආහාර දාමයේ ඉහළ පෝෂී මට්ටම්වල වැඩි වැඩියෙන් එකතු වේ."],["In the food chain grass → grasshopper → lizard → hawk, which organism has the highest DDT concentration?",["grass","grasshopper","lizard","hawk"],"Biomagnification: DDT is not broken down, so it builds up more and more at higher trophic levels."],""],["ECO",0,["ජලාශයක සුපෝෂණයට (eutrophication) වැඩිපුරම දායක වන අයන යුගලය කුමක්ද?",["PO₄³⁻ සහ NO₃⁻","Cl⁻ සහ Na⁺","SO₄²⁻ සහ Ca²⁺","CO₃²⁻ සහ K⁺"],"පොස්පේට් සහ නයිට්‍රේට් ඇල්ගී වර්ධනයට පෝෂක සපයයි. ඇල්ගී මිය ගොස් දිරාපත් වන විට ජලයේ O₂ අඩු වේ."],["Which pair of ions contributes most to eutrophication of a reservoir?",["PO₄³⁻ and NO₃⁻","Cl⁻ and Na⁺","SO₄²⁻ and Ca²⁺","CO₃²⁻ and K⁺"],"Phosphate and nitrate supply nutrients for algal growth. When the algae die and decompose, the O₂ in the water falls."],""],["ECO",1,["ඕසෝන් ස්තරය ක්ෂය වීමට ප්‍රධාන වශයෙන් හේතු වන්නේ කුමක්ද?",["CO₂","CFC","SO₂","CH₄"],"ක්ලෝරෝෆ්ලුවොරෝකාබන (CFC) ඕසෝන් ස්තරය බිඳ දමයි. CO₂ සහ CH₄ හරිතාගාර වායු වේ. SO₂ අම්ල වැසි ඇති කරයි."],["What is the main cause of ozone layer depletion?",["CO₂","CFC","SO₂","CH₄"],"Chlorofluorocarbons (CFCs) break down the ozone layer. CO₂ and CH₄ are greenhouse gases; SO₂ causes acid rain."],""],["ECO",2,["පහත පරිසර පිරමිඩ අතරින් සැමවිටම උඩුකුරු වන්නේ කුමක්ද?",["සංඛ්‍යා පිරමිඩය","ජෛව ස්කන්ධ පිරමිඩය","ශක්ති පිරමිඩය","ඉහත සියල්ලම"],"සෑම පෝෂී මට්ටමකදීම ශක්තිය හානි වන නිසා ශක්ති පිරමිඩය සැමවිටම උඩුකුරුය. එක් ගසක කෘමීන් රැසක් වැනි අවස්ථාවලදී සංඛ්‍යා පිරමිඩය යටිකුරු විය හැක."],["Which of these ecological pyramids is always upright?",["pyramid of numbers","pyramid of biomass","pyramid of energy","all of the above"],"Energy is lost at every trophic level, so the energy pyramid is always upright. A pyramid of numbers can be inverted, e.g. many insects on one tree."],""],["ECO",2,["පැරණි පුවත්පත් කර්මාන්තශාලාවකදී නැවත කඩදාසි බවට පත් කිරීම 4R සංකල්පයේ කුමක් සඳහා උදාහරණයක්ද?",["අඩු කිරීම (Reduce)","නැවත භාවිතය (Reuse)","ප්‍රතිචක්‍රීකරණය (Recycle)","ප්‍රතිසාධනය (Recover)"],"භාවිත කළ ද්‍රව්‍යයක් සකසා නව නිෂ්පාදනයක් සෑදීම ප්‍රතිචක්‍රීකරණයයි."],["Turning old newspapers back into paper at a factory is an example of which part of the 4R concept?",["Reduce","Reuse","Recycle","Recover"],"Processing a used material to make a new product is recycling."],""],["MATTER",1,["¹⁹₉F⁻ අයනයේ ඉලෙක්ට්‍රෝන, ප්‍රෝටෝන සහ නියුට්‍රෝන ගණන පිළිවෙළින්,",["9, 9, 10","10, 9, 10","10, 9, 19","8, 9, 10"],"ප්‍රෝටෝන = 9. නියුට්‍රෝන = 19 − 9 = 10. ඉලෙක්ට්‍රෝනයක් ලබාගත් නිසා ඉලෙක්ට්‍රෝන = 10."],["The numbers of electrons, protons and neutrons in the ion ¹⁹₉F⁻ are, respectively,",["9, 9, 10","10, 9, 10","10, 9, 19","8, 9, 10"],"Protons = 9. Neutrons = 19 − 9 = 10. It has gained one electron, so electrons = 10."],""],["MATTER",2,["තුන්වන ආවර්තයේ උභයගුණී ඔක්සයිඩයක් සාදන මූලද්‍රව්‍යය කුමක්ද?",["Na","Mg","Al","Si"],"Al₂O₃ අම්ල සහ භෂ්ම යන දෙකම සමඟ ප්‍රතික්‍රියා කරයි. Na, Mg ඔක්සයිඩ භාස්මිකයි, Si ඔක්සයිඩය ආම්ලිකයි."],["Which period 3 element forms an amphoteric oxide?",["Na","Mg","Al","Si"],"Al₂O₃ reacts with both acids and bases. The oxides of Na and Mg are basic; the oxide of Si is acidic."],""],["MATTER",1,["ඉලෙක්ට්‍රෝන වින්‍යාසය 2, 8, 7 වන මූලද්‍රව්‍යය අයත් කාණ්ඩය සහ ආවර්තය,",["VII (17) කාණ්ඩය, 2 ආවර්තය","VII (17) කාණ්ඩය, 3 ආවර්තය","III (13) කාණ්ඩය, 7 ආවර්තය","VIII (18) කාණ්ඩය, 3 ආවර්තය"],"කවච 3ක් ඇති නිසා 3 ආවර්තය. පිටත ඉලෙක්ට්‍රෝන 7ක් ඇති නිසා VII (17) කාණ්ඩය. මෙය ක්ලෝරීන් (Cl) වේ."],["The group and period of the element with electron configuration 2, 8, 7 are",["group VII (17), period 2","group VII (17), period 3","group III (13), period 7","group VIII (18), period 3"],"It has 3 shells, so period 3, and 7 outer electrons, so group VII (17). This is chlorine (Cl)."],""],["MATTER",1,["පහත යුගල අතරින්, පළමු මූලද්‍රව්‍යයේ පළමු අයනීකරණ ශක්තිය දෙවැන්නට වඩා වැඩි වන්නේ කුමන යුගලයේද?",["Na, Mg","Mg, Al","Si, P","Cl, Ar"],"ආවර්තයක් දිගේ IE සාමාන්‍යයෙන් වැඩි වුවත් Mg (738) > Al (578) ලෙස බැසීමක් ඇත. Al හි පිටත ඉලෙක්ට්‍රෝනය ඉවත් කිරීම පහසුය."],["In which pair does the first element have a higher first ionization energy than the second?",["Na, Mg","Mg, Al","Si, P","Cl, Ar"],"IE generally rises across a period, but there is a dip: Mg (738) > Al (578). The outer electron of Al is easier to remove."],""],["MATTER",2,["N₂ අණුවේ නයිට්‍රජන් පරමාණු දෙක අතර ඇති බන්ධනය කුමක්ද?",["ඒක සහසංයුජ බන්ධනය","ද්විත්ව සහසංයුජ බන්ධනය","ත්‍රිත්ව සහසංයුජ බන්ධනය","අයනික බන්ධනය"],"N හි පිටත ඉලෙක්ට්‍රෝන 5ක් ඇත. අෂ්ටකය සම්පූර්ණ කිරීමට ඉලෙක්ට්‍රෝන යුගල 3ක් හවුල් කරයි (N≡N)."],["What is the bond between the two nitrogen atoms in an N₂ molecule?",["single covalent bond","double covalent bond","triple covalent bond","ionic bond"],"N has 5 outer electrons. To complete the octet, the atoms share 3 pairs of electrons (N≡N)."],""],["MATTER",1,["CaCl₂ සංයෝගයේ බන්ධන වර්ගය සහ කැල්සියම් අයනය නිවැරදිව දැක්වෙන්නේ,",["සහසංයුජ, Ca²⁺","අයනික, Ca²⁺","අයනික, Ca⁺","සහසංයුජ, Ca⁺"],"Ca (2, 8, 8, 2) ඉලෙක්ට්‍රෝන 2ක් දී Ca²⁺ සාදයි. Cl එක බැගින් ලබා Cl⁻ සාදයි. ලෝහයක් හා අලෝහයක් අතර බන්ධනය අයනිකයි."],["Which option correctly gives the bond type in CaCl₂ and the calcium ion?",["covalent, Ca²⁺","ionic, Ca²⁺","ionic, Ca⁺","covalent, Ca⁺"],"Ca (2, 8, 8, 2) gives up 2 electrons to form Ca²⁺; each Cl gains one to form Cl⁻. A bond between a metal and a non-metal is ionic."],""],["MOLE",0,["CO₂ 4.4 g හි ඇති මවුල ප්‍රමාණය කීයද? (C = 12, O = 16)",["0.1","0.2","1","4.4"],"CO₂ සාපේක්ෂ අණුක ස්කන්ධය = 12 + 32 = 44. n = 4.4 / 44 = 0.1 mol."],["How many moles are in 4.4 g of CO₂? (C = 12, O = 16)",["0.1","0.2","1","4.4"],"Relative molecular mass of CO₂ = 12 + 32 = 44. n = 4.4 / 44 = 0.1 mol."],""],["MOLE",1,["0.2 mol dm⁻³ NaOH ද්‍රාවණයක් 500 cm³ සෑදීමට අවශ්‍ය NaOH ස්කන්ධය කීයද? (Na = 23, O = 16, H = 1)",["2 g","4 g","8 g","40 g"],"n = 0.2 × 0.5 = 0.1 mol. ස්කන්ධය = 0.1 × 40 = 4 g."],["What mass of NaOH is needed to make 500 cm³ of 0.2 mol dm⁻³ NaOH solution? (Na = 23, O = 16, H = 1)",["2 g","4 g","8 g","40 g"],"n = 0.2 × 0.5 = 0.1 mol. Mass = 0.1 × 40 = 4 g."],""],["FORCE",1,["2 kg වස්තුවකට 10 N තිරස් බලයක් යොදයි. ඝර්ෂණ බලය 4 N නම් ත්වරණය කීයද?",["2 m s⁻²","3 m s⁻²","5 m s⁻²","7 m s⁻²"],"අසංතුලිත බලය = 10 − 4 = 6 N. a = F/m = 6/2 = 3 m s⁻²."],["A horizontal force of 10 N acts on a 2 kg object. If friction is 4 N, what is the acceleration?",["2 m s⁻²","3 m s⁻²","5 m s⁻²","7 m s⁻²"],"Unbalanced force = 10 − 4 = 6 N. a = F/m = 6/2 = 3 m s⁻²."],""],["FORCE",2,["නිශ්චලතාවයේ සිට ඒකාකාරව ත්වරණය වන වස්තුවක ප්‍රවේගය 5 s දී 10 m s⁻¹ වේ. එම කාලය තුළ විස්ථාපනය කීයද?",["2 m","10 m","25 m","50 m"],"v-t ප්‍රස්තාරය යට ත්‍රිකෝණයේ වර්ගඵලය = ½ × 5 × 10 = 25 m."],["An object accelerates uniformly from rest to 10 m s⁻¹ in 5 s. What is its displacement in that time?",["2 m","10 m","25 m","50 m"],"Area of the triangle under the v-t graph = ½ × 5 × 10 = 25 m."],""],["FORCE",1,["30 cm දිග ස්පැනරයක කෙළවරට 20 N බලයක් ලම්බව යොදයි. ඇණය වටා සූර්ණය කීයද?",["0.6 N m","6 N m","60 N m","600 N m"],"M = F × d = 20 × 0.3 = 6 N m. සෙන්ටිමීටර මීටර බවට හැරවීමට මතක තබාගන්න."],["A force of 20 N is applied at right angles to the end of a 30 cm spanner. What is the moment about the nut?",["0.6 N m","6 N m","60 N m","600 N m"],"M = F × d = 20 × 0.3 = 6 N m. Remember to convert centimetres to metres."],""],["FORCE",0,["ධාවනය වන බසයක හදිසියේ තිරිංග යෙදූ විට මගීන් ඉදිරියට විසි වීම පැහැදිලි කරන්නේ,",["නිව්ටන්ගේ පළමු නියමය","නිව්ටන්ගේ දෙවන නියමය","නිව්ටන්ගේ තුන්වන නියමය","ආකිමිඩීස් මූලධර්මය"],"අවස්ථිතිය: බාහිර බලයක් නැති නම් චලනය වන වස්තුවක් දිගටම චලනය වේ."],["When a moving bus brakes suddenly, the passengers are thrown forward. This is explained by",["Newton's first law","Newton's second law","Newton's third law","Archimedes' principle"],"Inertia: without an external force, a moving body keeps moving."],""],["FORCE",2,["පහත ඒවා අතරින් අදිශ රාශියක් වන්නේ කුමක්ද?",["ප්‍රවේගය","විස්ථාපනය","වේගය","බලය"],"වේගයට විශාලත්වය පමණක් ඇත. අනෙක් ඒවාට විශාලත්වය සහ දිශාව යන දෙකම ඇති නිසා ඒවා දෛශිකයි."],["Which of the following is a scalar quantity?",["velocity","displacement","speed","force"],"Speed has magnitude only. The others have both magnitude and direction, so they are vectors."],""],["ELEC",0,["4 Ω ප්‍රතිරෝධක දෙකක් සමාන්තරගතව සම්බන්ධ කළ විට සමක ප්‍රතිරෝධය කීයද?",["2 Ω","4 Ω","8 Ω","16 Ω"],"1/R = 1/4 + 1/4 = 1/2, එබැවින් R = 2 Ω. සමාන්තරගත සමක ප්‍රතිරෝධය කුඩාම ප්‍රතිරෝධයටත් වඩා අඩුය."],["What is the equivalent resistance of two 4 Ω resistors connected in parallel?",["2 Ω","4 Ω","8 Ω","16 Ω"],"1/R = 1/4 + 1/4 = 1/2, so R = 2 Ω. A parallel combination is smaller than the smallest resistor."],""],["ELEC",2,["12 V සැපයුමකට 6 Ω ප්‍රතිරෝධකයක් සම්බන්ධ කළ විට එහි ජවය කීයද?",["2 W","12 W","24 W","72 W"],"I = V/R = 2 A. P = VI = 12 × 2 = 24 W."],["A 6 Ω resistor is connected to a 12 V supply. What power does it dissipate?",["2 W","12 W","24 W","72 W"],"I = V/R = 2 A. P = VI = 12 × 2 = 24 W."],""],["ELEC",0,["1000 W ජල තාපකයක් දිනකට මිනිත්තු 30ක් දින 30ක් භාවිත කළහොත් වැය වන විදුලි ඒකක ගණන,",["15","30","150","500"],"දිනකට 1 kW × 0.5 h = 0.5 kWh. දින 30 සඳහා 15 kWh, එනම් ඒකක 15."],["A 1000 W water heater is used for 30 minutes a day for 30 days. How many units of electricity are used?",["15","30","150","500"],"Per day: 1 kW × 0.5 h = 0.5 kWh. For 30 days: 15 kWh, i.e. 15 units."],""],["ELEC",0,["ගෘහ විදුලි පරිපථයක විලායකය (fuse) සම්බන්ධ කරන්නේ,",["සජීවී කම්බියට ශ්‍රේණිගතව","උදාසීන කම්බියට සමාන්තරගතව","භූගත කම්බියට","සජීවී කම්බියට සමාන්තරගතව"],"අධික ධාරාවක් ගලන විට විලායකය දිය වී සජීවී කම්බිය විසන්ධි කර උපකරණය ආරක්ෂා කරයි."],["In a household circuit, the fuse is connected",["in series with the live wire","in parallel with the neutral wire","to the earth wire","in parallel with the live wire"],"When too much current flows, the fuse melts and disconnects the live wire, protecting the appliance."],""],["LIGHT",0,["නාභි දුර 10 cm වන උත්තල කාචයක සිට 15 cm දුරින් වස්තුවක් තැබූ විට ලැබෙන ප්‍රතිබිම්බය,",["තාත්වික, යටිකුරු, විශාල","තාත්වික, යටිකුරු, කුඩා","අතාත්වික, උඩුකුරු, විශාල","තාත්වික, යටිකුරු, සමාන ප්‍රමාණය"],"f < u < 2f (10 < 15 < 20) නිසා ප්‍රතිබිම්බය 2F ට එපිට, තාත්වික, යටිකුරු සහ විශාලය (ප්‍රක්ෂේපකය)."],["An object is placed 15 cm from a convex lens of focal length 10 cm. The image is",["real, inverted, magnified","real, inverted, diminished","virtual, upright, magnified","real, inverted, same size"],"f < u < 2f (10 < 15 < 20), so the image is beyond 2F, real, inverted and magnified (projector)."],""],["LIGHT",3,["උත්තල කාචයක් අත් කාචයක් ලෙස භාවිත කිරීමට වස්තුව තැබිය යුත්තේ,",["2F ට එපිට","F සහ 2F අතර","F හිම","F සහ කාචය අතර"],"u < f විට අතාත්වික, උඩුකුරු, විශාල ප්‍රතිබිම්බයක් ලැබේ."],["To use a convex lens as a magnifying glass, the object must be placed",["beyond 2F","between F and 2F","at F","between F and the lens"],"When u < f, the image is virtual, upright and magnified."],""],["LIGHT",2,["ආලෝක කිරණයක් ජලයේ සිට වාතයට යන විට පතන කෝණය අවධි කෝණයට වඩා වැඩි නම් සිදු වන්නේ,",["කිරණය අපගමනය නොවී යයි","කිරණය අභිලම්බයෙන් ඉවතට වර්තනය වේ","පූර්ණ අභ්‍යන්තර පරාවර්තනය","කිරණය ජල පෘෂ්ඨය දිගේ යයි"],"ඝන මාධ්‍යයක සිට විරල මාධ්‍යයකට යන විට පතන කෝණය අවධි කෝණය ඉක්මවූ විට ආලෝකය සම්පූර්ණයෙන්ම පරාවර්තනය වේ. ප්‍රකාශ තන්තු ක්‍රියා කරන්නේ මේ ආකාරයටයි."],["A ray of light travels from water into air with an angle of incidence greater than the critical angle. What happens?",["the ray passes straight through","the ray refracts away from the normal","total internal reflection","the ray travels along the surface"],"Going from a denser to a less dense medium, light is totally reflected when the angle of incidence exceeds the critical angle. Optical fibres work this way."],""],["CHEM",1,["තනුක H₂SO₄ හි Zn සහ Cu ඉලෙක්ට්‍රෝඩ සහිත සරල කෝෂයක H₂ බුබුළු ප්‍රධාන වශයෙන් ඇති වන්නේ,",["Zn ඉලෙක්ට්‍රෝඩය මත","Cu ඉලෙක්ට්‍රෝඩය මත","ඉලෙක්ට්‍රෝඩ දෙකම මත සමානව","බාහිර කම්බිය මත"],"ඉලෙක්ට්‍රෝන Zn සිට Cu (කැතෝඩය) වෙත ගලයි. එහිදී 2H⁺ + 2e⁻ → H₂ සිදු වේ."],["In a simple cell with Zn and Cu electrodes in dilute H₂SO₄, H₂ bubbles form mainly",["on the Zn electrode","on the Cu electrode","equally on both electrodes","on the external wire"],"Electrons flow from Zn to Cu (the cathode), where 2H⁺ + 2e⁻ → H₂ takes place."],""],["CHEM",2,["නැවක යකඩ කඳ විඛාදනයෙන් ආරක්ෂා කිරීමට සවි කරන ලෝහ කුට්ටි සඳහා වඩාත් සුදුසු ලෝහය,",["Cu","Ag","Zn","Pb"],"Zn යකඩට වඩා සක්‍රිය නිසා පළමුව ඔක්සිකරණය වී යකඩ ආරක්ෂා කරයි (කැතෝඩීය ආරක්ෂණය)."],["Which metal is most suitable for blocks attached to a ship's iron hull to protect it from corrosion?",["Cu","Ag","Zn","Pb"],"Zn is more reactive than iron, so it is oxidized first and protects the iron (cathodic protection)."],""],["CHEM",1,["X ලෝහය CuSO₄ ද්‍රාවණයකින් Cu විස්ථාපනය කරයි. නමුත් ZnSO₄ ද්‍රාවණයකින් Zn විස්ථාපනය නොකරයි. X විය හැක්කේ,",["Mg","Fe","Ag","Al"],"සක්‍රියතා ශ්‍රේණිය: Mg > Al > Zn > Fe > Cu > Ag. Fe, Zn ට පහළින් සහ Cu ට ඉහළින් ඇත."],["Metal X displaces Cu from CuSO₄ solution but does not displace Zn from ZnSO₄ solution. X could be",["Mg","Fe","Ag","Al"],"Activity series: Mg > Al > Zn > Fe > Cu > Ag. Fe is below Zn and above Cu."],""],["CHEM",2,["පහත ඒවා අතරින් ජලීය ද්‍රාවණයේ සම්පූර්ණයෙන් අයනීකරණය වන ප්‍රබල අම්ලය කුමක්ද?",["CH₃COOH","H₂CO₃","HNO₃","සිට්‍රික් අම්ලය"],"HNO₃, HCl, H₂SO₄ ප්‍රබල අම්ල වේ. ඇසිටික් අම්ලය සහ කාබොනික් අම්ලය දුබල අම්ල වේ."],["Which of these is a strong acid that ionizes completely in aqueous solution?",["CH₃COOH","H₂CO₃","HNO₃","citric acid"],"HNO₃, HCl and H₂SO₄ are strong acids. Acetic acid and carbonic acid are weak acids."],""],["CHEM",0,["C₃H₈ අයත් වන්නේ කුමන හයිඩ්‍රොකාබන ශ්‍රේණියටද?",["ඇල්කේන","ඇල්කීන","ඇල්කයින","ඇල්කොහොල්"],"ඇල්කේනවල පොදු සූත්‍රය CₙH₂ₙ₊₂. n = 3 විට C₃H₈ (ප්‍රොපේන්)."],["To which homologous series does C₃H₈ belong?",["alkanes","alkenes","alkynes","alcohols"],"The general formula of alkanes is CₙH₂ₙ₊₂. With n = 3 this gives C₃H₈ (propane)."],""],["CHEM",1,["කැබලිවලට වඩා කුඩු කළ CaCO₃ තනුක HCl සමඟ ශීඝ්‍රයෙන් ප්‍රතික්‍රියා කිරීමට හේතුව,",["ස්කන්ධය වැඩි වීම","පෘෂ්ඨ වර්ගඵලය වැඩි වීම","උෂ්ණත්වය වැඩි වීම","සාන්ද්‍රණය වැඩි වීම"],"කුඩු කළ විට අම්ලය හා ස්පර්ශ වන පෘෂ්ඨය වැඩි වේ. එබැවින් ගැටුම් වැඩි වී ශීඝ්‍රතාව වැඩි වේ."],["Powdered CaCO₃ reacts faster with dilute HCl than lumps because",["the mass is greater","the surface area is greater","the temperature is higher","the concentration is higher"],"Powdering increases the surface in contact with the acid, so there are more collisions and the rate increases."],""],["HEATCHEM",2,["පහත ඒවා අතරින් තාපාවශෝෂක වෙනසක් වන්නේ කුමක්ද?",["මීතේන් දහනය","HCl සහ NaOH උදාසීනීකරණය","NH₄Cl ජලයේ දිය වීම","Mg සහ තනුක HCl ප්‍රතික්‍රියාව"],"NH₄Cl දිය වීමේදී තාපය අවශෝෂණය කරන නිසා ද්‍රාවණය සිසිල් වේ. අනෙක් ඒවා තාපදායකයි."],["Which of the following is an endothermic change?",["burning methane","neutralizing HCl with NaOH","dissolving NH₄Cl in water","reacting Mg with dilute HCl"],"Dissolving NH₄Cl absorbs heat, so the solution gets colder. The others are exothermic."],""],["HEATCHEM",2,["ජලය 100 g ක උෂ්ණත්වය 5 °C කින් ඉහළ නැංවීමට අවශ්‍ය තාපය කීයද? (c = 4200 J kg⁻¹ °C⁻¹)",["210 J","420 J","2100 J","21000 J"],"Q = mcθ = 0.1 × 4200 × 5 = 2100 J. ග්‍රෑම් කිලෝග්‍රෑම් බවට හැරවීමට මතක තබාගන්න."],["How much heat is needed to raise the temperature of 100 g of water by 5 °C? (c = 4200 J kg⁻¹ °C⁻¹)",["210 J","420 J","2100 J","21000 J"],"Q = mcθ = 0.1 × 4200 × 5 = 2100 J. Remember to convert grams to kilograms."],""],["NUTR",1,["ජීර්ණයේදී පිතෙහි කාර්යය කුමක්ද?",["ප්‍රෝටීන ජීර්ණය","මේද පායනය (emulsify)","පිෂ්ඨ ජීර්ණය","ජලය අවශෝෂණය"],"පිතෙහි එන්සයිම නැත. එය මේද කුඩා බිඳිති බවට පත් කර ලයිපේස් ක්‍රියාවට පෘෂ්ඨය වැඩි කරයි."],["What is the function of bile in digestion?",["digesting proteins","emulsifying fats","digesting starch","absorbing water"],"Bile has no enzymes. It breaks fats into small droplets, increasing the surface for lipase to act on."],""],["NUTR",1,["පෙප්සින් එන්සයිමය ක්‍රියා කරන ස්ථානය සහ මාධ්‍යය,",["මුඛය, උදාසීන","ආමාශය, ආම්ලික","කුඩා අන්ත්‍රය, භාස්මික","මහා අන්ත්‍රය, ආම්ලික"],"ආමාශයේ HCl නිසා pH ≈ 2. පෙප්සින් එහි ප්‍රෝටීන පොලිපෙප්ටයිඩ බවට කඩයි."],["Where does the enzyme pepsin act, and in what medium?",["mouth, neutral","stomach, acidic","small intestine, basic","large intestine, acidic"],"HCl in the stomach makes the pH ≈ 2. There, pepsin breaks proteins into polypeptides."],""],["CIRC",1,["ඔක්සිජන් සහිත රුධිරය රැගෙන යන ශිරාව කුමක්ද?",["මහා ශිරාව","පුප්ඵුසීය ශිරාව","වෘක්ක ශිරාව","යකෘත් ද්වාර ශිරාව"],"පුප්ඵුසීය ශිරාව පෙනහළුවල සිට ඔක්සිජන් සහිත රුධිරය වම් කර්ණිකාවට ගෙන එයි."],["Which vein carries oxygenated blood?",["vena cava","pulmonary vein","renal vein","hepatic portal vein"],"The pulmonary vein brings oxygenated blood from the lungs to the left atrium."],""],["CIRC",3,["මිනිස් හෘදයේ ඝනම බිත්තිය ඇති කුටීරය,",["දකුණු කර්ණිකාව","වම් කර්ණිකාව","දකුණු කෝෂිකාව","වම් කෝෂිකාව"],"වම් කෝෂිකාව රුධිරය මුළු සිරුරටම පොම්ප කළ යුතු නිසා එහි පේශි බිත්තිය ඝනම වේ."],["Which chamber of the human heart has the thickest wall?",["right atrium","left atrium","right ventricle","left ventricle"],"The left ventricle must pump blood to the whole body, so its muscular wall is the thickest."],""],["GEN",2,["උස (Tt) ශාකයක් මිටි (tt) ශාකයක් සමඟ ගුණනය කළ විට මිටි ශාක ලැබීමේ ප්‍රතිශතය,",["0%","25%","50%","75%"],"Tt × tt → Tt, Tt, tt, tt. මිටි (tt) 2/4 = 50%."],["A tall (Tt) plant is crossed with a short (tt) plant. What percentage of the offspring will be short?",["0%","25%","50%","75%"],"Tt × tt → Tt, Tt, tt, tt. Short (tt) = 2/4 = 50%."],""],["GEN",1,["පහත ඒවා අතරින් ලිංග-ප්‍රතිබද්ධ ප්‍රවේණික රෝගයක් වන්නේ,",["තැලසීමියාව","හිමොෆීලියාව","දියවැඩියාව","ඇල්බිනිසම්"],"හිමොෆීලියාව සහ වර්ණ අන්ධතාව X වර්ණදේහයේ ජාන නිසා ඇති වේ. ඒ නිසා පිරිමින්ට බහුලව වැළඳේ."],["Which of the following is a sex-linked genetic disorder?",["thalassaemia","haemophilia","diabetes","albinism"],"Haemophilia and colour blindness are caused by genes on the X chromosome, so they are more common in males."],""],["PRESS",2,["ජලාශයක 5 m ගැඹුරේ ජල පීඩනය කීයද? (ρ = 1000 kg m⁻³, g = 10 m s⁻²)",["5 × 10² Pa","5 × 10³ Pa","5 × 10⁴ Pa","5 × 10⁵ Pa"],"P = hρg = 5 × 1000 × 10 = 50 000 Pa = 5 × 10⁴ Pa."],["What is the water pressure at a depth of 5 m in a reservoir? (ρ = 1000 kg m⁻³, g = 10 m s⁻²)",["5 × 10² Pa","5 × 10³ Pa","5 × 10⁴ Pa","5 × 10⁵ Pa"],"P = hρg = 5 × 1000 × 10 = 50 000 Pa = 5 × 10⁴ Pa."],""],["PRESS",2,["හයිඩ්‍රොලික් ජැක්කුවක කුඩා පිස්ටනයේ වර්ගඵලය 0.01 m², විශාල පිස්ටනයේ 0.5 m². කුඩා පිස්ටනයට 100 N යෙදූ විට විශාල පිස්ටනය මත බලය,",["2 N","500 N","5000 N","50 000 N"],"පීඩනය සමානයි: F₁/A₁ = F₂/A₂. F₂ = 100 × 0.5 / 0.01 = 5000 N."],["In a hydraulic jack the small piston has an area of 0.01 m² and the large piston 0.5 m². If 100 N is applied to the small piston, the force on the large piston is",["2 N","500 N","5000 N","50 000 N"],"The pressure is the same: F₁/A₁ = F₂/A₂. F₂ = 100 × 0.5 / 0.01 = 5000 N."],""],["PRESS",1,["ලී කුට්ටියක් ජලයේ පාවෙන විට එය මත ක්‍රියා කරන උත්ප්ලාවකතාව,",["ලී කුට්ටියේ බරට වඩා වැඩිය","ලී කුට්ටියේ බරට සමානය","ලී කුට්ටියේ බරට වඩා අඩුය","ශුන්‍යය"],"පාවෙන වස්තුවක සම්ප්‍රයුක්ත බලය ශුන්‍යයි. එබැවින් උත්ප්ලාවකතාව = බර = විස්ථාපිත ජලයේ බර."],["When a block of wood floats in water, the upthrust on it is",["greater than its weight","equal to its weight","less than its weight","zero"],"The resultant force on a floating body is zero, so upthrust = weight = weight of water displaced."],""],["BIO",1,["ප්‍රභාසංශ්ලේෂණයට CO₂ අවශ්‍ය බව පෙන්වන පරීක්ෂණයක CO₂ අවශෝෂණය කිරීමට භාවිත කරන්නේ,",["හුණු ජලය","KOH ද්‍රාවණය","අයඩින් ද්‍රාවණය","එතිල් ඇල්කොහොල්"],"KOH (හෝ NaOH) CO₂ අවශෝෂණය කරයි. හුණු ජලය CO₂ හඳුනා ගැනීමට පමණක් භාවිත කරයි."],["In an experiment to show that CO₂ is needed for photosynthesis, CO₂ is absorbed using",["lime water","KOH solution","iodine solution","ethyl alcohol"],"KOH (or NaOH) absorbs CO₂. Lime water is only used to test for CO₂."],""],["BIO",1,["පිෂ්ඨ පරීක්ෂාවේදී පත්‍රය ජල තාපකයක ඇල්කොහොල්වල තැම්බීමේ අරමුණ,",["සෛල මරා දැමීම","හරිතප්‍රද ඉවත් කිරීම","පිෂ්ඨ ජීර්ණය කිරීම","පත්‍රය මෘදු කිරීම"],"හරිතප්‍රද ඉවත් කළ විට අයඩින් වර්ණ වෙනස (නිල්/දම්) පැහැදිලිව දැකිය හැක."],["In the starch test, the leaf is boiled in alcohol over a water bath in order to",["kill the cells","remove the chlorophyll","digest the starch","soften the leaf"],"With the chlorophyll removed, the iodine colour change (blue-black) can be seen clearly."],""],["BIO",2,["සත්ව සෛලයක නැති, නමුත් සෑම ශාක සෛලයකම ඇති ව්‍යුහය,",["න්‍යෂ්ටිය","මයිටොකොන්ඩ්‍රියා","සෛල බිත්තිය","සෛල පටලය"],"සෙලියුලෝස් සෛල බිත්තිය සෑම ශාක සෛලයකම ඇත. හරිතලව සෑම ශාක සෛලයකම නැත (උදා. මුල් සෛල)."],["Which structure is found in every plant cell but not in animal cells?",["nucleus","mitochondria","cell wall","cell membrane"],"Every plant cell has a cellulose cell wall. Not every plant cell has chloroplasts (e.g. root cells)."],""],["BIO",2,["බාහිර සැකිල්ලක්, සන්ධි සහිත උපාංග සහ ඛණ්ඩිත දේහයක් ඇති සතා අයත් වංශය,",["ඇනලීඩා","මොලුස්කා","ආත්‍රපෝඩා","කෝඩේටා"],"කැරපොත්තා, මකුළුවා, පත්තෑයා ආත්‍රපෝඩාවන්ය. ඇනලීඩාවන්ට (ගැඬවිලා) සන්ධි සහිත උපාංග නැත."],["An animal with an exoskeleton, jointed appendages and a segmented body belongs to the phylum",["Annelida","Mollusca","Arthropoda","Chordata"],"Cockroaches, spiders and centipedes are arthropods. Annelids (earthworms) have no jointed appendages."],""],["BIO",1,["මිනිස් ගැහැණු ප්‍රජනක පද්ධතියේ සංසේචනය සිදු වන ස්ථානය,",["ඩිම්බ කෝෂය","පැලෝපීය නාලය","ගර්භාෂය","යෝනි මාර්ගය"],"සංසේචනය පැලෝපීය නාලයේදී සිදු වේ. කලලය ගර්භාෂ බිත්තියේ තැන්පත් වේ."],["Where does fertilization take place in the human female reproductive system?",["ovary","fallopian tube (oviduct)","uterus","vagina"],"Fertilization takes place in the fallopian tube. The embryo then implants in the wall of the uterus."],""]]}},"ict":{"cfg":{"key":"ict","si":"ICTQuest O/L තොරතුරු තාක්ෂණය","en":"ICTQuest O/L ICT","folder":"","p2rule":["1 වන ප්‍රශ්නය සහ තවත් ප්‍රශ්න 4ක් (පැය 2).","Answer question 1 and any four others (2 hours)."]},"data":{"names":{"PROG":["ක්‍රමලේඛනය (ගැලීම් සටහන්, ව්‍යාජ කේත, Pascal)","Programming (flowcharts, pseudocode, Pascal)"],"DB":["දත්ත සමුදාය","Databases"],"WEB":["වෙබ් අඩවි, HTML, ඊ  the output Q of the gate expression Q = A · B̄ for A = 1, B = 0, and name the gates used. <span class=\"m\">(2)</span></li><li>Name <b>two</b> functions of an operating system. <span class=\"m\">(2)</span></li><li>Give <b>two</b> examples of an input device and state one use of each. <span class=\"m\">(2)</span></li><li>What is the purpose of the <i>Mail Merge</i> facility in a word processor? <span class=\"m\">(2)</span></li><li>State <b>two</b> features that make a presentation effective. <span class=\"m\">(2)</span></li><li>Write the value of x after this pseudocode runs: x ← 3; x ← x * 2 + 1 <span class=\"m\">(2)</span></li><li>Name the SDLC stage in which (a) user requirements are gathered (b) the system is handed to the user. <span class=\"m\">(2)</span></li><li>Write the HTML tag used to (a) insert an image (b) create a hyperlink. <span class=\"m\">(2)</span></li></ol>","<ol type=\"i\"><li>101101<sub>2</sub> (2)</li><li>RAM volatile/read-write; ROM non-volatile/read-only (any two, 1+1)</li><li>Q = 1 (1); AND and NOT (1)</li><li>any two: manage memory, manage files, manage processes, provide user interface, manage devices (1+1)</li><li>e.g. keyboard – typing text; scanner – digitizing documents; mouse; microphone (1+1)</li><li>to produce personalised letters by combining a main document with a data source (2)</li><li>any two: few words per slide, readable font/size, consistent theme, relevant images, suitable transitions (1+1)</li><li>7 (2)</li><li>(a) analysis/requirement analysis (1) (b) implementation/deployment (1)</li><li>(a) &lt;img&gt; (1) (b) &lt;a&gt; (1)</li></ol>"],["2",2,10,"\n<p>A stationery shop records sales in a spreadsheet.</p><table class=\"t\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr><tr><td>1</td><td>Item</td><td>Unit price (Rs.)</td><td>Quantity</td><td>Total (Rs.)</td><td>Discount (Rs.)</td></tr><tr><td>2</td><td>Exercise book</td><td>120</td><td>10</td><td></td><td></td></tr><tr><td>3</td><td>Pen</td><td>40</t hopping site (1)</li></ol>"],["2",2,10,"\n<p>Electricity bills of a household are recorded in a spreadsheet. The rate per unit is given in cell B1.</p>\n<table class=\"t\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td>1</td><td>Rate per unit (Rs.)</td><td>32</td><td></td><td></td></tr><tr><td>2</td><td>Month</td><td>Units used</td><td>Charge (Rs.)</td><td>Status</td></tr><tr><td>3</td><td>January</td><td>85</td><td></td><td></td></tr><tr><td>4</td><td>February</td><td>120</td><td></td><td></td></tr><tr><td>5</td><td>March</td><td>95</td><td></td><td></td></tr><tr><td>6</td><td>April</td><td>140</td><td></td><td></td></tr></table>\n<ol type=\"a\">\n<li>Write a formula in C3 using the rate in B1, which can be copied down to C6. <span class=\"m\">(3)</span></li>\n<li>What type of cell reference did you use for B1? <span class=\"m\">(1)</span></li>\n<li>D3 should show \"High\" if units are more than 100, otherwise \"Normal\". Write the formula. <span class=\"m\">(2)</span></li>\n<li>Write a formula to find the total charge for four months. <span class=\"m\">(2)</span></li>\n<li>Which chart is suitable to compare the units used each month? <span class=\"m\">(1)</span></li>\n<li>If the rate in B1 is changed, what happens to column C? <span class=\"m\">(1)</span></li>\n</ol>","(a) =B3*$B$1 (3) · (b) absolute (1) · (c) =IF(B3&gt;100,\"High\",\"Normal\") (2) · (d) =SUM(C3:C6) (2) · (e) column/bar chart (1) · (f) recalculates automatically (1)"],["3",3,10,"\n<p>Consider the tables of a school sports database.</p>\n<p><b>Student</b>(AdmNo, Name, House)<br><b>Event</b>(EventCode, EventName, Venue)<br><b>Participation</b>(AdmNo, EventCode, Place)</p>\n<ol type=\"a\">\n<li>What is a composite key? Identify the composite key in this database. <span class=\"m\">(2)</span></li>\n<li>Draw the relationships among the three tables. <span class=\"m\">(3)</span></li>\n<li>State the relationship between Student and Event. <span class=\"m\">(1)</span></li>\n<li>What is referential integrity? <span class=\"m\">(2)</span></li>\n<li>Name <b>two</b> objects of a DBMS other than tables. <span class=\"m\">(2)</span></li>\n</ol>","(a) primary key made of two or more fields (1); (AdmNo, EventCode) in Participation (1) · (b) Student 1–M Participation, Event 1–M Participation with key fields joined (3) · (c) many-to-many (1) · (d) a foreign key value must match an existing primary key value in the related table (2) · (e) queries, forms, reports (2)"],["4",4,10,"\n<p>The following algorithm finds the largest of N numbers.</p>\n<pre>BEGIN\n  INPUT N\n  INPUT num\n  largest ← num\n  FOR i ← 2 TO N\n     INPUT num\n     IF num &gt; largest THEN\n        largest ← num\n     ENDIF\n  ENDFOR\n  OUTPUT largest\nEND</pre>\n<ol type=\"a\">\n<li>Draw a trace table for N = 4 and inputs 15, 42, 8, 30. <span class=\"m\">(4)</span></li>\n<li>Write the output. <span class=\"m\">(1)</span></li>\n<li>Modify the algorithm to also find the smallest number. <span class=\"m\">(3)</span></li>\n<li>What is the difference between a FOR loop and a WHILE loop? <span class=\"m\">(2)</span></li>\n</ol>","(a) columns i, num, largest: –,15,15; 2,42,42; 3,8,42; 4,30,42 (4) · (b) 42 (1) · (c) smallest ← num at start (1); IF num &lt; smallest THEN smallest ← num inside loop (1); OUTPUT smallest (1) · (d) FOR repeats a fixed number of times; WHILE repeats while a condition is true/count unknown (2)"],["5",5,10,"\n<p>A student designs a web page for the school ICT society.</p>\n<ol type=\"a\">\n<li>Write the basic structure of an HTML document. <span class=\"m\">(3)</span></li>\n<li>Write HTML to display the heading \"ICT Society\" as the largest heading and centred. <span class=\"m\">(2)</span></li>\n<li>Write HTML to create a link that opens <i>www.example.lk</i>. <span class=\"m\">(2)</span></li>\n<li>What is the difference between &lt;br&gt; and &lt;p&gt;? <span class=\"m\">(2)</span></li>\n<li>What is a web server? <span class=\"m\">(1)</span></li>\n</ol>","(a) &lt;html&gt;&lt;head&gt;&lt;title&gt;…&lt;/title&gt;&lt;/head&gt;&lt;body&gt;…&lt;/body&gt;&lt;/html&gt; (3) · (b) &lt;h1 align=\"center\"&gt;ICT Society&lt;/h1&gt; or &lt;center&gt;&lt;h1&gt;… (2) · (c) &lt;a href=\"http://www.example.lk\"&gt;text&lt;/a&gt; (2) · (d) &lt;br&gt; line break without space; &lt;p&gt; starts a new paragraph with space (2) · (e) computer that stores web pages and sends them to clients (1)"],["6",6,10,"\n<p>A student prepares a word-processed report and a presentation for a science exhibition.</p>\n<ol type=\"a\">\n<li>State <b>two</b> ways to insert page numbers and a header in the report. <span class=\"m\">(2)</span></li>\n<li>What is the use of a table of contents? How can it be created automatically? <span class=\"m\">(2)</span></li>\n<li>What is the difference between <i>Save</i> and <i>Save As</i>? <span class=\"m\">(2)</span></li>\n<li>What is the difference between slide transitions and custom animations? <span class=\"m\">(2)</span></li>\n<li>Name <b>two</b> presentation views and state the use of one. <span class=\"m\">(2)</span></li>\n</ol>","(a) Insert → Page Number; Insert → Header (2) · (b) lists headings with page numbers (1); apply heading styles and insert TOC (1) · (c) Save stores changes with the same name; Save As saves with a new name/location/format (2) · (d) transition – effect between slides; animation – effect on objects within a slide (2) · (e) normal, slide sorter, slide show, notes page (1); e.g. slide sorter used to rearrange slides (1)"],["7",7,10,"\n<ol type=\"a\">\n<li>Name <b>three</b> types of malware and briefly describe one. <span class=\"m\">(3)</span></li>\n<li>What is a firewall? <span class=\"m\">(1)</span></li>\n<li>State <b>two</b> advantages and <b>one</b> disadvantage of using ICT in education. <span class=\"m\">(3)</span></li>\n<li>What is the digital divide? <span class=\"m\">(1)</span></li>\n<li>State <b>two</b> ways to dispose of e-waste safely. <span class=\"m\">(2)</span></li>\n</ol>","(a) virus, worm, Trojan horse, spyware, ransomware (2); correct description (1) · (b) hardware/software that controls incoming and outgoing network traffic to block unauthorized access (1) · (c) e-learning anywhere, multimedia lessons, research; disadvantage – cost/health issues/distraction (3) · (d) gap between people who have access to ICT and those who do not (1) · (e) recycle at authorized centres, return to manufacturer, donate/reuse (2)"]],"t1":60,"t2":120}],"qs":[["PROG",1,["පාසල් පුස්තකාල පද්ධතියක් \"සිසුවා ලබාගත් පොත් ගණන සහ ආපසු දිය යුතු දිනය\" ගණනය කර පෙන්වයි. පහත ඒවා අතරින් ප්‍රතිදානය (output) කුමක්ද?",["සිසුවාගේ ඇතුළත් වීමේ අංකය","ආපසු දිය යුතු දිනය","පොතේ ISBN අංකය","නිකුත් කළ දිනය"],"ප්‍රතිදානය යනු සැකසීමෙන් පසු පද්ධතිය පෙන්වන ප්‍රතිඵලයයි. ඇතුළත් වීමේ අංකය, ISBN, නිකුත් කළ දිනය ආදාන (input) වේ."],["A school library system calculates and shows \"the number of books borrowed and the return date\". Which of these is an output?",["the student admission number","the return date","the ISBN of the book","the issue date"],"An output is the result the system shows after processing. Admission number, ISBN and issue date are inputs."],"2016 Q15"],["PROG",2,["පහත Pascal කේතය ක්‍රියාත්මක කළ විට ප්‍රතිදානය කුමක්ද?<br><code>x := 2;<br>repeat<br>&nbsp;&nbsp;write(x, ' ');<br>&nbsp;&nbsp;x := x + 2;<br>until x > 6;</code>",["2 4","4 6","2 4 6","2 4 6 8"],"x = 2 → ලියයි 2, x=4 · 4 → x=6 · 6 → x=8; 8 > 6 නිසා නවතී. ප්‍රතිදානය 2 4 6."],["What is the output of this Pascal code?<br><code>x := 2;<br>repeat<br>&nbsp;&nbsp;write(x, ' ');<br>&nbsp;&nbsp;x := x + 2;<br>until x > 6;</code>",["2 4","4 6","2 4 6","2 4 6 8"],"x = 2 → prints 2, x=4 · prints 4 → x=6 · prints 6 → x=8; 8 > 6 so it stops. Output: 2 4 6."],"2016 Q36"],["PROG",3,["1 සිට 50 දක්වා ඉරට්ටේ සංඛ්‍යාවල එකතුව සොයන පහත ව්‍යාජ කේතයේ X සඳහා නිවැරදි කොන්දේසිය කුමක්ද?<br><code>sum = 0<br>n = 0<br>REPEAT<br>&nbsp;&nbsp;n = n + 2<br>&nbsp;&nbsp;sum = sum + n<br>UNTIL X</code>",["n < 50","n > 50","n <= 50","n >= 50"],"n = 2, 4, … 50 දක්වා එකතු විය යුතුය. 50 එකතු කළ පසු නතර විය යුතු නිසා UNTIL n >= 50."],["In this pseudocode to add the even numbers from 1 to 50, what is the correct condition for X?<br><code>sum = 0<br>n = 0<br>REPEAT<br>&nbsp;&nbsp;n = n + 2<br>&nbsp;&nbsp;sum = sum + n<br>UNTIL X</code>",["n < 50","n > 50","n <= 50","n >= 50"],"n must go 2, 4, … 50. After adding 50 the loop must stop, so UNTIL n >= 50."],"2016 Q37"],["PROG",0,["සංඛ්‍යා 10ක් ආදානය කර විශාලතම සොයන ගැලීම් සටහනක, නව සංඛ්‍යාව N, Max ට වඩා විශාල නම් කළ යුත්තේ කුමක්ද?",["Max = N","N = Max","Max = Max + N","N = N + 1"],"නව සංඛ්‍යාව දැනට ඇති විශාලතමයට වඩා විශාල නම්, එය නව විශාලතමය ලෙස Max හි ගබඩා කරයි."],["In a flowchart that inputs 10 numbers and finds the largest, what should happen if the new number N is greater than Max?",["Max = N","N = Max","Max = Max + N","N = N + 1"],"If the new number is bigger than the current largest, it becomes the new largest and is stored in Max."],"2016 Q38"],["PROG",2,["පුනරාවර්තනයක් (loop) ඇතුළත IF තීරණයක් ඇති ගැලීම් සටහනකට ගැළපෙන ප්‍රකාශය කුමක්ද?",["පුනරාවර්තනය වරණය ඇතුළත ඇත","අනුක්‍රමය පමණක් ඇත","වරණය පුනරාවර්තනය ඇතුළත ඇත","වරණය වරණය ඇතුළත ඇත"],"ලූපය ඇතුළත IF එකක් ඇති නිසා වරණය (selection) පුනරාවර්තනය (repetition) ඇතුළත ඇත."],["A flowchart has an IF decision inside a loop. Which statement fits it?",["repetition is inside selection","there is only sequence","selection is inside repetition","selection is inside selection"],"The IF is inside the loop, so selection is inside repetition."],"2016 Q39"],["PROG",1,["පහත ව්‍යාජ කේතයේ \"Hi\" කී වරක් දර්ශනය වේද?<br><code>c = 1<br>WHILE c <= 3<br>&nbsp;&nbsp;DISPLAY \"Hi\"<br>&nbsp;&nbsp;c = c + 1<br>ENDWHILE<br>REPEAT<br>&nbsp;&nbsp;DISPLAY \"Hi\"<br>&nbsp;&nbsp;c = c - 1<br>UNTIL c < 3</code>",["3","5","4","6"],"WHILE: c = 1, 2, 3 → 3 වරක්, c = 4. REPEAT: \"Hi\", c=3 (3<3 නැත) → \"Hi\", c=2 (2<3 ඔව්) නවතී. මුළු 3 + 2 = 5."],["How many times is \"Hi\" displayed?<br><code>c = 1<br>WHILE c <= 3<br>&nbsp;&nbsp;DISPLAY \"Hi\"<br>&nbsp;&nbsp;c = c + 1<br>ENDWHILE<br>REPEAT<br>&nbsp;&nbsp;DISPLAY \"Hi\"<br>&nbsp;&nbsp;c = c - 1<br>UNTIL c < 3</code>",["3","5","4","6"],"WHILE: c = 1, 2, 3 → 3 times, c = 4. REPEAT: \"Hi\", c=3 (3<3 no) → \"Hi\", c=2 (yes) stop. Total 3 + 2 = 5."],"2016 Q40"],["PROG",0,["බස් ටිකට් යන්ත්‍රයකට ගමනාන්තය සහ මගීන් ගණන ඇතුළත් කළ විට, එය ගාස්තුව ගණනය කර ටිකට්පත මුද්‍රණය කරයි. ආදානය, ක්‍රියාවලිය සහ ප්‍රතිදානය පිළිවෙළින්,",["මගීන් ගණන, ගාස්තුව ගණනය කිරීම, ටිකට්පත","ටිකට්පත, මගීන් ගණන, ගාස්තුව ගණනය කිරීම","ගාස්තුව ගණනය කිරීම, ටිකට්පත, ගමනාන්තය","ගමනාන්තය, ටිකට්පත, ගාස්තුව ගණනය කිරීම"],"ආදානය = ඇතුළත් කරන දත්ත (මගීන් ගණන), ක්‍රියාවලිය = ගණනය කිරීම, ප්‍රතිදානය = ප්‍රතිඵලය (ටිකට්පත)."],["A bus ticket machine takes the destination and number of passengers, calculates the fare and prints a ticket. Input, process and output are, in order,",["number of passengers, calculating the fare, the ticket","the ticket, number of passengers, calculating the fare","calculating the fare, the ticket, the destination","the destination, the ticket, calculating the fare"],"Input = data entered (passengers), process = the calculation, output = the result (ticket)."],"2018 Q17"],["PROG",2,["පහත ව්‍යාජ කේතය අනුව නිවැරදි ප්‍රකාශය කුමක්ද?<br><code>discount = 0<br>IF amount > 5000 THEN<br>&nbsp;&nbsp;discount = 10<br>&nbsp;&nbsp;IF member = \"Yes\" THEN<br>&nbsp;&nbsp;&nbsp;&nbsp;discount = 15<br>&nbsp;&nbsp;ENDIF<br>ENDIF</code>",["amount = 4000, member = \"Yes\" නම් discount = 15","amount = 6000, member = \"No\" නම් discount = 0","amount = 6000, member = \"Yes\" නම් discount = 15","amount = 4000, member = \"No\" නම් discount = 10"],"පිටත IF සත්‍ය වන්නේ amount > 5000 විට පමණි. ඇතුළත IF සාමාජිකයන්ට 15 දෙයි. 6000 සහ \"Yes\" → 15."],["Which statement is correct for this pseudocode?<br><code>discount = 0<br>IF amount > 5000 THEN<br>&nbsp;&nbsp;discount = 10<br>&nbsp;&nbsp;IF member = \"Yes\" THEN<br>&nbsp;&nbsp;&nbsp;&nbsp;discount = 15<br>&nbsp;&nbsp;ENDIF<br>ENDIF</code>",["if amount = 4000 and member = \"Yes\", discount = 15","if amount = 6000 and member = \"No\", discount = 0","if amount = 6000 and member = \"Yes\", discount = 15","if amount = 4000 and member = \"No\", discount = 10"],"The outer IF is true only when amount > 5000; the inner IF gives members 15. 6000 and \"Yes\" → 15."],"2018 Q35"],["PROG",2,["A = [12, 45, 7, 88, 30] (සුචිය 0 සිට). අවමම (කුඩාම) අගය ඇති අවයවය කුමක්ද?",["A[0]","A[1]","A[2]","A[3]"],"සුචිය 0 සිට: A[0]=12, A[1]=45, A[2]=7, A[3]=88, A[4]=30. කුඩාම 7 = A[2]."],["A = [12, 45, 7, 88, 30] (indexed from 0). Which element holds the smallest value?",["A[0]","A[1]","A[2]","A[3]"],"From index 0: A[0]=12, A[1]=45, A[2]=7, A[3]=88, A[4]=30. The smallest, 7, is A[2]."],"2018 Q36"],["PROG",1,["පහත ව්‍යාජ කේතයේ \"*\" කී වරක් දර්ශනය වේද?<br><code>k = 1<br>REPEAT<br>&nbsp;&nbsp;IF k MOD 3 = 0 THEN<br>&nbsp;&nbsp;&nbsp;&nbsp;DISPLAY \"*\"<br>&nbsp;&nbsp;ENDIF<br>&nbsp;&nbsp;k = k + 1<br>UNTIL k > 10</code>",["2","3","4","10"],"k = 1 සිට 10 දක්වා. 3න් ඉතිරි නැතිව බෙදෙන්නේ 3, 6, 9 පමණි. එබැවින් 3 වරක්."],["How many times is \"*\" displayed?<br><code>k = 1<br>REPEAT<br>&nbsp;&nbsp;IF k MOD 3 = 0 THEN<br>&nbsp;&nbsp;&nbsp;&nbsp;DISPLAY \"*\"<br>&nbsp;&nbsp;ENDIF<br>&nbsp;&nbsp;k = k + 1<br>UNTIL k > 10</code>",["2","3","4","10"],"k runs 1 to 10. Only 3, 6 and 9 divide exactly by 3, so 3 times."],"2018 Q37"],["PROG",0,["ආදාන ලකුණක් 0 සිට 100 දක්වා (ඇතුළුව) ඇත්නම් පමණක් \"Valid\" පෙන්වීමට ගැළපෙන කොන්දේසිය කුමක්ද?",["mark >= 0 AND mark <= 100","mark >= 0 OR mark <= 100","mark > 0 AND mark < 100","mark < 0 OR mark > 100"],"කොන්දේසි දෙකම සත්‍ය විය යුතු නිසා AND. 0 සහ 100 ඇතුළත් නිසා >= සහ <=. OR නම් ඕනෑම සංඛ්‍යාවක් සත්‍ය වේ."],["Which condition shows \"Valid\" only when a mark is from 0 to 100 inclusive?",["mark >= 0 AND mark <= 100","mark >= 0 OR mark <= 100","mark > 0 AND mark < 100","mark < 0 OR mark > 100"],"Both conditions must be true, so AND. 0 and 100 are included, so >= and <=. With OR, any number is true."],"2018 Q38"],["PROG",3,["\"INPUT r → A = 3.14 * r * r → DISPLAY A\" යන ගැලීම් සටහනට සමාන ව්‍යාජ කේතය කුමක්ද?",["READ A<br>r = 3.14 * A * A<br>SHOW r","READ r<br>SHOW A<br>A = 3.14 * r * r","A = 3.14 * r * r<br>READ r<br>SHOW A","READ r<br>A = 3.14 * r * r<br>SHOW A"],"අනුක්‍රමය නිවැරදි විය යුතුය: පළමුව ආදානය, ඉන්පසු ගණනය, අවසානයේ ප්‍රතිදානය."],["Which pseudocode matches the flowchart \"INPUT r → A = 3.14 * r * r → DISPLAY A\"?",["READ A<br>r = 3.14 * A * A<br>SHOW r","READ r<br>SHOW A<br>A = 3.14 * r * r","A = 3.14 * r * r<br>READ r<br>SHOW A","READ r<br>A = 3.14 * r * r<br>SHOW A"],"The order must be right: input first, then calculate, then output."],"2018 Q39"],["PROG",3,["ක්‍රමලේඛන භාෂා පිළිබඳ සත්‍ය ප්‍රකාශ කුමක්ද?<br>A - යන්ත්‍ර භාෂාව 0 සහ 1 පමණක් භාවිත කරයි.<br>B - එකලස් (assembly) භාෂාව සංකේතාත්මක කේත (mnemonics) භාවිත කරයි.<br>C - Python, Pascal වැනි ඉහළ මට්ටමේ භාෂා යන්ත්‍රය මත රඳා නොපවතී.",["A පමණි","A සහ B පමණි","B සහ C පමණි","A, B, C සියල්ල"],"ප්‍රකාශ තුනම සත්‍යයි. ඉහළ මට්ටමේ භාෂා සම්පාදකයක් (compiler) හෝ අර්ථවිනිසකයක් (interpreter) මගින් යන්ත්‍ර භාෂාවට පරිවර්තනය වේ."],["Which statements about programming languages are true?<br>A - Machine language uses only 0s and 1s.<br>B - Assembly language uses symbolic codes (mnemonics).<br>C - High-level languages like Python and Pascal are machine independent.",["A only","A and B only","B and C only","all A, B and C"],"All three are true. High-level languages are translated to machine code by a compiler or interpreter."],"2018 Q40"],["PROG",0,["පහත ඒවා අතරින් දත්ත සැකසීමට (data processing) උදාහරණයක් කුමක්ද?",["සිසුන්ගේ ලකුණුවලින් සාමාන්‍යය ගණනය කිරීම","ගොනුවක් USB එකකට පිටපත් කිරීම","මුද්‍රණ යන්ත්‍රයක් සම්බන්ධ කිරීම","පරිගණකය නිවා දැමීම"],"දත්ත සැකසීම යනු දත්ත (ලකුණු) භාවිත කර නව තොරතුරක් (සාමාන්‍යය) ලබා ගැනීමයි. පිටපත් කිරීම නව තොරතුරක් නිපදවන්නේ නැත."],["Which of these is an example of data processing?",["calculating the average of students' marks","copying a file to a USB drive","connecting a printer","shutting down the computer"],"Data processing uses data (marks) to produce new information (the average). Copying a file produces no new information."],"2019 Q5"],["PROG",3,["පහත ප්‍රකාශ අතරින් සත්‍ය ඒවා කුමක්ද?<br>A - Python ඉහළ මට්ටමේ භාෂාවකි.<br>B - ඉහළ මට්ටමේ භාෂා මිනිසුන්ට කියවීමට පහසුය.<br>C - අර්ථවිනිසකයක් (interpreter) කේතය පේළියෙන් පේළිය පරිවර්තනය කර ක්‍රියාත්මක කරයි.",["A සහ B පමණි","A සහ C පමණි","B සහ C පමණි","A, B, C සියල්ල"],"ප්‍රකාශ තුනම සත්‍යයි. සම්පාදකය (compiler) සම්පූර්ණ ක්‍රමලේඛය එකවර පරිවර්තනය කරන අතර අර්ථවිනිසකය පේළියෙන් පේළිය කරයි."],["Which statements are true?<br>A - Python is a high-level language.<br>B - High-level languages are easier for people to read.<br>C - An interpreter translates and runs code line by line.",["A and B only","A and C only","B and C only","all A, B and C"],"All three are true. A compiler translates the whole program at once; an interpreter works line by line."],"2019 Q35"],["PROG",3,["පහත ව්‍යාජ කේතයට units = 120 ආදානය කළ විට ප්‍රතිදානය කුමක්ද?<br><code>IF units <= 60 THEN<br>&nbsp;&nbsp;bill = units * 5<br>ELSE<br>&nbsp;&nbsp;bill = 300 + (units - 60) * 10<br>ENDIF<br>DISPLAY bill</code>",["600","1200","300","900"],"120 > 60 නිසා ELSE: 300 + (120 − 60) × 10 = 300 + 600 = 900."],["What is displayed when units = 120 is input?<br><code>IF units <= 60 THEN<br>&nbsp;&nbsp;bill = units * 5<br>ELSE<br>&nbsp;&nbsp;bill = 300 + (units - 60) * 10<br>ENDIF<br>DISPLAY bill</code>",["600","1200","300","900"],"120 > 60, so ELSE: 300 + (120 − 60) × 10 = 300 + 600 = 900."],"2019 Q36"],["PROG",3,["පිළිවෙළින් 7, 3, 9, 4, 0 ආදානය කළ විට පහත ව්‍යාජ කේතයේ ප්‍රතිදානය කුමක්ද?<br><code>big = 0<br>REPEAT<br>&nbsp;&nbsp;GET n<br>&nbsp;&nbsp;IF n > big THEN big = n<br>UNTIL n = 0<br>DISPLAY big</code>",["0","4","7","9"],"big: 0 → 7 → (3 කුඩා) → 9 → (4 කුඩා) → (0) නවතී. විශාලතම 9."],["What is displayed when 7, 3, 9, 4, 0 are input in order?<br><code>big = 0<br>REPEAT<br>&nbsp;&nbsp;GET n<br>&nbsp;&nbsp;IF n > big THEN big = n<br>UNTIL n = 0<br>DISPLAY big</code>",["0","4","7","9"],"big: 0 → 7 → (3 smaller) → 9 → (4 smaller) → (0) stop. The largest is 9."],"2019 Q37"],["PROG",0,["විචල්‍ය (variables) පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["විචල්‍යයක අගය ක්‍රමලේඛය ක්‍රියාත්මක වන අතරතුර වෙනස් විය හැක","විචල්‍ය නාමයක් ලෙස begin, end වැනි සුරක්ෂිත වචන භාවිත කළ හැක","විචල්‍යයක අගය කිසිවිට වෙනස් කළ නොහැක","විචල්‍ය නාමයක් ඉලක්කමකින් ආරම්භ විය යුතුය"],"විචල්‍යයක අගය වෙනස් විය හැක. නියතයක (constant) අගය වෙනස් නොවේ. සුරක්ෂිත වචන (reserved words) විචල්‍ය නාම ලෙස භාවිත කළ නොහැක."],["Which statement about variables is correct?",["a variable's value can change while the program runs","reserved words like begin and end can be variable names","a variable's value can never change","a variable name must start with a digit"],"A variable's value can change; a constant's cannot. Reserved words cannot be used as variable names."],"2019 Q38"],["PROG",3,["a = 20, b = 50, c = 35 නම් ප්‍රතිදානය කුමක්ද?<br><code>IF a > b THEN<br>&nbsp;&nbsp;big = a<br>ELSE<br>&nbsp;&nbsp;IF b > c THEN big = b<br>&nbsp;&nbsp;ELSE big = c<br>ENDIF<br>DISPLAY big</code>",["20","35","0","50"],"a > b (20 > 50) අසත්‍ය → ELSE. b > c (50 > 35) සත්‍ය → big = 50."],["If a = 20, b = 50 and c = 35, what is displayed?<br><code>IF a > b THEN<br>&nbsp;&nbsp;big = a<br>ELSE<br>&nbsp;&nbsp;IF b > c THEN big = b<br>&nbsp;&nbsp;ELSE big = c<br>ENDIF<br>DISPLAY big</code>",["20","35","0","50"],"a > b (20 > 50) is false → ELSE. b > c (50 > 35) is true → big = 50."],"2019 Q39"],["PROG",0,["පහත ඒවා අතරින් ඉහළ මට්ටමේ (high-level) ක්‍රමලේඛන භාෂා පමණක් ඇති විකල්පය කුමක්ද?",["Python, Pascal, Java","Assembly, Python, Pascal","Machine language, Java, C","HTML, Assembly, Python"],"Python, Pascal, Java ඉහළ මට්ටමේ භාෂා වේ. Assembly සහ යන්ත්‍ර භාෂාව පහළ මට්ටමේ ය. HTML ක්‍රමලේඛන භාෂාවක් නොව සලකුණු (markup) භාෂාවකි."],["Which option lists only high-level programming languages?",["Python, Pascal, Java","Assembly, Python, Pascal","Machine language, Java, C","HTML, Assembly, Python"],"Python, Pascal and Java are high-level. Assembly and machine language are low-level. HTML is a markup language, not a programming language."],"2020 Q36"],["PROG",0,["පහත ව්‍යාජ කේතය ක්‍රියාත්මක කළ පසු t හි අගය කුමක්ද?<br><code>t = 0<br>n = 1<br>REPEAT<br>&nbsp;&nbsp;t = t + n<br>&nbsp;&nbsp;n = n + 2<br>UNTIL n > 7</code>",["16","9","25","7"],"n = 1, 3, 5, 7 එකතු වේ: 1 + 3 + 5 + 7 = 16. n = 9 වූ විට නවතී."],["What is the value of t after this pseudocode runs?<br><code>t = 0<br>n = 1<br>REPEAT<br>&nbsp;&nbsp;t = t + n<br>&nbsp;&nbsp;n = n + 2<br>UNTIL n > 7</code>",["16","9","25","7"],"n = 1, 3, 5, 7 are added: 1 + 3 + 5 + 7 = 16. It stops when n = 9."],"2020 Q37"],["PROG",1,["Pascal හි <code>var m : array[1..5] of integer;</code> ලෙස ප්‍රකාශ කළ අරාවක, තුන්වන අවයවයට 40 ගබඩා කිරීමට නිවැරදි ප්‍රකාශය කුමක්ද?",["m(3) := 40;","m[3] := 40;","m[2] := 40;","m[3] = 40;"],"මෙම අරාවේ සුචිය 1 සිට ආරම්භ වන නිසා තුන්වන අවයවය m[3]. Pascal හි පැවරීම := ලෙසත්, සුචිය [ ] ලෙසත් ලියයි."],["For the Pascal array <code>var m : array[1..5] of integer;</code>, which statement stores 40 in the third element?",["m(3) := 40;","m[3] := 40;","m[2] := 40;","m[3] = 40;"],"This array starts at index 1, so the third element is m[3]. Pascal uses := for assignment and [ ] for the index."],"2020 Q38"],["PROG",0,["N හි සාධකීය (N! = 1×2×…×N) සොයන ගැලීම් සටහනක ලූපය ඇතුළත ඇති ක්‍රියාවලි කොටු දෙක කුමක්ද? (f = 1, i = 1 ආරම්භයේ)",["f = f * i සහ i = i + 1","f = f + i සහ i = i + 1","f = i සහ i = i * 2","f = f * N සහ N = N − 1 පමණක් නොව i ද"],"සාධකීය යනු ගුණිතයකි, එබැවින් f = f × i. ඉන්පසු i එකකින් වැඩි කරයි. f = f + i නම් එකතුව ලැබේ."],["In a flowchart for N factorial (N! = 1×2×…×N), with f = 1 and i = 1 at the start, which two process boxes are inside the loop?",["f = f * i and i = i + 1","f = f + i and i = i + 1","f = i and i = i * 2","f = f * N and also i"],"Factorial is a product, so f = f × i, then i increases by one. f = f + i would give a sum."],"2020 Q39"],["PROG",0,["පහත ව්‍යාජ කේතයේ ප්‍රතිදානය කුමක්ද?<br><code>x = 10<br>count = 0<br>WHILE x > 0<br>&nbsp;&nbsp;IF x MOD 2 = 0 THEN count = count + 1<br>&nbsp;&nbsp;x = x - 3<br>ENDWHILE<br>DISPLAY count</code>",["2","3","4","1"],"x = 10 (ඉරට්ටේ, count=1), 7, 4 (ඉරට්ටේ, count=2), 1, -2 නවතී. count = 2."],["What is displayed?<br><code>x = 10<br>count = 0<br>WHILE x > 0<br>&nbsp;&nbsp;IF x MOD 2 = 0 THEN count = count + 1<br>&nbsp;&nbsp;x = x - 3<br>ENDWHILE<br>DISPLAY count</code>",["2","3","4","1"],"x = 10 (even, count=1), 7, 4 (even, count=2), 1, then -2 stops. count = 2."],"2020 Q40"],["PROG",3,["දත්ත සහ තොරතුරු පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["තොරතුරු සැකසූ විට දත්ත ලැබේ","දත්ත සැමවිටම අර්ථවත් වේ","දත්ත සහ තොරතුරු එකම දෙයකි","දත්ත සැකසූ විට අර්ථවත් තොරතුරු ලැබේ"],"දත්ත = සැකසීමට පෙර ඇති අමු කරුණු (උදා. ලකුණු). තොරතුරු = සැකසීමෙන් ලැබෙන අර්ථවත් ප්‍රතිඵලය (උදා. පන්තියේ සාමාන්‍යය)."],["Which statement about data and information is correct?",["processing information gives data","data is always meaningful","data and information are the same","processing data gives meaningful information"],"Data = raw facts before processing (e.g. marks). Information = the meaningful result (e.g. the class average)."],"2021 Q1"],["PROG",0,["ඉහළ මට්ටමේ භාෂාවකින් ලියූ ක්‍රමලේඛයක් සම්පූර්ණයෙන්ම එකවර යන්ත්‍ර භාෂාවට පරිවර්තනය කරන මෘදුකාංගය කුමක්ද?",["සම්පාදකය (compiler)","අර්ථවිනිසකය (interpreter)","එකලස්කරුවා (assembler)","මෙහෙයුම් පද්ධතිය"],"සම්පාදකය සම්පූර්ණ ක්‍රමලේඛය එකවර පරිවර්තනය කරයි. අර්ථවිනිසකය පේළියෙන් පේළිය කරයි. එකලස්කරුවා assembly භාෂාව පරිවර්තනය කරයි."],["Which software translates a whole high-level program into machine code at once?",["compiler","interpreter","assembler","operating system"],"A compiler translates the whole program at once; an interpreter works line by line; an assembler translates assembly language."],"2021 Q10"],["PROG",3,["සිසුවෙකුගේ ලකුණු 50 හෝ වැඩි නම් \"සමත්\" ද, නැත්නම් \"අසමත්\" ද පෙන්වීමට අවශ්‍ය පාලන ව්‍යුහය කුමක්ද?",["අනුක්‍රමය පමණි","පුනරාවර්තනය","පුනරාවර්තනය සහ අනුක්‍රමය","වරණය (selection)"],"කොන්දේසියක් අනුව මාර්ග දෙකකින් එකක් තෝරා ගැනීම වරණයයි (IF-THEN-ELSE)."],["Which control structure is needed to show \"Pass\" if a mark is 50 or more and \"Fail\" otherwise?",["sequence only","repetition","repetition and sequence","selection"],"Choosing one of two paths based on a condition is selection (IF-THEN-ELSE)."],"2021 Q33"],["PROG",1,["ගැලීම් සටහනක: x = 1, y = 0. \"x <= 4?\" සත්‍ය නම් y = y + x, x = x + 1 කර නැවත පරීක්ෂා කරයි. අසත්‍ය නම් y දර්ශනය කරයි. ප්‍රතිදානය කුමක්ද?",["4","10","15","6"],"y = 1 + 2 + 3 + 4 = 10. x = 5 වූ විට කොන්දේසිය අසත්‍ය වී 10 දර්ශනය කරයි."],["In a flowchart, x = 1 and y = 0. While \"x <= 4?\" is true, it does y = y + x and x = x + 1, then checks again; when false it displays y. What is the output?",["4","10","15","6"],"y = 1 + 2 + 3 + 4 = 10. When x = 5 the condition is false and 10 is displayed."],"2021 Q34"],["PROG",0,["ඉහත ගැලීම් සටහනේ (x = 1, y = 0, y = y + x, x = x + 1) කොන්දේසිය \"x < 4?\" ලෙස වෙනස් කළහොත් ප්‍රතිදානය කුමක්ද?",["6","10","4","3"],"දැන් x = 1, 2, 3 පමණක් එකතු වේ: 1 + 2 + 3 = 6."],["If the condition in that flowchart (x = 1, y = 0, y = y + x, x = x + 1) is changed to \"x < 4?\", what is the output?",["6","10","4","3"],"Now only x = 1, 2, 3 are added: 1 + 2 + 3 = 6."],"2021 Q35"],["PROG",1,["පහත ලූපය කී වරක් ක්‍රියාත්මක වේද?<br><code>k = 20<br>WHILE k > 5<br>&nbsp;&nbsp;k = k - 4<br>ENDWHILE</code>",["3","4","5","6"],"k = 20 → 16 → 12 → 8 → 4. 4 > 5 අසත්‍ය නිසා නවතී. ලූපය 4 වරක්."],["How many times does this loop run?<br><code>k = 20<br>WHILE k > 5<br>&nbsp;&nbsp;k = k - 4<br>ENDWHILE</code>",["3","4","5","6"],"k = 20 → 16 → 12 → 8 → 4. 4 > 5 is false, so it stops. The loop runs 4 times."],"2021 Q36"],["PROG",2,["නිඛිල (integer) 10ක් ගබඩා කිරීමට Pascal හි නිවැරදි අරා ප්‍රකාශනය කුමක්ද?",["var a : integer[10];","var a = array(10);","var a : array[1..10] of integer;","array a[10] : integer;"],"Pascal වාක්‍ය රීතිය: var නාමය : array[ආරම්භය..අවසානය] of දත්ත_වර්ගය;"],["Which is the correct Pascal declaration of an array to store 10 integers?",["var a : integer[10];","var a = array(10);","var a : array[1..10] of integer;","array a[10] : integer;"],"Pascal syntax: var name : array[start..end] of datatype;"],"2021 Q37"],["PROG",1,["B = [5, 8, 2, 9, 4] (සුචිය 0 සිට). B[1] + B[3] හි අගය කුමක්ද?",["7","17","13","11"],"B[1] = 8, B[3] = 9. 8 + 9 = 17."],["B = [5, 8, 2, 9, 4] (indexed from 0). What is B[1] + B[3]?",["7","17","13","11"],"B[1] = 8 and B[3] = 9. 8 + 9 = 17."],"2021 Q38"],["PROG",2,["පහත ව්‍යාජ කේතයට N = 4 ආදානය කළ විට ප්‍රතිදානය කුමක්ද?<br><code>p = 1<br>i = 1<br>WHILE i <= N<br>&nbsp;&nbsp;p = p * i<br>&nbsp;&nbsp;i = i + 1<br>ENDWHILE<br>DISPLAY p</code>",["4","10","24","16"],"p = 1 × 1 × 2 × 3 × 4 = 24 (4 හි සාධකීය)."],["What is displayed when N = 4 is input?<br><code>p = 1<br>i = 1<br>WHILE i <= N<br>&nbsp;&nbsp;p = p * i<br>&nbsp;&nbsp;i = i + 1<br>ENDWHILE<br>DISPLAY p</code>",["4","10","24","16"],"p = 1 × 1 × 2 × 3 × 4 = 24 (4 factorial)."],"2022 Q25"],["PROG",2,["සංඛ්‍යා 20ක් කියවා ඒවායින් ඍණ සංඛ්‍යා ගණන් කරන ගැලීම් සටහනක අවශ්‍ය පාලන ව්‍යුහ මොනවාද?",["අනුක්‍රමය පමණි","අනුක්‍රමය සහ වරණය පමණි","අනුක්‍රමය, වරණය සහ පුනරාවර්තනය","පුනරාවර්තනය පමණි"],"20 වරක් කියවීමට පුනරාවර්තනය, ඍණද යන්න පරීක්ෂාවට වරණය, ඒවා පිළිවෙළින් ක්‍රියාත්මක වීමට අනුක්‍රමය අවශ්‍යයි."],["Which control structures are needed in a flowchart that reads 20 numbers and counts the negative ones?",["sequence only","sequence and selection only","sequence, selection and repetition","repetition only"],"Repetition to read 20 times, selection to test for negative, and sequence to run the steps in order."],"2022 Q26"],["PROG",3,["වයස ලෙස 0 සිට 120 දක්වා අගයක් පමණක් පිළිගන්නා ආදාන වලංගුකරණයක (input validation) වැරදි ආදානය නැවත ඉල්ලීමට ගැළපෙන ලූප කොන්දේසිය කුමක්ද?",["WHILE age >= 0 AND age <= 120","WHILE age > 0","WHILE age = 120","WHILE age < 0 OR age > 120"],"අගය පරාසයෙන් පිටත නම් (0ට අඩු හෝ 120ට වැඩි) නැවත ඉල්ලිය යුතුය. එකක් හෝ සත්‍ය නම් ප්‍රමාණවත් නිසා OR."],["For input validation that accepts an age only from 0 to 120, which loop condition keeps asking again for a wrong input?",["WHILE age >= 0 AND age <= 120","WHILE age > 0","WHILE age = 120","WHILE age < 0 OR age > 120"],"It must ask again if the value is outside the range (below 0 or above 120). Either one being true is enough, so OR."],"2022 Q27"],["PROG",1,["සුචිය 0 සිට ආරම්භ වන, අවයව 8ක් ඇති අරාවක අවසාන අවයවයේ සුචිය කුමක්ද?",["8","7","6","9"],"0, 1, 2, … 7 ලෙස සුචි 8ක් ඇත. අවසාන සුචිය = අවයව ගණන − 1 = 7."],["In an array of 8 elements indexed from 0, what is the index of the last element?",["8","7","6","9"],"The indexes are 0, 1, 2, … 7 — eight in all. Last index = number of elements − 1 = 7."],"2022 Q28"],["PROG",3,["පහත Pascal කේතයේ ප්‍රතිදානය කුමක්ද?<br><code>for i := 1 to 4 do<br>&nbsp;&nbsp;write(i * i, ' ');</code>",["1 2 3 4","2 4 6 8","1 4 9","1 4 9 16"],"i = 1, 2, 3, 4 සඳහා i × i = 1, 4, 9, 16."],["What is the output of this Pascal code?<br><code>for i := 1 to 4 do<br>&nbsp;&nbsp;write(i * i, ' ');</code>",["1 2 3 4","2 4 6 8","1 4 9","1 4 9 16"],"For i = 1, 2, 3, 4, i × i = 1, 4, 9, 16."],"2022 Q29"],["PROG",1,["REPEAT…UNTIL ලූපය පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["කොන්දේසිය ලූපයට පෙර පරීක්ෂා කරයි","ලූපයේ කොටස අවම වශයෙන් එක් වරක් ක්‍රියාත්මක වේ","කොන්දේසිය සත්‍ය වන තාක් ලූපය දිගටම ක්‍රියා කරයි","ලූපය කිසිවිට ක්‍රියා නොකිරීමට ඉඩ ඇත"],"REPEAT කොන්දේසිය අවසානයේ පරීක්ෂා කරන නිසා අවම වශයෙන් එක් වරක් ක්‍රියා වේ. කොන්දේසිය සත්‍ය වූ විට නවතී (WHILE ට ප්‍රතිවිරුද්ධව)."],["Which statement about a REPEAT…UNTIL loop is true?",["the condition is checked before the loop","the loop body runs at least once","the loop keeps running while the condition is true","the loop may run zero times"],"REPEAT checks the condition at the end, so it runs at least once. It stops when the condition becomes true (the opposite of WHILE)."],"2022 Q30"],["PROG",1,["පහත ලූපය අවසානයේ count හි අගය කුමක්ද?<br><code>count = 0<br>n = 1<br>WHILE n < 30<br>&nbsp;&nbsp;n = n * 2<br>&nbsp;&nbsp;count = count + 1<br>ENDWHILE</code>",["4","5","6","30"],"n = 1 → 2 → 4 → 8 → 16 → 32. ලූපය 5 වරක් ක්‍රියා කරයි, count = 5."],["What is count at the end?<br><code>count = 0<br>n = 1<br>WHILE n < 30<br>&nbsp;&nbsp;n = n * 2<br>&nbsp;&nbsp;count = count + 1<br>ENDWHILE</code>",["4","5","6","30"],"n = 1 → 2 → 4 → 8 → 16 → 32. The loop runs 5 times, so count = 5."],"2022 Q31"],["PROG",2,["temp = 30, rain = \"No\" නම් පහත කේතය දර්ශනය කරන්නේ කුමක්ද?<br><code>IF rain = \"Yes\" THEN<br>&nbsp;&nbsp;DISPLAY \"Umbrella\"<br>ELSE<br>&nbsp;&nbsp;IF temp > 28 THEN DISPLAY \"Hat\"<br>&nbsp;&nbsp;ELSE DISPLAY \"Nothing\"<br>ENDIF</code>",["Umbrella","Nothing","Hat","Umbrella Hat"],"rain = \"No\" නිසා ELSE. temp > 28 (30 > 28) සත්‍ය → \"Hat\"."],["If temp = 30 and rain = \"No\", what is displayed?<br><code>IF rain = \"Yes\" THEN<br>&nbsp;&nbsp;DISPLAY \"Umbrella\"<br>ELSE<br>&nbsp;&nbsp;IF temp > 28 THEN DISPLAY \"Hat\"<br>&nbsp;&nbsp;ELSE DISPLAY \"Nothing\"<br>ENDIF</code>",["Umbrella","Nothing","Hat","Umbrella Hat"],"rain = \"No\" → ELSE. temp > 28 (30 > 28) is true → \"Hat\"."],"2022 Q32"],["PROG",3,["පහත ප්‍රකාශ අතරින් සත්‍ය ඒවා කුමක්ද?<br>A - CPU එකට කෙලින්ම තේරුම් ගත හැක්කේ යන්ත්‍ර භාෂාව පමණි.<br>B - සම්පාදකයක් දෝෂ (errors) ලැයිස්තුවක් ක්‍රමලේඛය අවසානයේ ලබා දෙයි.<br>C - එකලස්කරුවා (assembler) එකලස් භාෂාව යන්ත්‍ර භාෂාවට පරිවර්තනය කරයි.",["A පමණි","A සහ B පමණි","B සහ C පමණි","A, B, C සියල්ල"],"ප්‍රකාශ තුනම සත්‍යයි."],["Which statements are true?<br>A - The CPU can directly understand only machine language.<br>B - A compiler gives a list of errors after translating the program.<br>C - An assembler translates assembly language into machine language.",["A only","A and B only","B and C only","all A, B and C"],"All three statements are true."],"2022 Q33"],["PROG",0,["ත්‍රිකෝණයක වර්ගඵලය ගණනය කරන ක්‍රමලේඛයක ආදාන මොනවාද?",["පාදය සහ උස","වර්ගඵලය","පාදය සහ වර්ගඵලය","උස පමණි"],"වර්ගඵලය = ½ × පාදය × උස. පාදය සහ උස ආදාන වන අතර වර්ගඵලය ප්‍රතිදානයයි."],["What are the inputs of a program that calculates the area of a triangle?",["base and height","area","base and area","height only"],"Area = ½ × base × height. Base and height are inputs; the area is the output."],"2023 Q23"],["PROG",3,["\"ATM යන්ත්‍රයක ගිණුමේ ශේෂය ප්‍රමාණවත් නම් පමණක් මුදල් ලබා දීම\" ට ගැළපෙන පාලන ව්‍යුහය කුමක්ද?",["අනුක්‍රමය","පුනරාවර්තනය","පුනරාවර්තනය සහ අනුක්‍රමය","වරණය"],"කොන්දේසියක් (ශේෂය ප්‍රමාණවත්ද) අනුව ක්‍රියාවක් කිරීම හෝ නොකිරීම වරණයයි."],["Which control structure fits \"an ATM gives cash only if the balance is enough\"?",["sequence","repetition","repetition and sequence","selection"],"Doing or not doing an action based on a condition (is the balance enough?) is selection."],"2023 Q24"],["PROG",2,["x = 8, y = 3 නම් පහත තාර්කික ප්‍රකාශන අතරින් සත්‍ය වන්නේ කුමක්ද?",["(x < y) AND (y > 0)","(x = y) OR (y > 5)","(x > y) AND (y <> 0)","NOT (x > 5)"],"(8 > 3) සත්‍ය AND (3 ≠ 0) සත්‍ය → සත්‍ය. අනෙක් ඒවා: අසත්‍ය AND …, අසත්‍ය OR අසත්‍ය, NOT සත්‍ය = අසත්‍ය."],["If x = 8 and y = 3, which logical expression is true?",["(x < y) AND (y > 0)","(x = y) OR (y > 5)","(x > y) AND (y <> 0)","NOT (x > 5)"],"(8 > 3) is true AND (3 ≠ 0) is true → true. The others: false AND …, false OR false, NOT true = false."],"2023 Q25"],["PROG",3,["සිසුවෙකුගේ නම (\"Kasun\") ගබඩා කිරීමට වඩාත් සුදුසු දත්ත වර්ගය කුමක්ද?",["integer","real","boolean","string"],"අකුරු එකතුවක් (පෙළ) string ලෙස ගබඩා කරයි. integer පූර්ණ සංඛ්‍යා, real දශම සංඛ්‍යා, boolean සත්‍ය/අසත්‍ය."],["Which data type is most suitable for a student's name (\"Kasun\")?",["integer","real","boolean","string"],"A sequence of characters (text) is stored as a string. Integer = whole numbers, real = decimals, boolean = true/false."],"2023 Q26"],["PROG",1,["ප්‍රකාශනය <code>10 + 6 / 2 * 3</code> හි අගය කුමක්ද?",["24","19","11","8"],"/ සහ * එකම ප්‍රමුඛතාවය, වමේ සිට දකුණට: 6 / 2 = 3, 3 × 3 = 9. ඉන්පසු 10 + 9 = 19."],["What is the value of <code>10 + 6 / 2 * 3</code>?",["24","19","11","8"],"/ and * have the same priority, left to right: 6 / 2 = 3, 3 × 3 = 9. Then 10 + 9 = 19."],"2023 Q27"],["PROG",1,["IF-THEN-ELSE ව්‍යුහය වඩාත් ගැළපෙන්නේ පහත කුමන අවස්ථාවටද?",["සංඛ්‍යා 1 සිට 100 දක්වා මුද්‍රණය කිරීම","සංඛ්‍යාවක් ඉරට්ටේද ඔත්තේද යන්න පෙන්වීම","සිසුන් 40 දෙනෙකුගේ ලකුණු කියවීම","සංඛ්‍යා දෙකක් එකතු කිරීම"],"ඉරට්ටේ/ඔත්තේ යනු ප්‍රතිඵල දෙකකින් එකක් තෝරා ගැනීමයි, එය IF-THEN-ELSE ය. 1–100 සහ 40 දෙනා ලූප වේ."],["Which situation best suits an IF-THEN-ELSE structure?",["printing the numbers 1 to 100","showing whether a number is even or odd","reading the marks of 40 students","adding two numbers"],"Even/odd chooses one of two results, which is IF-THEN-ELSE. 1–100 and 40 students are loops."],"2023 Q28"],["PROG",1,["පහත කේතයේ ප්‍රතිදානය කුමක්ද?<br><code>s = 0<br>i = 2<br>WHILE i <= 8<br>&nbsp;&nbsp;s = s + i<br>&nbsp;&nbsp;i = i + 3<br>ENDWHILE<br>DISPLAY s</code>",["10","15","20","8"],"i = 2, 5, 8 එකතු වේ: 2 + 5 + 8 = 15. i = 11 වූ විට නවතී."],["What is the output?<br><code>s = 0<br>i = 2<br>WHILE i <= 8<br>&nbsp;&nbsp;s = s + i<br>&nbsp;&nbsp;i = i + 3<br>ENDWHILE<br>DISPLAY s</code>",["10","15","20","8"],"i = 2, 5, 8 are added: 2 + 5 + 8 = 15. It stops when i = 11."],"2023 Q29"],["PROG",0,["පහත කාවැද්දූ (nested) ලූපවල \"#\" කී වරක් දර්ශනය වේද?<br><code>FOR r = 1 TO 3<br>&nbsp;&nbsp;FOR c = 1 TO 4<br>&nbsp;&nbsp;&nbsp;&nbsp;DISPLAY \"#\"<br>&nbsp;&nbsp;NEXT c<br>NEXT r</code>",["12","7","3","4"],"පිටත ලූපය 3 වරක් × ඇතුළත ලූපය 4 වරක් = 12."],["How many times is \"#\" displayed by these nested loops?<br><code>FOR r = 1 TO 3<br>&nbsp;&nbsp;FOR c = 1 TO 4<br>&nbsp;&nbsp;&nbsp;&nbsp;DISPLAY \"#\"<br>&nbsp;&nbsp;NEXT c<br>NEXT r</code>",["12","7","3","4"],"Outer loop 3 times × inner loop 4 times = 12."],"2023 Q30"],["PROG",2,["යන්ත්‍ර භාෂාව පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["එය මිනිසුන්ට කියවීමට පහසුය","එය සෑම පරිගණක වර්ගයකම එකම ලෙස ක්‍රියා කරයි","එය 0 සහ 1 වලින් සෑදී ඇති අතර පරිවර්තනයකින් තොරව ක්‍රියාත්මක වේ","එය සම්පාදනය කළ යුතුය"],"යන්ත්‍ර භාෂාව ද්විමය උපදෙස් වේ. CPU එකට කෙලින්ම ක්‍රියාත්මක කළ හැකි නමුත් එය යන්ත්‍රය මත රඳා පවතී සහ කියවීමට අපහසුය."],["Which statement about machine language is true?",["it is easy for people to read","it works the same on every type of computer","it is made of 0s and 1s and runs without translation","it must be compiled"],"Machine language is binary instructions the CPU runs directly, but it is machine-dependent and hard to read."],"2023 Q31"],["PROG",2,["සෘජුකෝණාස්‍රයක පරිමිතිය සහ වර්ගඵලය ගණනය කරන ක්‍රමලේඛයක ආදාන කුමක්ද?",["පරිමිතිය සහ වර්ගඵලය","දිග පමණි","දිග සහ පළල","වර්ගඵලය සහ පළල"],"පරිමිතිය = 2(දිග + පළල), වර්ගඵලය = දිග × පළල. දිග සහ පළල ආදාන වේ."],["What are the inputs of a program that calculates the perimeter and area of a rectangle?",["perimeter and area","length only","length and width","area and width"],"Perimeter = 2(length + width), area = length × width. Length and width are the inputs."],"2025 Q24"],["PROG",0,["ගැලීම් සටහනක: INPUT a, b → \"a > b?\" ඔව් නම් DISPLAY a − b, නැත්නම් DISPLAY b − a. a = 4, b = 9 ආදානය කළ විට ප්‍රතිදානය කුමක්ද?",["5","−5","13","4"],"4 > 9 අසත්‍ය නිසා b − a = 9 − 4 = 5. මෙම ගැලීම් සටහන සෑම විටම වෙනස ධන අගයක් ලෙස දෙයි."],["In a flowchart: INPUT a, b → \"a > b?\" if yes DISPLAY a − b, else DISPLAY b − a. What is the output for a = 4, b = 9?",["5","−5","13","4"],"4 > 9 is false, so b − a = 9 − 4 = 5. This flowchart always gives the positive difference."],"2025 Q25"],["PROG",1,["ගැලීම් සටහනක: n = 1, total = 0. \"n <= 5?\" ඔව් නම් total = total + 2, n = n + 1, නැවත පරීක්ෂා කරයි. නැත්නම් total දර්ශනය කරයි. ප්‍රතිදානය කුමක්ද?",["5","10","12","2"],"ලූපය n = 1 සිට 5 දක්වා 5 වරක් ක්‍රියා කරයි. සෑම වරම 2 එකතු වේ: 5 × 2 = 10."],["In a flowchart, n = 1 and total = 0. While \"n <= 5?\" is yes, total = total + 2 and n = n + 1, then check again; otherwise display total. What is the output?",["5","10","12","2"],"The loop runs 5 times (n = 1 to 5), adding 2 each time: 5 × 2 = 10."],"2025 Q26"],["PROG",0,["ඉහත ගැලීම් සටහනේ (n = 1, total = 0, total + 2) කොන්දේසිය \"n <= 5?\" වෙනුවට \"n < 5?\" කළහොත් ප්‍රතිදානය කුමක්ද?",["8","10","4","6"],"දැන් n = 1, 2, 3, 4 සඳහා පමණක් ක්‍රියා කරයි: 4 × 2 = 8."],["If the condition in that flowchart (n = 1, total = 0, total + 2) is changed from \"n <= 5?\" to \"n < 5?\", what is the output?",["8","10","4","6"],"Now it runs only for n = 1, 2, 3, 4: 4 × 2 = 8."],"2025 Q27"],["PROG",3,["Pascal හි \"x 10ට අඩු තාක් x දෙගුණ කරන්න\" සඳහා නිවැරදි කේතය කුමක්ද?",["while x < 10 x := x * 2;","while (x < 10) then x := x * 2;","repeat x := x * 2 while x < 10;","while x < 10 do x := x * 2;"],"Pascal WHILE වාක්‍ය රීතිය: <code>while කොන්දේසිය do ප්‍රකාශය;</code>"],["Which is the correct Pascal code for \"double x while x is less than 10\"?",["while x < 10 x := x * 2;","while (x < 10) then x := x * 2;","repeat x := x * 2 while x < 10;","while x < 10 do x := x * 2;"],"Pascal WHILE syntax: <code>while condition do statement;</code>"],"2025 Q28"],["PROG",0,["Pascal හි 0.08 අගය ඇති, වෙනස් නොවන \"rate\" නියතය (constant) ප්‍රකාශ කරන නිවැරදි ආකාරය කුමක්ද?",["const rate = 0.08;","var rate = 0.08;","const rate := 0.08;","rate : constant = 0.08;"],"Pascal හි නියත const ලෙස, = ලකුණෙන් ප්‍රකාශ කරයි. විචල්‍ය var ලෙස ප්‍රකාශ කරයි."],["What is the correct way to declare a constant \"rate\" with the fixed value 0.08 in Pascal?",["const rate = 0.08;","var rate = 0.08;","const rate := 0.08;","rate : constant = 0.08;"],"In Pascal, constants are declared with const and the = sign; variables are declared with var."],"2025 Q29"],["PROG",0,["Pascal ක්‍රමලේඛයක සංඛ්‍යා එකතු කිරීමට ලූපයට පෙර total විචල්‍යයට දිය යුතු ආරම්භක අගය කුමක්ද?",["total := 0;","total := 1;","total := total;","ආරම්භක අගයක් අවශ්‍ය නැත"],"එකතුවක් ආරම්භ වන්නේ 0 සිටය. ගුණිතයක් (සාධකීය) ආරම්භ වන්නේ 1 සිටය. ආරම්භ නොකළහොත් වැරදි අගයක් ලැබිය හැක."],["Before a loop that adds numbers in Pascal, what initial value should total get?",["total := 0;","total := 1;","total := total;","no initial value is needed"],"A sum starts from 0; a product (factorial) starts from 1. Without initialising, the result may be wrong."],"2025 Q30"],["PROG",1,["පහත Pascal කේතයේ ප්‍රතිදානය කුමක්ද?<br><code>s := 0;<br>for k := 3 to 6 do<br>&nbsp;&nbsp;s := s + k;<br>writeln(s);</code>",["15","18","21","9"],"3 + 4 + 5 + 6 = 18."],["Wh
