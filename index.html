<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O/L Science &amp; ICT Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: one column workbook; sticky header with tabs; cards only for chapters and the active question */
:root{
  --bg:#f3f5f4;--panel:#ffffff;--ink:#17211d;--mute:#5d6b65;--line:#d9e0dc;
  --accent:#0f7a6c;--accent-ink:#ffffff;--soft:#dcefeb;
  --ok:#1f8a4c;--ok-bg:#e3f4ea;--bad:#c23b2a;--bad-bg:#fbe7e3;--warn:#b7791f;
  --f-head:"Space Grotesk","Noto Sans Sinhala",system-ui,sans-serif;
  --f-body:"Inter","Noto Sans Sinhala",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715;--panel:#1a2320;--ink:#e6ece9;--mute:#9aa8a2;--line:#2c3733;--soft:#173a35;
  --ok:#4cc483;--ok-bg:#163223;--bad:#f07a68;--bad-bg:#3a1d18;--warn:#e0a84a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111715;--panel:#1a2320;--ink:#e6ece9;--mute:#9aa8a2;--line:#2c3733;--soft:#173a35;
  --ok:#4cc483;--ok-bg:#163223;--bad:#f07a68;--bad-bg:#3a1d18;--warn:#e0a84a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .in{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-family:var(--f-head);font-weight:700;font-size:20px;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--accent)}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink);font-variant-numeric:tabular-nums}
nav{flex-basis:100%;display:flex;gap:2px;overflow-x:auto}
nav a{padding:8px 12px;color:var(--mute);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;font-size:14px}
nav a.on{color:var(--ink);border-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;border-radius:0;padding:4px 10px;font-size:13px}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;line-height:1.25;margin:0}
h2{font-size:22px}h3{font-size:17px}
.sec{display:grid;gap:14px;margin-bottom:26px}
.lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-head);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.bar{height:7px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.mute{color:var(--mute);font-size:13.5px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:13px;padding:5px 11px;border-radius:99px;border:1px dashed var(--line);color:var(--mute)}
.badge.got{border:1px solid var(--accent);background:var(--soft);color:var(--ink);font-weight:600}
table.tp{width:100%;border-collapse:collapse;font-size:14px}
.tp td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tp td.n{font-variant-numeric:tabular-nums;text-align:right;color:var(--mute);white-space:nowrap}
.tp .row{justify-content:flex-end;flex-wrap:nowrap}
.tp button{padding:5px 10px;font-size:13px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.qtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.qtext{font-size:17px;line-height:1.65}
.opts{display:grid;gap:8px}
.opt{text-align:left;display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:start;padding:10px 12px}
.opt .k{font-weight:700;color:var(--mute)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.exp{border-left:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14.5px}
.timer{font-family:var(--f-head);font-size:20px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.pal button{padding:5px 0;font-size:12.5px;font-variant-numeric:tabular-nums}
.pal button.ans{background:var(--soft);border-color:var(--accent)}
.pal button.cur{outline:2px solid var(--accent)}
.pal button.flag{border-color:var(--warn);border-width:2px}
.pal button.r{background:var(--ok-bg);border-color:var(--ok)}
.pal button.w{background:var(--bad-bg);border-color:var(--bad)}
.score{font-family:var(--f-head);font-size:48px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.rev{display:grid;gap:10px}
.rv{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);font-size:14px;display:grid;gap:4px}
.rv.w{border-left:4px solid var(--bad)}.rv.r{border-left:4px solid var(--ok)}
.p2q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;min-width:0;overflow-x:auto}
.p2q ol{margin:4px 0 4px 22px;padding:0}.p2q p{margin:4px 0}
.p2q .m{color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap}
.p2q .t{border-collapse:collapse;font-size:13.5px;margin:6px 0}.p2q .t td,.p2q .t th{border:1px solid var(--line);padding:3px 8px;text-align:center}
.p2q pre{background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:6px;font-size:13px;overflow-x:auto}
.ms{background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:14px}
.note{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.pal{grid-template-columns:repeat(8,1fr)}.qtext{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
:root[data-subj="ict"]{--accent:#3b4fc4;--soft:#e2e6fa}
@media (prefers-color-scheme:dark){:root[data-subj="ict"]:not([data-theme="light"]){--soft:#232a55}}
:root[data-subj="ict"][data-theme="dark"]{--soft:#232a55}
html,body{margin:0}body{-webkit-text-size-adjust:100%}
</style>
</head>

</div></header>

hich convention controls international trade in endangered plant and animal species?",["Ramsar Convention","CITES","Montreal Protocol","Kyoto Protocol"],"CITES covers trade in endangered species. Ramsar = wetlands, Montreal = ozone layer, Kyoto = greenhouse gases."],"2018 Q39"],["ECO",2,["පහත ක්‍රියා අතරින් 4R සංකල්පයේ \"අඩු කිරීම (Reduce)\" සඳහා උදාහරණයක් වන්නේ කුමක්ද?",["හිස් බෝතල් මල් බඳුන් ලෙස භාවිත කිරීම","පරණ කඩදාසි ප්‍රතිචක්‍රීකරණයට යැවීම","කඩයට යන විට රෙදි බෑගයක් රැගෙන ගොස් පොලිතීන් භාවිතය අඩු කිරීම","කුස්සියේ අපද්‍රව්‍යවලින් කොම්පෝස්ට් සෑදීම"],"අපද්‍රව්‍ය ඇති වීමම අඩු කිරීම \"අඩු කිරීම\" යි. බෝතල් නැවත යොදා ගැනීම \"නැවත භාවිතය\", කඩදාසි හා කොම්පෝස්ට් \"ප්‍රතිචක්‍රීකරණය\" ගණයට වැටේ."],["Which of the following is an example of \"Reduce\" in the 4R concept?",["using empty bottles as flower pots","sending old paper for recycling","taking a cloth bag to the shop so that less polythene is used","making compost from kitchen waste"],"Reduce means producing less waste in the first place. Reusing bottles is \"reuse\"; paper and compost are recycling."],"2018 Q40"],["ECO",2,["කුරුලෑ (legume) ශාකවල මුල් ගැටිතිවල ඇති බැක්ටීරියා වායුගෝලීය N₂ නයිට්‍රජන් සංයෝග බවට පත් කිරීම හඳුන්වන්නේ කුමන නමින්ද?",["නයිට්‍රීකරණය","විනයිට්‍රීකරණය","ජෛව නයිට්‍රජන් තිර කිරීම","වියෝජනය"],"රයිසෝබියම් බැක්ටීරියා N₂ තිර කරයි. නයිට්‍රීකරණය = NH₄⁺ → NO₃⁻. විනයිට්‍රීකරණය = NO₃⁻ → N₂."],["Bacteria in the root nodules of legumes convert atmospheric N₂ into nitrogen compounds. This is called",["nitrification","denitrification","biological nitrogen fixation","decomposition"],"Rhizobium bacteria fix N₂. Nitrification = NH₄⁺ → NO₃⁻. Denitrification = NO₃⁻ → N₂."],"2019 Q2"],["ECO",0,["ඕසෝන් ස්තරය තුනී වීමේ ප්‍රතිඵලයක් ලෙස වැඩි වීමට ඉඩ ඇත්තේ කුමක්ද?",["සමේ පිළිකා","අම්ල වැසි","සුපෝෂණය","ජෛව විශාලනය"],"ඕසෝන් ස්තරය සූර්යයාගෙන් එන පාරජම්බුල (UV) කිරණ අවශෝෂණය කරයි. එය තුනී වූ විට වැඩිපුර UV පොළොවට පැමිණ සමේ පිළිකා සහ ඇසේ සුද ඇති කරයි."],["Which of these is most likely to increase as the ozone layer thins?",["skin cancer","acid rain","eutrophication","biomagnification"],"The ozone layer absorbs ultraviolet (UV) rays from the Sun. When it thins, more UV reaches the ground, causing skin cancer and cataracts."],"2019 Q35"],["ECO",1,["\"ආහාර සැතපුම්\" (food miles) අඩු කිරීමට වඩාත්ම උපකාරී වන්නේ කුමක්ද?",["ආනයනික පලතුරු මිලදී ගැනීම","ප්‍රදේශයේම නිපදවන එළවළු මිලදී ගැනීම","ආහාර වැඩි කාලයක් ශීතකරණයේ තැබීම","ඇසුරුම් කළ ආහාර භාවිතය වැඩි කිරීම"],"ආහාර සැතපුම් යනු ආහාරය නිපදවන තැන සිට පරිභෝජනය කරන තැනට ඇති දුරයි. ප්‍රදේශීය ආහාර ප්‍රවාහනයට අඩු ඉන්ධන වැය වන නිසා CO₂ විමෝචනය අඩුය."],["Which of these helps most to reduce \"food miles\"?",["buying imported fruit","buying vegetables grown in the local area","keeping food longer in the refrigerator","using more packaged food"],"Food miles is the distance food travels from where it is grown to where it is eaten. Local food needs less transport fuel, so less CO₂ is released."],"2019 Q40"],["ECO",1,["එක් අඹ ගසක කෘමීන් දහස් ගණනක් ද, ඒවා කන කුරුල්ලන් කිහිප දෙනෙක් ද ජීවත් වෙයි. මෙම ආහාර දාමයේ සංඛ්‍යා පිරමිඩයේ හැඩය කුමක්ද?",["සම්පූර්ණයෙන්ම උඩුකුරු","පාදය පටු, මැද පළල, මුදුන පටු","සම්පූර්ණයෙන්ම යටිකුරු","සෑම මට්ටමක්ම සමාන පළල"],"නිෂ්පාදකයා ගස් එකක් පමණි (පටු පාදය), කෘමීන් දහස් ගණනකි (පළල මැද), කුරුල්ලන් කිහිප දෙනකි (පටු මුදුන). එබැවින් සංඛ්‍යා පිරමිඩය සැමවිටම උඩුකුරු නොවේ."],["A single mango tree supports thousands of insects, which are eaten by a few birds. What shape is the pyramid of numbers?",["completely upright","narrow base, wide middle, narrow top","completely inverted","all levels the same width"],"There is one tree (narrow base), thousands of insects (wide middle) and a few birds (narrow top), so a pyramid of numbers is not always upright."],"2020 Q7"],["ECO",0,["ජෛව විශාලනය පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["ආහාර දාමයේ ඉහළ පෝෂී මට්ටම්වල විෂ ද්‍රව්‍ය සාන්ද්‍රණය වැඩි වේ","නිෂ්පාදකයන් තුළ විෂ ද්‍රව්‍ය සාන්ද්‍රණය වැඩිම වේ","ජීර්ණය වන ද්‍රව්‍යවල පමණක් එය සිදු වේ","ඉහළ පෝෂී මට්ටම්වලට යන විට ශක්තිය වැඩි වේ"],"DDT, රසදිය වැනි ජීර්ණය හෝ බැහැර නොවන ද්‍රව්‍ය ශරීරයේ ගබඩා වේ. ආහාර දාමයේ ඉහළට යන විට ඒවායේ සාන්ද්‍රණය වැඩි වේ."],["Which statement about biomagnification is correct?",["the concentration of toxins increases at higher trophic levels","the toxin concentration is highest in producers","it happens only with substances that are digested","energy increases at higher trophic levels"],"Substances such as DDT and mercury are not broken down or excreted, so they build up and become more concentrated higher up the food chain."],"2020 Q39"],["ECO",1,["කුඹුරුවලින් ගලා එන ජලය නිසා වැවක ඇල්ගී වර්ධනය වැඩි වීමට ප්‍රධාන හේතුව කුමක්ද?",["පළිබෝධනාශකවල ඇති බැර ලෝහ","පොහොරවල ඇති නයිට්‍රේට් සහ පොස්පේට්","රොන් මඩ නිසා ආලෝකය අඩු වීම","ජලයේ උෂ්ණත්වය අඩු වීම"],"නයිට්‍රේට් සහ පොස්පේට් ඇල්ගී සඳහා පෝෂක වේ. ඇල්ගී අධිකව වැඩී පසුව මිය ගොස් දිරාපත් වන විට ජලයේ O₂ අඩු වී මසුන් මිය යයි. මෙය සුපෝෂණයයි."],["Water running off paddy fields makes algae grow fast in a tank. The main cause is",["heavy metals in pesticides","nitrates and phosphates in fertilizers","less light because of silt","a fall in water temperature"],"Nitrates and phosphates are nutrients for algae. The algae overgrow, then die and decompose, lowering the O₂ in the water so fish die. This is eutrophication."],"2020 Q40"],["ECO",1,["එකම ප්‍රදේශයක එකට ජීවත් වන එකම විශේෂයේ ජීවීන් සමූහයක් හඳුන්වන්නේ කුමක් ලෙසද?",["ප්‍රජාව","ගහනය","පරිසර පද්ධතිය","ජෛවගෝලය"],"ගහනය = එක් විශේෂයක ජීවීන්. ප්‍රජාව = එක් ප්‍රදේශයක විශේෂ කිහිපයක ගහන. පරිසර පද්ධතිය = ප්‍රජාව + අජීවී පරිසරය."],["A group of organisms of the same species living together in one area is called a",["community","population","ecosystem","biosphere"],"Population = one species. Community = populations of several species in an area. Ecosystem = community + non-living environment."],"2021 Q31"],["ECO",2,["පහත ශක්ති ප්‍රභව අතරින් පුනර්ජනනීය නොවන ප්‍රභවය කුමක්ද?",["සූර්ය ශක්තිය","සුළං ශක්තිය","ගල් අඟුරු","ජෛව වායුව"],"ගල් අඟුරු, පෙට්‍රෝලියම්, ස්වභාවික වායුව වැනි පොසිල ඉන්ධන සෑදීමට වසර මිලියන ගණනක් ගත වන නිසා ඒවා පුනර්ජනනීය නොවේ."],["Which of these energy sources is non-renewable?",["solar energy","wind energy","coal","biogas"],"Fossil fuels such as coal, petroleum and natural gas take millions of years to form, so they are non-renewable."],"2021 Q37"],["ECO",0,["භාවිතයෙන් ඉවත් කළ CFL බල්බ නිසිලෙස බැහැර නොකළ විට පරිසරයට එක් විය හැකි විෂ ලෝහය කුමක්ද?",["රසදිය","ඊයම්","යකඩ","ඇලුමිනියම්"],"CFL බල්බ තුළ රසදිය වාෂ්ප ස්වල්පයක් ඇත. බල්බය බිඳුණු විට රසදිය පසට හා ජලයට එක් වේ."],["Which toxic metal can enter the environment when used CFL bulbs are not disposed of properly?",["mercury","lead","iron","aluminium"],"CFL bulbs contain a small amount of mercury vapour. When a bulb breaks, the mercury gets into soil and water."],"2021 Q38"],["ECO",1,["ගෘහස්ථව දර ලිප් භාවිතයේදී ඇති වන, රුධිරයේ හිමොග්ලොබින් සමඟ බැඳී ඔක්සිජන් ප්‍රවාහනය අඩු කරන වායුව කුමක්ද?",["CO₂","CO","SO₂","O₃"],"අසම්පූර්ණ දහනයෙන් කාබන් මොනොක්සයිඩ් (CO) සෑදේ. එය හිමොග්ලොබින් සමඟ ඔක්සිජන්වලට වඩා ශක්තිමත්ව බැඳේ."],["Which gas, produced by indoor firewood stoves, binds to haemoglobin and reduces oxygen transport in the blood?",["CO₂","CO","SO₂","O₃"],"Incomplete combustion produces carbon monoxide (CO), which binds to haemoglobin more strongly than oxygen does."],"2021 Q39"],["ECO",1,["නිවසක විදුලි ශක්තිය ඉතිරි කිරීමට වඩාත් සුදුසු ක්‍රියාව කුමක්ද?",["සූත්‍රිකා බල්බ භාවිතය","LED බල්බ භාවිතය","ශීතකරණයේ දොර නිතර විවෘත කිරීම","උපකරණ standby තත්ත්වයේ තැබීම"],"LED බල්බ එකම ආලෝකයට ඉතා අඩු ජවයක් භාවිත කරයි. සූත්‍රිකා බල්බ ශක්තියෙන් වැඩි කොටසක් තාපය ලෙස නාස්ති කරයි."],["Which action saves the most electrical energy at home?",["using filament bulbs","using LED bulbs","opening the refrigerator door often","leaving appliances on standby"],"LED bulbs give the same light using much less power. Filament bulbs waste most of their energy as heat."],"2021 Q40"],["ECO",1,["ආහාර ජාලයක ශාක සහ සතුන් යන දෙවර්ගයම ආහාරයට ගන්නා ජීවියා හඳුන්වන්නේ කුමක් ලෙසද?",["නිෂ්පාදකයා","සර්වභක්ෂකයා","වියෝජකයා","ප්‍රාථමික පරිභෝජකයා"],"සර්වභක්ෂකයන් (උදා. කපුටා, මිනිසා) ශාක සහ සතුන් දෙකම කයි. එබැවින් ආහාර ජාලයේ පෝෂී මට්ටම් කිහිපයක සිටිය හැක."],["In a food web, an organism that eats both plants and animals is a",["producer","omnivore","decomposer","primary consumer"],"Omnivores (e.g. crows, humans) eat both plants and animals, so they can be at more than one trophic level."],"2022 Q37"],["ECO",0,["ස්වභාවික සම්පත් තිරසාර ලෙස භාවිත කිරීමට උදාහරණයක් කුමක්ද?",["කපන සෑම ගසක් වෙනුවටම නව පැළ සිටුවීම","වගා කිරීමට කැලෑ ගිනි තැබීම","භූගත ජලය සීමාවකින් තොරව පොම්ප කිරීම","කොරල් පර කඩා හුණු සෑදීම"],"තිරසාර භාවිතය යනු අනාගත පරම්පරාවලටද ඉතිරි වන ලෙස සම්පත් භාවිතයයි. ගස් කපන විට නැවත සිටුවීමෙන් වනාන්තරය පවතී."],["Which is an example of using natural resources sustainably?",["planting new saplings for every tree cut down","burning forest to make farmland","pumping groundwater without any limit","breaking coral reefs to make lime"],"Sustainable use means using resources so that some remain for future generations. Replanting keeps the forest going."],"2022 Q38"],["ECO",0,["ගෝලීය උණුසුම නිසා සෘජුවම ඇති විය හැකි ප්‍රතිඵලයක් කුමක්ද?",["අයිස් දිය වී මුහුදු මට්ටම ඉහළ යාම","ඕසෝන් ස්තරය ඝන වීම","අම්ල වැසි අඩු වීම","පසෙහි නයිට්‍රජන් වැඩි වීම"],"පෘථිවියේ උෂ්ණත්වය වැඩි වන විට ධ්‍රැවීය අයිස් සහ ග්ලැසියර දිය වී, මුහුදු ජලය ප්‍රසාරණය වී මුහුදු මට්ටම ඉහළ යයි."],["Which is a direct result of global warming?",["sea level rising as ice melts","the ozone layer getting thicker","less acid rain","more nitrogen in the soil"],"As the Earth warms, polar ice and glaciers melt and sea water expands, so the sea level rises."],"2022 Q39"],["ECO",0,["එකක් වැඩි වන විට අනෙක අඩු වන (ප්‍රතිලෝම) සම්බන්ධතාවයක් ඇති යුගලය කුමක්ද?",["වන ආවරණය සහ පාංශු ඛාදනය","හරිතාගාර වායු ප්‍රමාණය සහ ගෝලීය උෂ්ණත්වය","වාහන ගණන සහ වායු දූෂණය","පොහොර භාවිතය සහ සුපෝෂණය"],"වන ආවරණය වැඩි වන විට ගස් මුල් පස රඳවා ගන්නා නිසා පාංශු ඛාදනය අඩු වේ. අනෙක් යුගල තුනේම එකක් වැඩි වන විට අනෙකද වැඩි වේ."],["Which pair has an inverse relationship (one increases as the other decreases)?",["forest cover and soil erosion","greenhouse gases and global temperature","number of vehicles and air pollution","fertilizer use and eutrophication"],"More forest cover means roots hold the soil, so erosion falls. In the other three pairs, both increase together."],"2022 Q40"],["ECO",2,["සබන් කුඩු (detergents) අඩංගු අපජලය ජලාශවලට එක් වීමෙන් සුපෝෂණය ඇති කිරීමට හේතු වන අයනය කුමක්ද?",["Cl⁻","Na⁺","PO₄³⁻","SO₄²⁻"],"බොහෝ සබන් කුඩුවල පොස්පේට් අඩංගුය. පොස්පේට් ඇල්ගී වර්ධනය වේගවත් කරයි."],["Waste water containing detergents causes eutrophication in reservoirs. Which ion is mainly responsible?",["Cl⁻","Na⁺","PO₄³⁻","SO₄²⁻"],"Many detergents contain phosphate, which speeds up algal growth."],"2023 Q37"],["ECO",0,["ගෝලීය උණුසුමට වැඩිපුරම දායක වන වායුව කුමක්ද?",["CO₂","O₂","N₂","Ar"],"CO₂, CH₄, N₂O සහ ජල වාෂ්ප හරිතාගාර වායු වේ. ඒවා පොළොවෙන් පිටවන තාපය රඳවා ගනී. O₂, N₂, Ar හරිතාගාර වායු නොවේ."],["Which gas contributes most to global warming?",["CO₂","O₂","N₂","Ar"],"CO₂, CH₄, N₂O and water vapour are greenhouse gases that trap heat leaving the Earth. O₂, N₂ and Ar are not."],"2023 Q38"],["ECO",3,["ශක්ති පිරමිඩයක පහළ මට්ටමේ සිට ඉහළ මට්ටමට යන විට,",["ශක්තිය වැඩි වේ","ජීවීන් ගණන සැමවිටම වැඩි වේ","ශක්තිය නොවෙනස්ව පවතී","එක් එක් මට්ටමේ ශක්තිය අඩු වේ"],"ශ්වසනය, චලනය සහ තාපය ලෙස ශක්තිය හානි වන නිසා සාමාන්‍යයෙන් ~10% පමණක් ඊළඟ මට්ටමට යයි. ඒ නිසා ශක්ති පිරමිඩය සැමවිටම උඩුකුරුය."],["Going up an energy pyramid from the lowest level,",["the energy increases","the number of organisms always increases","the energy stays the same","the energy at each level decreases"],"Energy is lost as respiration, movement and heat, so only about 10% passes on. That is why an energy pyramid is always upright."],"2023 Q39"],["ECO",0,["පහත අපද්‍රව්‍ය අතරින් පහසුවෙන් ප්‍රතිචක්‍රීකරණය කළ හැක්කේ කුමක්ද?",["ඇලුමිනියම් කෑන්","ආහාර ඉතිරි","රෝහල් අපද්‍රව්‍ය","භාවිත කළ ටිෂූ කඩදාසි"],"ඇලුමිනියම් කෑන් දියකර නැවත නව කෑන් සෑදිය හැක. ආහාර ඉතිරි කොම්පෝස්ට් කළ හැකි නමුත් නැවත එම ද්‍රව්‍යය බවට පත් නොවේ."],["Which of these wastes can be recycled easily?",["aluminium cans","food scraps","hospital waste","used tissue paper"],"Aluminium cans can be melted and made into new cans. Food scraps can be composted but do not become the same material again."],"2023 Q40"],["ECO",0,["අම්ල වැසි ඇති කිරීමට ප්‍රධාන වශයෙන් දායක වන වායු යුගලය කුමක්ද?",["SO₂ සහ NO₂","CFC සහ O₃","CH₄ සහ CO","O₂ සහ N₂"],"SO₂ සහ NO₂ වැසි ජලයේ දිය වී සල්ෆියුරික් සහ නයිට්‍රික් අම්ල සාදයි. CFC ඕසෝන් ක්ෂයයටයි, CH₄ ගෝලීය උණුසුමටයි."],["Which pair of gases mainly causes acid rain?",["SO₂ and NO₂","CFC and O₃","CH₄ and CO","O₂ and N₂"],"SO₂ and NO₂ dissolve in rain to form sulphuric and nitric acids. CFCs deplete ozone; CH₄ causes global warming."],"2024 Q38"],["ECO",0,["පහත ආපදා අතරින් මිනිස් ක්‍රියාකාරකම්වල බලපෑම අවමම වන්නේ කුමක්ද?",["භූමිකම්පාව","නාය යාම","නාගරික ගංවතුර","ප්‍රකාශ රසායනික ධූමිකාව"],"භූමිකම්පා ඇති වන්නේ පෘථිවියේ ස්වභාවික භූ තැටි චලනයෙනි. නාය යාම සහ ගංවතුර කැලෑ එළි කිරීම සහ ඉදිකිරීම් නිසා වැඩි වේ. ධූමිකාව වාහන දුමෙන් ඇති වේ."],["Which of these disasters is least influenced by human activity?",["earthquake","landslide","urban flooding","photochemical smog"],"Earthquakes come from natural movement of the Earth's plates. Landslides and floods get worse with deforestation and building; smog comes from vehicle exhaust."],"2024 Q39"],["ECO",1,["සාම්ප්‍රදායික වැවක, වැව් පිටවාන (sluice) හරහා ජලය පිටවන විට එහි වේගය සහ පීඩනය පාලනය කරන ව්‍යුහය කුමක්ද?",["රළපනාව","බිසෝකොටුව","පිටවාන","ගල් වැටිය"],"බිසෝකොටුව සොරොව්වේ ජල පීඩනය පාලනය කර වැව් බැම්ම ආරක්ෂා කරයි. රළපනාව බැම්මේ ඇතුළු පැත්ත රැළිවලින් ආරක්ෂා කරන ගල් ආවරණයයි."],["In a traditional tank (wewa), which structure controls the speed and pressure of water leaving through the sluice?",["ralapanawa (wave breaker)","bisokotuwa (valve pit)","pitawana (spill)","stone wall"],"The bisokotuwa controls water pressure at the sluice and protects the bund. The ralapanawa is the stone facing that protects the bund from waves."],"2024 Q40"],["ECO",1,["ගහනයක් එහි ධාරිතාවට (carrying capacity) ළඟා වූ පසු කුමක් සිදු වේද?",["ගහනය ඝාතීයව වැඩි වේ","ගහනය දළ වශයෙන් නියතව පවතී","ගහනය ක්ෂණිකව ශුන්‍ය වේ","උපත් අනුපාතය මරණ අනුපාතයට වඩා බොහෝ වැඩි වේ"],"ධාරිතාවේදී ආහාර, ඉඩකඩ වැනි සම්පත් සීමා වන නිසා උපත් සහ මරණ දළ වශයෙන් සමාන වේ. ගහන වර්ධන වක්‍රය මට්ටම් වේ."],["What happens once a population reaches its carrying capacity?",["the population grows exponentially","the population stays roughly constant","the population suddenly drops to zero","the birth rate becomes much higher than the death rate"],"At carrying capacity, food and space are limited, so births and deaths roughly balance and the growth curve levels off."],"2025 Q38"],["ECO",1,["ජෛව ස්කන්ධ පිරමිඩයක් සෑදීමට එක් එක් පෝෂී මට්ටමේ මනිනු ලබන්නේ කුමක්ද?",["ජීවීන් ගණන","ජීවීන්ගේ මුළු වියළි ස්කන්ධය","ශ්වසනයට වැය වූ ශක්තිය","ජීවීන්ගේ සාමාන්‍ය උස"],"ජෛව ස්කන්ධ පිරමිඩය එක් එක් පෝෂී මට්ටමේ ඇති ජීවී ද්‍රව්‍යවල මුළු (වියළි) ස්කන්ධය පෙන්වයි."],["To draw a pyramid of biomass, what is measured at each trophic level?",["the number of organisms","the total dry mass of the organisms","the energy used in respiration","the average height of the organisms"],"A pyramid of biomass shows the total (dry) mass of living material at each trophic level."],"2025 Q39"],["ECO",3,["ගංවතුරකින් පසු පසෙහි නයිට්‍රජන් පෝෂක අඩු වීමට හේතුවක් නොවන්නේ කුමක්ද?",["නයිට්‍රේට් ජලයේ දිය වී පසෙහි ගැඹුරට කාන්දු වීම","මතුපිට පස ජලයෙන් සෝදා යාම","ජලයෙන් වැසුණු පසෙහි විනයිට්‍රීකරණය","කාබනික ද්‍රව්‍ය වියෝජනය"],"කාබනික ද්‍රව්‍ය වියෝජනයෙන් පසට නයිට්‍රජන් එකතු වේ. කාන්දු වීම, සෝදා යාම සහ විනයිට්‍රීකරණය නයිට්‍රජන් ඉවත් කරයි."],["Which is NOT a reason for nitrogen nutrients in soil to decrease after a flood?",["nitrates dissolving and leaching deep into the soil","topsoil being washed away","denitrification in waterlogged soil","decomposition of organic matter"],"Decomposition of organic matter adds nitrogen to the soil. Leaching, washing away and denitrification remove it."],"2025 Q40"],["MATTER",1,["පහත ඒවා අතරින් සමජාතීය මිශ්‍රණයක් වන්නේ කුමක්ද?",["වැලි සහ ජලය","ලුණු ද්‍රාවණය","තෙල් සහ ජලය","මැටි මිශ්‍ර ජලය"],"සමජාතීය මිශ්‍රණයක සංඝටක සෑම තැනකම ඒකාකාරව පැතිරී ඇති අතර වෙන වෙනම නොපෙනේ. ලුණු ජලයේ සම්පූර්ණයෙන් දිය වේ."],["Which of the following is a homogeneous mixture?",["sand and water","salt solution","oil and water","muddy water"],"In a homogeneous mixture the components are spread evenly and cannot be seen separately. Salt dissolves completely in water."],"2018 Q3"],["MATTER",1,["පහත යුගල අතරින් ආම්ලික ඔක්සයිඩ දෙකම ඇති යුගලය කුමක්ද?",["Na₂O, MgO","CO₂, SO₂","CaO, K₂O","Al₂O₃, MgO"],"අලෝහවල ඔක්සයිඩ (CO₂, SO₂) සාමාන්‍යයෙන් ආම්ලිකයි. ලෝහවල ඔක්සයිඩ (Na₂O, MgO, CaO, K₂O) භාස්මිකයි. Al₂O₃ උභයගුණීය."],["Which pair contains two acidic oxides?",["Na₂O, MgO","CO₂, SO₂","CaO, K₂O","Al₂O₃, MgO"],"Oxides of non-metals (CO₂, SO₂) are usually acidic. Metal oxides (Na₂O, MgO, CaO, K₂O) are basic. Al₂O₃ is amphoteric."],"2018 Q24"],["MATTER",1,["²⁴₁₂Mg²⁺ අයනයේ ඉලෙක්ට්‍රෝන ගණන සහ නියුට්‍රෝන ගණන පිළිවෙළින් කීයද?",["12, 12","10, 12","10, 24","12, 10"],"ප්‍රෝටෝන = 12. නියුට්‍රෝන = 24 − 12 = 12. ඉලෙක්ට්‍රෝන 2ක් ඉවත් වූ නිසා ඉලෙක්ට්‍රෝන = 12 − 2 = 10."],["How many electrons and neutrons, respectively, are in the ion ²⁴₁₂Mg²⁺?",["12, 12","10, 12","10, 24","12, 10"],"Protons = 12. Neutrons = 24 − 12 = 12. Two electrons were lost, so electrons = 12 − 2 = 10."],"2018 Q33"],["MATTER",2,["ජලයේ දිය වී ඇති තීන්ත වර්ණක කිහිපයක් වෙන් කර හඳුනා ගැනීමට වඩාත් සුදුසු ක්‍රමය කුමක්ද?",["පෙරීම","වාෂ්පීකරණය","කඩදාසි වර්ණලේඛ ශිල්පය","ඩිකන්ටේෂන්"],"කඩදාසි වර්ණලේඛ ශිල්පයේදී එක් එක් වර්ණකය කඩදාසිය දිගේ වෙනස් දුරකට ගමන් කරන නිසා ඒවා වෙන් වේ."],["Which method is best for separating and identifying several dyes dissolved in water?",["filtration","evaporation","paper chromatography","decanting"],"In paper chromatography each dye travels a different distance up the paper, so they separate."],"2019 Q29"],["MATTER",1,["Na පරමාණුවක් Na⁺ අයනයක් බවට පත් වන විට වෙනස් වන්නේ කුමක්ද?",["ප්‍රෝටෝන ගණන","ඉලෙක්ට්‍රෝන ගණන","නියුට්‍රෝන ගණන","ස්කන්ධ ක්‍රමාංකය"],"අයන සෑදීමේදී ඉලෙක්ට්‍රෝන පමණක් ලබා ගැනීම හෝ ඉවත් කිරීම සිදු වේ. න්‍යෂ්ටිය (ප්‍රෝටෝන, නියුට්‍රෝන) වෙනස් නොවේ."],["When a Na atom becomes a Na⁺ ion, what changes?",["the number of protons","the number of electrons","the number of neutrons","the mass number"],"Forming an ion only gains or loses electrons. The nucleus (protons and neutrons) does not change."],"2019 Q36"],["MATTER",1,["පරමාණුවක න්‍යෂ්ටියේ පිහිටන උප පරමාණුක අංශු මොනවාද?",["ප්‍රෝටෝන සහ ඉලෙක්ට්‍රෝන","ප්‍රෝටෝන සහ නියුට්‍රෝන","නියුට්‍රෝන සහ ඉලෙක්ට්‍රෝන","ඉලෙක්ට්‍රෝන පමණි"],"න්‍යෂ්ටියේ ප්‍රෝටෝන (+) සහ නියුට්‍රෝන (ආරෝපණ නැත) ඇත. ඉලෙක්ට්‍රෝන (−) න්‍යෂ්ටිය වටා කවචවල ඇත."],["Which subatomic particles are found in the nucleus of an atom?",["protons and electrons","protons and neutrons","neutrons and electrons","electrons only"],"The nucleus contains protons (+) and neutrons (no charge). Electrons (−) are in shells around the nucleus."],"2020 Q2"],["MATTER",1,["ඉලෙක්ට්‍රෝන වින්‍යාසය 2,2 සහ 2,8,2 වන මූලද්‍රව්‍ය දෙක පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["ඒවා එකම ආවර්තයේ ඇත","ඒවා එකම කාණ්ඩයේ ඇත","ඒවා දෙකම උච්ච වායු වේ","ඒවා දෙකම අලෝහ වේ"],"දෙකේම පිටත කවචයේ ඉලෙක්ට්‍රෝන 2 බැගින් ඇති නිසා ඒවා 2 කාණ්ඩයේ (Be සහ Mg) ඇත. කවච ගණන වෙනස් නිසා ආවර්ත වෙනස්ය."],["Two elements have electron configurations 2,2 and 2,8,2. Which statement is correct?",["they are in the same period","they are in the same group","both are noble gases","both are non-metals"],"Both have 2 outer electrons, so they are in group 2 (Be and Mg). They have different numbers of shells, so different periods."],"2020 Q12"],["MATTER",3,["පහත මූලද්‍රව්‍ය අතරින් පළමු අයනීකරණ ශක්තිය ඉහළම මූලද්‍රව්‍යය කුමක්ද?",["Na","Mg","Cl","Ar"],"ආවර්තයක් දිගේ වමේ සිට දකුණට අයනීකරණ ශක්තිය සාමාන්‍යයෙන් වැඩි වේ. ආවර්තයේ අවසානයේ ඇති උච්ච වායුව (Ar) ඉහළම අගය ගනී."],["Which of these elements has the highest first ionization energy?",["Na","Mg","Cl","Ar"],"Ionization energy generally increases from left to right across a period. The noble gas at the end (Ar) has the highest value."],"2020 Q14"],["MATTER",3,["⁴⁰₁₈Ar සහ ⁴⁰₂₀Ca පරමාණු දෙකෙහි සමාන වන්නේ කුමක්ද?",["ප්‍රෝටෝන ගණන","ඉලෙක්ට්‍රෝන ගණන","නියුට්‍රෝන ගණන","ප්‍රෝටෝන සහ නියුට්‍රෝනවල එකතුව"],"දෙකේම ස්කන්ධ ක්‍රමාංකය 40 යි, එනම් ප්‍රෝටෝන + නියුට්‍රෝන = 40. Ar හි ප්‍රෝටෝන 18, නියුට්‍රෝන 22. Ca හි ප්‍රෝටෝන 20, නියුට්‍රෝන 20."],["What is the same in the atoms ⁴⁰₁₈Ar and ⁴⁰₂₀Ca?",["the number of protons","the number of electrons","the number of neutrons","the total of protons and neutrons"],"Both have mass number 40, i.e. protons + neutrons = 40. Ar has 18 protons and 22 neutrons; Ca has 20 of each."],"2021 Q7"],["MATTER",3,["පහත ඒවා අතරින් කාබන්වල බහුරූපී ආකාරයක් (allotrope) නොවන්නේ කුමක්ද?",["දියමන්ති","මිනිරන්","ෆුලරීන්","කැල්සියම් කාබනේට්"],"බහුරූප යනු එකම මූලද්‍රව්‍යයේ වෙනස් ව්‍යුහ ආකාරයි. CaCO₃ යනු කැල්සියම්, කාබන් සහ ඔක්සිජන් ඇති සංයෝගයකි."],["Which of the following is NOT an allotrope of carbon?",["diamond","graphite","fullerene","calcium carbonate"],"Allotropes are different structural forms of the same element. CaCO₃ is a compound of calcium, carbon and oxygen."],"2021 Q25"],["MATTER",1,["³⁵Cl සහ ³⁷Cl සමස්ථානික පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["ඒවායේ ප්‍රෝටෝන ගණන වෙනස්ය","ඒවායේ රසායනික ගුණ සමානය","ඒවායේ ඉලෙක්ට්‍රෝන ගණන වෙනස්ය","ඒවායේ පරමාණුක ක්‍රමාංකය වෙනස්ය"],"සමස්ථානිකවල ප්‍රෝටෝන සහ ඉලෙක්ට්‍රෝන ගණන සමාන නිසා රසායනික ගුණ සමානය. වෙනස් වන්නේ නියුට්‍රෝන ගණන පමණි (18 සහ 20)."],["Which statement about the isotopes ³⁵Cl and ³⁷Cl is true?",["they have different numbers of protons","they have the same chemical properties","they have different numbers of electrons","they have different atomic numbers"],"Isotopes have the same protons and electrons, so the same chemical properties. Only the number of neutrons differs (18 and 20)."],"2022 Q4"],["MATTER",1,["ලෝහාලෝහයක් ලෙස සලකන, අර්ධ සන්නායක උපාංග සෑදීමට බහුලව භාවිත කරන මූලද්‍රව්‍යය කුමක්ද?",["Al","Si","S","Mg"],"සිලිකන් (Si) ලෝහ සහ අලෝහ ලක්ෂණ දෙකම පෙන්වයි. ඩයෝඩ, ට්‍රාන්සිස්ටර, සූර්ය කෝෂ සෑදීමට භාවිත කරයි."],["Which element is a metalloid widely used to make semiconductor devices?",["Al","Si","S","Mg"],"Silicon (Si) shows both metallic and non-metallic properties. It is used in diodes, transistors and solar cells."],"2022 Q15"],["MATTER",1,["වීදුරු දණ්ඩක් සේද රෙද්දකින් අතුල්ලූ විට එය ධන ආරෝපිත වන්නේ ඇයි?",["වීදුරුවට ප්‍රෝටෝන ලැබීම නිසා","වීදුරුවෙන් ඉලෙක්ට්‍රෝන ඉවත් වීම නිසා","වීදුරුවට නියුට්‍රෝන ලැබීම නිසා","වීදුරුවෙන් ප්‍රෝටෝන ඉවත් වීම නිසා"],"අතුල්ලන විට ගමන් කළ හැක්කේ ඉලෙක්ට්‍රෝන පමණි. වීදුරුවෙන් ඉලෙක්ට්‍රෝන සේද රෙද්දට ගිය නිසා වීදුරුව ධන ලෙසද, සේද සෘණ ලෙසද ආරෝපිත වේ."],["A glass rod becomes positively charged when rubbed with silk because",["the glass gains protons","the glass loses electrons","the glass gains neutrons","the glass loses protons"],"Only electrons move when objects are rubbed. Electrons pass from the glass to the silk, so the glass becomes positive and the silk negative."],"2023 Q5"],["MATTER",0,["භාස්මික, උභයගුණී සහ ආම්ලික ඔක්සයිඩ පිළිවෙළින් ඇති විකල්පය කුමක්ද?",["MgO, Al₂O₃, SO₂","SO₂, Al₂O₃, MgO","Al₂O₃, MgO, SO₂","MgO, SO₂, Al₂O₃"],"MgO භාස්මිකයි (ලෝහ ඔක්සයිඩය). Al₂O₃ උභයගුණීයි. SO₂ ආම්ලිකයි (අලෝහ ඔක්සයිඩය)."],["Which option lists a basic, an amphoteric and an acidic oxide, in that order?",["MgO, Al₂O₃, SO₂","SO₂, Al₂O₃, MgO","Al₂O₃, MgO, SO₂","MgO, SO₂, Al₂O₃"],"MgO is basic (metal oxide), Al₂O₃ is amphoteric, and SO₂ is acidic (non-metal oxide)."],"2023 Q6"],["MATTER",3,["පහත ඒවා අතරින් සියලුම ලෝහවලට පොදු ලක්ෂණයක් නොවන්නේ කුමක්ද?",["විදුලිය සන්නයනය කිරීම","තාපය සන්නයනය කිරීම","දිලිසෙන පෘෂ්ඨයක් තිබීම","කාමර උෂ්ණත්වයේදී ඝන වීම"],"රසදිය (Hg) කාමර උෂ්ණත්වයේදී ද්‍රවයකි. ඒ නිසා \"සියලුම ලෝහ ඝනයි\" යන්න සත්‍ය නොවේ."],["Which of these is NOT a property of all metals?",["conducting electricity","conducting heat","having a shiny surface","being solid at room temperature"],"Mercury (Hg) is a liquid at room temperature, so \"all metals are solid\" is not true."],"2023 Q17"],["MATTER",2,["ශුද්ධ ජර්මේනියම් (Ge) කාමර උෂ්ණත්වයේදී හැසිරෙන්නේ කෙසේද?",["හොඳ සන්නායකයක් ලෙස","පරිවාරකයක් ලෙස","නෛසර්ගික අර්ධ සන්නායකයක් ලෙස","ලෝහයක් ලෙස"],"ශුද්ධ Si සහ Ge නෛසර්ගික අර්ධ සන්නායක වේ. ඒවායේ සන්නායකතාව සන්නායක සහ පරිවාරක අතර වේ."],["At room temperature, pure germanium (Ge) behaves as",["a good conductor","an insulator","an intrinsic semiconductor","a metal"],"Pure Si and Ge are intrinsic semiconductors; their conductivity is between that of conductors and insulators."],"2024 Q3"],["MATTER",1,["පොටෑසියම්, තඹ සහ යකඩවල රසායනික සංකේත පිළිවෙළින් මොනවාද?",["P, C, I","K, Cu, Fe","Po, Co, Fe","K, Co, Ir"],"පොටෑසියම් K (Kalium), තඹ Cu (Cuprum), යකඩ Fe (Ferrum). මේවා ලතින් නම්වලින් එයි."],["What are the symbols of potassium, copper and iron, in that order?",["P, C, I","K, Cu, Fe","Po, Co, Fe","K, Co, Ir"],"Potassium K (Kalium), copper Cu (Cuprum), iron Fe (Ferrum). These come from the Latin names."],"2024 Q4"],["MATTER",0,["උණුසුම් දවල් කාලයේ වැවක මසුන් ජල මතුපිටට පැමිණ වාතය ගැනීමට හේතුව කුමක්ද?",["උෂ්ණත්වය වැඩි වන විට ජලයේ O₂ ද්‍රාව්‍යතාව අඩු වීම","උෂ්ණත්වය වැඩි වන විට ජලයේ O₂ ද්‍රාව්‍යතාව වැඩි වීම","ජලයේ CO₂ ප්‍රමාණය අඩු වීම","ජල පීඩනය වැඩි වීම"],"වායුවල ද්‍රාව්‍යතාව උෂ්ණත්වය වැඩි වන විට අඩු වේ. උණුසුම් ජලයේ දිය වී ඇති O₂ අඩු නිසා මසුන් මතුපිටට එයි."],["On hot afternoons, fish come to the surface of a tank to gulp air. Why?",["oxygen becomes less soluble in water as the temperature rises","oxygen becomes more soluble in water as the temperature rises","there is less CO₂ in the water","the water pressure increases"],"Gases become less soluble as temperature rises. Warm water holds less dissolved O₂, so fish come up for air."],"2024 Q18"],["MATTER",1,["ප්‍රෝටෝන 17, නියුට්‍රෝන 18 සහ ඉලෙක්ට්‍රෝන 18 ඇති විශේෂය කුමක්ද?",["³⁵₁₇Cl","³⁵₁₇Cl⁻","³⁶₁₈Ar","³⁵₁₇Cl⁺"],"ප්‍රෝටෝන 17 = Cl. ස්කන්ධ ක්‍රමාංකය = 17 + 18 = 35. ඉලෙක්ට්‍රෝන ප්‍රෝටෝනවලට වඩා එකක් වැඩි නිසා ආරෝපණය −1."],["Which species has 17 protons, 18 neutrons and 18 electrons?",["³⁵₁₇Cl","³⁵₁₇Cl⁻","³⁶₁₈Ar","³⁵₁₇Cl⁺"],"17 protons = Cl. Mass number = 17 + 18 = 35. One more electron than protons, so the charge is −1."],"2025 Q7"],["MATTER",2,["කුරුඳු කොළවලින් කුරුඳු තෙල් වාණිජ ලෙස ලබා ගැනීමට භාවිත කරන ක්‍රමය කුමක්ද?",["සරල ආසවනය","භාගික ආසවනය","හුමාල ආසවනය","ස්ඵටිකීකරණය"],"සගන්ධ තෙල් (essential oils) ඉහළ උෂ්ණත්වයේදී වියෝජනය විය හැකි නිසා හුමාලය සමඟ අඩු උෂ්ණත්වයකදී ආසවනය කරයි."],["Which method is used commercially to extract cinnamon oil from cinnamon leaves?",["simple distillation","fractional distillation","steam distillation","crystallization"],"Essential oils can decompose at high temperatures, so they are distilled with steam at a lower temperature."],"2025 Q8"],["MATTER",1,["X මූලද්‍රව්‍යය ආවර්තිතා වගුවේ 2 කාණ්ඩයේ ඇත. X සාමාන්‍යයෙන් සාදන අයනය කුමක්ද?",["X⁺","X²⁺","X²⁻","X⁻"],"2 කාණ්ඩයේ මූලද්‍රව්‍යවල පිටත කවචයේ ඉලෙක්ට්‍රෝන 2ක් ඇත. ඒවා ඉවත් කර X²⁺ අයනය සාදයි (උදා. Mg²⁺, Ca²⁺)."],["Element X is in group 2 of the periodic table. Which ion does X usually form?",["X⁺","X²⁺","X²⁻","X⁻"],"Group 2 elements have 2 outer electrons, which they lose to form X²⁺ (e.g. Mg²⁺, Ca²⁺)."],"2025 Q15"],["MATTER",2,["පහත වායු අතරින් ජලයේ ඉතාම හොඳින් දිය වන වායුව කුමක්ද?",["O₂","N₂","NH₃","H₂"],"ඇමෝනියා (NH₃) ජලයේ ඉතා ඉහළ ද්‍රාව්‍යතාවක් ඇත. NH₃ පිරවූ ජාඩියක් ජලයේ යටිකුරු කළ විට ජලය වේගයෙන් ඉහළ නගී."],["Which of these gases is the most soluble in water?",["O₂","N₂","NH₃","H₂"],"Ammonia (NH₃) is extremely soluble in water. If a jar of NH₃ is inverted in water, the water rushes up into it."],"2025 Q28"],["FORCE",0,["බලයේ SI ඒකකය වන නිව්ටනය (1 N) මූලික ඒකකවලින් දැක්වෙන්නේ කෙසේද?",["kg m s⁻²","kg m s⁻¹","kg m² s⁻²","kg s⁻²"],"F = ma නිසා බලයේ ඒකකය = kg × m s⁻² = kg m s⁻². kg m s⁻¹ ගම්‍යතාවේ ඒකකයයි. kg m² s⁻² (J) ශක්තියේ ඒකකයයි."],["How is the newton (1 N), the SI unit of force, written in base units?",["kg m s⁻²","kg m s⁻¹","kg m² s⁻²","kg s⁻²"],"F = ma, so the unit of force = kg × m s⁻² = kg m s⁻². kg m s⁻¹ is momentum; kg m² s⁻² (J) is energy."],"2018 Q2"],["FORCE",1,["බල තුනක් යටතේ වස්තුවක් සමතුලිතව ඇත්නම්, නිවැරදි ප්‍රකාශය කුමක්ද?",["බල තුනම එකම දිශාවට ක්‍රියා කරයි","බල තුනේ සම්ප්‍රයුක්තය ශුන්‍ය වේ","එක් බලයක් අනිවාර්යයෙන්ම ශුන්‍ය වේ","බල තුනේම විශාලත්වය සමාන විය යුතුය"],"සමතුලිතතාවයේදී ඕනෑම බල දෙකක සම්ප්‍රයුක්තය, තුන්වන බලයට සමාන හා ප්‍රතිවිරුද්ධ වේ. එබැවින් මුළු සම්ප්‍රයුක්තය ශුන්‍යය."],["If a body is in equilibrium under three forces, which statement is correct?",["all three forces act in the same direction","the resultant of the three forces is zero","one of the forces must be zero","all three forces must be equal in size"],"In equilibrium, the resultant of any two forces is equal and opposite to the third, so the total resultant is zero."],"2018 Q5"],["FORCE",2,["ස්කන්ධය 500 kg වන කාරයක් 20 m s⁻¹ ප්‍රවේගයෙන් ගමන් කරයි. එහි ගම්‍යතාව කීයද?",["25 kg m s⁻¹","1000 kg m s⁻¹","10 000 kg m s⁻¹","520 kg m s⁻¹"],"p = mv = 500 × 20 = 10 000 kg m s⁻¹."],["A car of mass 500 kg moves at 20 m s⁻¹. What is its momentum?",["25 kg m s⁻¹","1000 kg m s⁻¹","10 000 kg m s⁻¹","520 kg m s⁻¹"],"p = mv = 500 × 20 = 10 000 kg m s⁻¹."],"2018 Q31"],["FORCE",1,["පෘථිවිය මත බර 600 N වන පුද්ගලයෙකුගේ සඳ මත බර කීයද? (සඳ මත g, පෘථිවියේ g මෙන් 1/6 කි)",["60 N","100 N","600 N","3600 N"],"ස්කන්ධය වෙනස් නොවේ. g 1/6 වන නිසා බරද 1/6 වේ: 600 ÷ 6 = 100 N."],["A person weighs 600 N on Earth. What is their weight on the Moon? (g on the Moon is 1/6 of g on Earth)",["60 N","100 N","600 N","3600 N"],"Mass does not change. g is 1/6, so the weight is also 1/6: 600 ÷ 6 = 100 N."],"2019 Q11"],["FORCE",0,["ගම්‍යතාවේ SI ඒකකය කුමක්ද?",["kg m s⁻¹","N","kg m s⁻²","J"],"p = mv නිසා ඒකකය = kg × m s⁻¹ = kg m s⁻¹. (N s ලෙසද ලිවිය හැක.)"],["What is the SI unit of momentum?",["kg m s⁻¹","N","kg m s⁻²","J"],"p = mv, so the unit is kg × m s⁻¹ = kg m s⁻¹ (it can also be written N s)."],"2020 Q3"],["FORCE",1,["එකිනෙකට 0.5 m දුරින් ඇති, 10 N බැගින් වූ සමාන්තර හා ප්‍රතිවිරුද්ධ බල දෙකකින් (යුග්මයක්) ඇති වන සූර්ණය කීයද?",["2.5 N m","5 N m","10 N m","20 N m"],"යුග්මයක සූර්ණය = එක් බලයක් × බල දෙක අතර ලම්බ දුර = 10 × 0.5 = 5 N m."],["Two equal, parallel and opposite forces of 10 N act 0.5 m apart (a couple). What is the moment of the couple?",["2.5 N m","5 N m","10 N m","20 N m"],"Moment of a couple = one force × perpendicular distance between the forces = 10 × 0.5 = 5 N m."],"2020 Q29"],["FORCE",3,["6 N සහ 8 N බල දෙකක සම්ප්‍රයුක්තය විය නොහැකි අගය කුමක්ද?",["2 N","10 N","14 N","16 N"],"සම්ප්‍රයුක්තය අවම 8 − 6 = 2 N (ප්‍රතිවිරුද්ධ දිශා) සහ උපරිම 8 + 6 = 14 N (එකම දිශාව) අතර වේ. 16 N විය නොහැක."],["Which value CANNOT be the resultant of a 6 N force and an 8 N force?",["2 N","10 N","14 N","16 N"],"The resultant lies between 8 − 6 = 2 N (opposite directions) and 8 + 6 = 14 N (same direction). It cannot be 16 N."],"2020 Q37"],["FORCE",1,["භ්‍රමණ ලක්ෂ්‍යයේ සිට 2 m දුරින් ලම්බව යොදන 15 N බලයකින් ලැබෙන සූර්ණයම, 3 m දුරින් ලම්බව ලබා ගැනීමට කොපමණ බලයක් අවශ්‍යද?",["5 N","10 N","15 N","45 N"],"සූර්ණය = 15 × 2 = 30 N m. 3 m දුරින්: F = 30 ÷ 3 = 10 N. දුර වැඩි නම් අවශ්‍ය බලය අඩුය."],["A 15 N force applied at right angles 2 m from a pivot gives a certain moment. What force applied at right angles 3 m from the pivot gives the same moment?",["5 N","10 N","15 N","45 N"],"Moment = 15 × 2 = 30 N m. At 3 m: F = 30 ÷ 3 = 10 N. A larger distance needs a smaller force."],"2021 Q29"],["FORCE",1,["දොරක් විවෘත කිරීමේදී අඩු බලයකින් වැඩි සූර්ණයක් ලබා ගැනීමට බලය යෙදිය යුත්තේ කෙසේද?",["සරනේරුවට ළඟින්, දොරට ලම්බව","සරනේරුවෙන් ඈතින්, දොරට ලම්බව","සරනේරුවෙන් ඈතින්, දොරට සමාන්තරව","සරනේරුව මතම"],"සූර්ණය = බලය × ලම්බ දුර. දුර විශාලතම වන්නේ සරනේරුවෙන් ඈතිනි. ලම්බව යෙදූ විට බලය සම්පූර්ණයෙන්ම භ්‍රමණයට දායක වේ."],["To open a door with the least force (largest moment), the force should be applied",["near the hinge, at right angles to the door","far from the hinge, at right angles to the door","far from the hinge, parallel to the door","on the hinge itself"],"Moment = force × perpendicular distance. The distance is largest far from the hinge, and a force at right angles is fully used for turning."],"2022 Q18"],["FORCE",0,["රොකට්ටුවක් පිටුපසට වායු පිට කරමින් ඉහළට ගමන් කිරීම වඩාත්ම හොඳින් පැහැදිලි කරන්නේ කුමක්ද?",["නිව්ටන්ගේ තුන්වන නියමය","නිව්ටන්ගේ පළමු නියමය","ආකිමිඩීස් මූලධර්මය","පැස්කල් නියමය"],"රොකට්ටුව වායු පහළට තල්ලු කරයි (ක්‍රියාව). වායු පොත මත කිසිදු බලයක් ක්‍රියා නොකරයි"],"පොත නිශ්චල නිසා සම්ප්‍රයුක්ත බලය ශුන්‍යයි. පහළට බර (W) සහ ඉහළට මේසයේ ප්‍රතික්‍රියාව (R) සමාන වේ."],["Which statement about the forces on a book resting on a table is correct?",["only its weight acts on the book","its weight and the table's reaction are equal and opposite","the reaction force is larger than the weight","no forces act on the book"],"The book is at rest, so the resultant force is zero. Weight (W) down and the table's reaction (R) up are equal."],"2023 Q31"],["FORCE",0,["ස්කන්ධය 2 kg වන වස්තුවක් මත 30 N ඉහළට බලයක් ක්‍රියා කරයි. වස්තුවේ ත්වරණය කීයද? (g = 10 m s⁻²)",["5 m s⁻²","10 m s⁻²","15 m s⁻²","25 m s⁻²"],"බර = mg = 20 N. අසංතුලිත බලය = 30 − 20 = 10 N. a = F/m = 10 ÷ 2 = 5 m s⁻² (ඉහළට)."],["An upward force of 30 N acts on a 2 kg object. What is its acceleration? (g = 10 m s⁻²)",["5 m s⁻²","10 m s⁻²","15 m s⁻²","25 m s⁻²"],"Weight = mg = 20 N. Unbalanced force = 30 − 20 = 10 N. a = F/m = 10 ÷ 2 = 5 m s⁻² upwards."],"2024 Q33"],["FORCE",0,["භ්‍රමණ ලක්ෂ්‍යයක සිට 0.4 m ලම්බ දුරින් 25 N බලයක් ක්‍රියා කරයි. සූර්ණය කීයද?",["10 N m","62.5 N m","25.4 N m","100 N m"],"M = F × d = 25 × 0.4 = 10 N m."],["A force of 25 N acts at a perpendicular distance of 0.4 m from a pivot. What is the moment?",["10 N m","62.5 N m","25.4 N m","100 N m"],"M = F × d = 25 × 0.4 = 10 N m."],"2024 Q35"],["FORCE",0,["කුට්ටියක් මත දකුණට 15 N බලයක්ද, වමට 4 N සහ 6 N බල දෙකක්ද ක්‍රියා කරයි. සම්ප්‍රයුක්ත බලය කුමක්ද?",["5 N දකුණට","5 N වමට","25 N දකුණට","25 N වමට"],"වමට මුළු බලය = 4 + 6 = 10 N. සම්ප්‍රයුක්තය = 15 − 10 = 5 N, විශාල බලයේ දිශාවට (දකුණට)."],["A 15 N force acts to the right on a block, and forces of 4 N and 6 N act to the left. What is the resultant force?",["5 N to the right","5 N to the left","25 N to the right","25 N to the left"],"Total to the left = 4 + 6 = 10 N. Resultant = 15 − 10 = 5 N, in the direction of the larger force (right)."],"2025 Q3"],["FORCE",0,["දොරක සරනේරුවේ සිට 0.8 m ලම්බ දුරින් 5 N බලයක් යොදයි. සරනේරුව වටා සූර්ණය කීයද?",["4 N m","6.25 N m","0.16 N m","40 N m"],"M = F × d = 5 × 0.8 = 4 N m."],["A 5 N force is applied at a perpendicular distance of 0.8 m from a door hinge. What is the moment about the hinge?",["4 N m","6.25 N m","0.16 N m","40 N m"],"M = F × d = 5 × 0.8 = 4 N m."],"2025 Q14"],["FORCE",1,["සෘජු මාර්ගයක ඒකාකාර ප්‍රවේගයෙන් ගමන් කරන කාරයක් පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["කාරය මත අසංතුලිත බලයක් ක්‍රියා කරයි","කාරය මත සම්ප්‍රයුක්ත බලය ශුන්‍යයි","කාරය මත කිසිදු බලයක් ක්‍රියා නොකරයි","කාරයේ ත්වරණය නියත ධන අගයකි"],"ඒකාකාර ප්‍රවේගය = ත්වරණය ශුන්‍යයි. F = ma නිසා සම්ප්‍රයුක්ත බලය ශුන්‍යයි. එන්ජිම තල්ලු කරන බලය ඝර්ෂණය සහ වායු ප්‍රතිරෝධය සමඟ සංතුලිත වේ."],["Which statement about a car moving at constant velocity along a straight road is correct?",["an unbalanced force acts on the car","the resultant force on the car is zero","no forces act on the car","the car has a constant positive acceleration"],"Constant velocity means zero acceleration, so by F = ma the resultant force is zero. The engine's driving force balances friction and air resistance."],"2025 Q17"],["FORCE",2,["පහත ඒවා අතරින් ඝර්ෂණය අඩු කිරීමට භාවිත කරන ක්‍රමයක් නොවන්නේ කුමක්ද?",["ලිහිසි තෙල් යෙදීම","බෝල බෙයාරිං භාවිතය","පෘෂ්ඨ රළු කිරීම","චුම්බක මගින් පෘෂ්ඨ ස්පර්ශ නොවී තබා ගැනීම"],"පෘෂ්ඨ රළු කිරීම ඝර්ෂණය වැඩි කරයි (උදා. ටයර් රටා). චුම්බක දුම්රියේ (maglev) පීලි සහ දුම්රිය ස්පර්ශ නොවන නිසා ඝර්ෂණය ඉතා අඩුය."],["Which of these is NOT a way of reducing friction?",["applying lubricating oil","using ball bearings","making the surfaces rough","using magnets so that the surfaces do not touch"],"Making surfaces rough increases friction (e.g. tyre treads). In a maglev train the train and track do not touch, so friction is very small."],"2025 Q31"],["ELEC",0,["240 V, 60 W ලෙස සලකුණු කළ බල්බයක් සම්පූර්ණ ජවයෙන් දැල්වෙන විට එය හරහා ගලන ධාරාව කීයද?",["0.25 A","4 A","180 A","14 400 A"],"P = VI නිසා I = P ÷ V = 60 ÷ 240 = 0.25 A."],["A bulb marked 240 V, 60 W is working at full power. What current flows through it?",["0.25 A","4 A","180 A","14 400 A"],"P = VI, so I = P ÷ V = 60 ÷ 240 = 0.25 A."],"2018 Q35"],["ELEC",0,["2 Ω සහ 3 Ω ප්‍රතිරෝධක ශ්‍රේණිගතව සම්බන්ධ කර, එම සංයෝජනය 5 Ω ප්‍රතිරෝධකයක් සමඟ සමාන්තරගතව සම්බන්ධ කර ඇත. සමක ප්‍රතිරෝධය කීයද?",["2.5 Ω","10 Ω","1.2 Ω","5 Ω"],"ශ්‍රේණි කොටස = 2 + 3 = 5 Ω. 5 Ω ∥ 5 Ω: 1/R = 1/5 + 1/5 = 2/5, R = 2.5 Ω."],["A 2 Ω and a 3 Ω resistor are in series, and this combination is in parallel with a 5 Ω resistor. What is the equivalent resistance?",["2.5 Ω","10 Ω","1.2 Ω","5 Ω"],"Series part = 2 + 3 = 5 Ω. 5 Ω ∥ 5 Ω: 1/R = 1/5 + 1/5 = 2/5, so R = 2.5 Ω."],"2018 Q36"],["ELEC",3,["එකම ද්‍රව්‍යයෙන් සෑදූ පහත කම්බි අතරින් වැඩිම ප්‍රතිරෝධය ඇත්තේ කුමකටද?",["කෙටි, ඝන කම්බිය","දිගු, ඝන කම්බිය","කෙටි, තුනී කම්බිය","දිගු, තුනී කම්බිය"],"ප්‍රතිරෝධය දිගට අනුලෝමව සහ හරස්කඩ වර්ගඵලයට ප්‍රතිලෝමව සමානුපාතිකයි. දිගු හා තුනී කම්බියට වැඩිම ප්‍රතිරෝධය ඇත."],["Of these wires made of the same material, which has the greatest resistance?",["short and thick","long and thick","short and thin","long and thin"],"Resistance is directly proportional to length and inversely proportional to cross-sectional area, so the long, thin wire has the most."],"2019 Q18"],["ELEC",2,["1.5 V කෝෂ 4ක් ශ්‍රේණිගතව (+ අග්‍රය ඊළඟ කෝෂයේ − අග්‍රයට) සම්බන්ධ කළ විට මුළු වෝල්ටීයතාව කීයද?",["1.5 V","3 V","6 V","0.375 V"],"ශ්‍රේණිගතව සම්බන්ධ කළ කෝෂවල වෝල්ටීයතා එකතු වේ: 4 × 1.5 = 6 V."],["Four 1.5 V cells are connected in series (+ to −). What is the total voltage?",["1.5 V","3 V","6 V","0.375 V"],"The voltages of cells in series add up: 4 × 1.5 = 6 V."],"2020 Q23"],["ELEC",3,["3 Ω ප්‍රතිරෝධක තුනක් සම්බන්ධ කරන පහත ක්‍රම අතරින් අවම සමක ප්‍රතිරෝධය ලැබෙන්නේ කුමකින්ද?",["තුනම ශ්‍රේණිගතව","දෙකක් ශ්‍රේණිගතව, එය තුන්වැන්නට සමාන්තරගතව","දෙකක් සමාන්තරගතව, එය තුන්වැන්නට ශ්‍රේණිගතව","තුනම සමාන්තරගතව"],"තුනම ශ්‍රේණි = 9 Ω. (3+3)∥3 = 2 Ω. (3∥3)+3 = 4.5 Ω. තුනම සමාන්තර = 1 Ω (අවම)."],["Three 3 Ω resistors are connected in different ways. Which gives the lowest equivalent resistance?",["all three in series","two in series, in parallel with the third","two in parallel, in series with the third","all three in parallel"],"All series = 9 Ω. (3+3)∥3 = 2 Ω. (3∥3)+3 = 4.5 Ω. All parallel = 1 Ω (lowest)."],"2021 Q21"],["ELEC",1,["සර්වසම බල්බ දෙකක් එකම කෝෂයට ශ්‍රේණිගතව සම්බන්ධ කළ විට, එම කෝෂයට තනිව සම්බන්ධ කළ බල්බයකට සාපේක්ෂව දීප්තිය කෙසේද?",["දෙකම වඩා දීප්තිමත්","දෙකම වඩා අඳුරු","දීප්තිය සමාන","එක් බල්බයක් පමණක් දැල්වේ"],"ශ්‍රේණිගතව මුළු ප්‍රතිරෝධය දෙගුණ වන නිසා ධාරාව අඩු වේ. සෑම බල්බයකටම ලැබෙන්නේ වෝල්ටීයතාවයෙන් අඩක් නිසා ඒවා අඳුරුය."],["Two identical bulbs are connected in series to a cell. Compared with one bulb alone on the same cell, they are",["both brighter","both dimmer","equally bright","only one lights up"],"In series the total resistance doubles, so the current falls, and each bulb gets half the voltage, so both are dimmer."],"2021 Q24"],["ELEC",0,["ලෝහ කම්බියක් හරහා විදුලි ධාරාවක් ගෙන යන්නේ කුමන අංශු මගින්ද?",["නිදහස් ඉලෙක්ට්‍රෝන","ප්‍රෝටෝන","ධන අයන","නියුට්‍රෝන"],"ලෝහවල පරමාණුවලට බැඳී නැති නිදහස් ඉලෙක්ට්‍රෝන ඇත. ඒවා සෘණ අග්‍රයේ සිට ධන අග්‍රය දෙසට ගලා යාම විදුලි ධාරාවයි."],["Which particles carry the electric current in a metal wire?",["free electrons","protons","positive ions","neutrons"],"Metals have free electrons not bound to atoms. Their flow from the negative to the positive terminal is the electric current."],"2022 Q6"],["ELEC",1,["උෂ්ණත්වය නියතව තබා කම්බියක දිග දෙගුණ කළ විට එහි ප්‍රතිරෝධයට කුමක් වේද?",["අඩක් වේ","දෙගුණ වේ","හතර ගුණ වේ","වෙනස් නොවේ"],"ප්‍රතිරෝධය දිගට අනුලෝමව සමානුපාතිකයි. දිග 2 ගුණයක් වූ විට ප්‍රතිරෝධයද 2 ගුණයක් වේ."],["At constant temperature, the length of a wire is doubled. What happens to its resistance?",["it halves","it doubles","it becomes four times larger","it does not change"],"Resistance is directly proportional to length, so doubling the length doubles the resistance."],"2022 Q34"],["ELEC",3,["ලෝහ සන්නායකයක ප්‍රතිරෝධය රඳා නොපවතින්නේ පහත කුමක් මතද?",["එහි දිග","එහි හරස්කඩ වර්ගඵලය","එය සෑදූ ද්‍රව්‍යය","එය හරහා ගලන ධාරාව"],"ප්‍රතිරෝධය දිග, හරස්කඩ වර්ගඵලය, ද්‍රව්‍යය සහ උෂ්ණත්වය මත රඳා පවතී. ධාරාව වෙනස් කළත් (උෂ්ණත්වය නියත නම්) ප්‍රතිරෝධය වෙනස් නොවේ."],["The resistance of a metal conductor does NOT depend on",["its length","its cross-sectional area","the material it is made of","the current flowing through it"],"Resistance depends on length, cross-sectional area, material and temperature. Changing the current (at constant temperature) does not change it."],"2023 Q22"],["ELEC",0,["සර්වසම බල්බ තුනක් A, B, C ඇත. B සහ C සමාන්තරගතව සම්බන්ධ කර, එම සංයෝජනය A සමඟ ශ්‍රේණිගතව කෝෂයකට සම්බන්ධ කර ඇත. බල්බවල දීප්තිය පිළිබඳ නිවැරදි සම්බන්ධතාවය කුමක්ද?",["A > B = C","A = B = C","A < B = C","B > C > A"],"මුළු ධාරාවම A හරහා ගලයි. එම ධාරාව B සහ C අතර සමානව බෙදේ. ඒ නිසා A දීප්තිමත්ම වන අතර B සහ C සමානව අඳුරුය."],["Three identical bulbs A, B and C: B and C are in parallel, and this combination is in series with A across a cell. Which shows their brightness correctly?",["A > B = C","A = B = C","A < B = C","B > C > A"],"All the current flows through A and then splits equally between B and C, so A is brightest and B and C are equally dim."],"2023 Q28"],["ELEC",0,["උෂ්ණත්වය වැඩි වන විට ලෝහ කම්බියක ප්‍රතිරෝධයට කුමක් වේද?",["වැඩි වේ","අඩු වේ","වෙනස් නොවේ","ශුන්‍ය වේ"],"උෂ්ණත්වය වැඩි වන විට ලෝහ පරමාණු වැඩිපුර කම්පනය වී ඉලෙක්ට්‍රෝන ගලායාමට බාධා වැඩි වේ. ඒ නිසා ප්‍රතිරෝධය වැඩි වේ."],["What happens to the resistance of a metal wire when its temperature rises?",["it increases","it decreases","it does not change","it becomes zero"],"As temperature rises, the metal atoms vibrate more and obstruct the flow of electrons more, so the resistance increases."],"2024 Q12"],["ELEC",2,["2 kW විදුලි තාපකයක් පැය 3ක් ක්‍රියාත්මක කළ විට වැය වන විදුලි ශක්තිය කීයද?",["0.67 kWh","5 kWh","6 kWh","6000 kWh"],"ශක්තිය = ජවය × කාලය = 2 kW × 3 h = 6 kWh (විදුලි ඒකක 6)."],["A 2 kW electric heater is used for 3 hours. How much electrical energy is used?",["0.67 kWh","5 kWh","6 kWh","6000 kWh"],"Energy = power × time = 2 kW × 3 h = 6 kWh (6 units)."],"2024 Q31"],["ELEC",0,["6 Ω ප්‍රතිරෝධක දෙකක් සමාන්තරගතව සම්බන්ධ කර, එයට 2 Ω ප්‍රතිරෝධකයක් ශ්‍රේණිගතව සම්බන්ධ කර ඇත. සමක ප්‍රතිරෝධය කීයද?",["5 Ω","14 Ω","8 Ω","1.5 Ω"],"6 Ω ∥ 6 Ω = 3 Ω (සමාන ප්‍රතිරෝධක දෙකක් = අඩක්). 3 + 2 = 5 Ω."],["Two 6 Ω resistors are in parallel, and a 2 Ω resistor is in series with them. What is the equivalent resistance?",["5 Ω","14 Ω","8 Ω","1.5 Ω"],"6 Ω ∥ 6 Ω = 3 Ω (two equal resistors = half). 3 + 2 = 5 Ω."],"2025 Q26"],["CELL",2,["\"සාමාන්‍ය සෛලය\" (typical cell) යනු කුමක්ද?",["සිරුරේ බහුලවම ඇති සෛල වර්ගය","සිරුරේ විශාලතම සෛලය","සෛල බොහොමයක පොදු ලක්ෂණ එකතු කර ගොඩනගා ගත් ආකෘති සෛලයක්","න්‍යෂ්ටියක් නැති සෛලයක්"],"සෛල විවිධ හැඩ හා කාර්ය ඇතත්, ඒවායේ පොදු ව්‍යුහ (සෛල පටලය, සෛල ප්ලාස්මය, න්‍යෂ්ටිය වැනි) එකතු කර අධ්‍යයනය සඳහා සාදා ගත් ආකෘතිය \"සාමාන්‍ය සෛලය\" යි."],["What is a \"typical cell\"?",["the most common type of cell in the body","the largest cell in the body","a model cell built from the features common to most cells","a cell with no nucleus"],"Cells vary in shape and job, but share common structures (membrane, cytoplasm, nucleus, etc.). The \"typical cell\" is a model built from those shared features for study."],"2018 Q7"],["CELL",0,["ග්ලූකෝස් අණු දෙකක් එක් වී සෑදෙන ද්විශර්කරාව කුමක්ද?",["මෝල්ටෝස්","සුක්‍රෝස්","ලැක්ටෝස්","පිෂ්ඨය"],"ග්ලූකෝස් + ග්ලූකෝස් = මෝල්ටෝස්. සුක්‍රෝස් = ග්ලූකෝස් + ෆ්‍රක්ටෝස්. ලැක්ටෝස් = ග්ලූකෝස් + ගැලැක්ටෝස්. පිෂ්ඨය බහුශර්කරාවකි."],["Which disaccharide is made from two glucose molecules?",["maltose","sucrose","lactose","starch"],"Glucose + glucose = maltose. Sucrose = glucose + fructose. Lactose = glucose + galactose. Starch is a polysaccharide."],"2018 Q11"],["CELL",2,["ශාක සෛලවල දක්නට ලැබෙන නමුත් සත්ව සෛලවල නොමැති ව්‍යුහ යුගලය කුමක්ද?",["න්‍යෂ්ටිය සහ සෛල පටලය","මයිටොකොන්ඩ්‍රියා සහ රයිබසෝම","සෛල බිත්තිය සහ හරිතලව","ගොල්ගි දේහ සහ සෛල පටලය"],"සෛල බිත්තිය (සෙලියුලෝස්) සහ හරිතලව ශාක සෛලවල පමණක් ඇත. න්‍යෂ්ටිය, සෛල පටලය, මයිටොකොන්ඩ්‍රියා, රයිබසෝම දෙකෙහිම ඇත."],["Which pair of structures is found in plant cells but not in animal cells?",["nucleus and cell membrane","mitochondria and ribosomes","cell wall and chloroplasts","Golgi bodies and cell membrane"],"The cellulose cell wall and chloroplasts are found only in plant cells. Nucleus, membrane, mitochondria and ribosomes are in both."],"2018 Q23"],["CELL",3,["පහත ඒවා අතරින් ජීවීන්ගේ ලක්ෂණයක් නොවන්නේ කුමක්ද?",["ශ්වසනය","පෝෂණය","ප්‍රජනනය","ලුණු ස්ඵටිකයක් ද්‍රාවණයක ප්‍රමාණයෙන් විශාල වීම"],"ස්ඵටිකයක් විශාල වන්නේ පිටතින් අංශු එකතු වීමෙනි. එය ජීවී වර්ධනයක් නොවේ. ජීවී වර්ධනය සෛල තුළ ද්‍රව්‍ය සංශ්ලේෂණයෙන් සිදු වේ."],["Which of these is NOT a characteristic of living things?",["respiration","nutrition","reproduction","a salt crystal growing larger in a solution"],"A crystal grows by particles adding to its outside, which is not living growth. Living growth comes from making new material inside cells."],"2018 Q34"],["CELL",2,["ආමාශය අයත් වන ජෛව සංවිධාන මට්ටම කුමක්ද?",["සෛලය","පටකය","ඉන්ද්‍රිය","පද්ධතිය"],"ආමාශය පේශි, අපිච්ඡද, සම්බන්ධක පටක වැනි පටක කිහිපයකින් සෑදුණු ඉන්ද්‍රියකි. එය ආහාර ජීර්ණ පද්ධතියේ කොටසකි."],["To which level of biological organization does the stomach belong?",["cell","tissue","organ","system"],"The stomach is an organ made of several tissues (muscle, epithelium, connective tissue). It is part of the digestive system."],"2019 Q1"],["CELL",2,["න්‍යෂ්ටි කිහිපයක් ඇති දිගු සෛල දක්නට ලැබෙන්නේ කුමන පටකයේද?",["රතු රුධිරාණු","සිනිඳු පේශි","කංකාල පේශි","හෘද පේශි"],"කංකාල පේශි සෛල දිගු, ඉරි සහිත සහ බහු න්‍යෂ්ටික වේ. මිනිස් රතු රුධිරාණුවල න්‍යෂ්ටියක් නැත. සිනිඳු හා හෘද පේශි සෛලවල සාමාන්‍යයෙන් එක් න්‍යෂ්ටියකි."],["In which tissue are long cells with many nuclei found?",["red blood cells","smooth muscle","skeletal muscle","cardiac muscle"],"Skeletal muscle cells are long, striated and multinucleate. Human red blood cells have no nucleus. Smooth and cardiac muscle cells usually have one nucleus."],"2019 Q38"],["CELL",0,["ජීවයේ මූලික ව්‍යුහමය හා කෘත්‍යමය ඒකකය කුමක්ද?",["සෛලය","පටකය","ඉන්ද්‍රිය","න්‍යෂ්ටිය"],"සියලු ජීවීන් සෛලවලින් සෑදී ඇති අතර ජීවී ක්‍රියා සිදු වන කුඩාම ඒකකය සෛලයයි. න්‍යෂ්ටිය සෛලයේ කොටසක් පමණි."],["What is the basic structural and functional unit of life?",["the cell","the tissue","the organ","the nucleus"],"All living things are made of cells, and the cell is the smallest unit that carries out life processes. The nucleus is only part of a cell."],"2020 Q1"],["CELL",2,["ඉච්ඡානුගත (ස්වේච්ඡා) පාලනය යටතේ ක්‍රියා කරන පේශි පටකය කුමක්ද?",["හෘද පේශි","සිනිඳු පේශි","කංකාල පේශි","ආමාශ බිත්තියේ පේශි"],"කංකාල පේශි අපේ කැමැත්ත අනුව ක්‍රියා කරයි (උදා. අත ඔසවීම). හෘද හා සිනිඳු පේශි අනිච්ඡානුගතය."],["Which muscle tissue is under voluntary control?",["cardiac muscle","smooth muscle","skeletal muscle","the muscle of the stomach wall"],"Skeletal muscle works when we choose (e.g. lifting an arm). Cardiac and smooth muscle are involuntary."],"2020 Q4"],["CELL",2,["DNA අණුවේ අඩංගු සීනි වර්ගය කුමක්ද?",["ග්ලූකෝස්","රයිබෝස්","ඩිඔක්සිරයිබෝස්","සුක්‍රෝස්"],"DNA = ඩිඔක්සිරයිබෝ න්‍යෂ්ටික අම්ලය, එහි සීනිය ඩිඔක්සිරයිබෝස් වේ. RNA හි ඇත්තේ රයිබෝස් ය."],["Which sugar is found in DNA?",["glucose","ribose","deoxyribose","sucrose"],"DNA = deoxyribonucleic acid, so its sugar is deoxyribose. RNA contains ribose."],"2020 Q17"],["CELL",0,["පහත ඒවා අතරින් පටක මට්ටමේ සංවිධානයකට උදාහරණයක් කුමක්ද?",["රුධිරය","වකුගඩුව","ආහාර ජීර්ණ පද්ධතිය","ශුක්‍රාණුව"],"රුධිරය සම්බන්ධක පටකයකි. වකුගඩුව ඉන්ද්‍රියකි, ආහාර ජීර්ණ පද්ධතිය පද්ධතියකි, ශුක්‍රාණුව සෛලයකි."],["Which of these is an example of the tissue level of organization?",["blood","kidney","digestive system","sperm"],"Blood is a connective tissue. The kidney is an organ, the digestive system is a system, and a sperm is a cell."],"2021 Q1"],["CELL",1,["හෘද පේශි සඳහා ආවේණික ලක්ෂණයක් කුමක්ද?",["ඉච්ඡානුගතව ක්‍රියා කිරීම","නොනවත්වා ක්‍රියා කළත් වෙහෙසට පත් නොවීම","සෛලයක න්‍යෂ්ටි රාශියක් තිබීම","ඉරි (striations) නොමැති වීම"],"හෘද පේශි අනිච්ඡානුගත, ඉරි සහිත, අතු බෙදුණු සෛල ඇති අතර ජීවිත කාලය පුරා වෙහෙසට පත් නොවී සංකෝචනය වේ."],["Which feature is special to cardiac muscle?",["it works voluntarily","it works non-stop without getting tired","each cell has many nuclei","it has no striations"],"Cardiac muscle is involuntary, striated and has branched cells, and it contracts throughout life without tiring."],"2021 Q4"],["CELL",0,["කාබෝහයිඩ්‍රේටවල හයිඩ්‍රජන් සහ ඔක්සිජන් අතර අනුපාතය සාමාන්‍යයෙන් කුමක්ද?",["2 : 1","1 : 2","1 : 1","3 : 1"],"කාබෝහයිඩ්‍රේටවල H සහ O ජලයේ මෙන් 2 : 1 අනුපාතයෙන් ඇත. උදා. ග්ලූකෝස් C₆H₁₂O₆ (12 : 6)."],["In carbohydrates, what is the usual ratio of hydrogen to oxygen?",["2 : 1","1 : 2","1 : 1","3 : 1"],"Carbohydrates have H and O in a 2 : 1 ratio, as in water. E.g. glucose C₆H₁₂O₆ (12 : 6)."],"2022 Q3"],["CELL",3,["පහත ශාක පටක අතරින් සංකීර්ණ පටකයක් වන්නේ කුමක්ද?",["මෘදුස්තර (parenchyma)","ස්ථූලකෝණාස්තර (collenchyma)","දෘඪස්තර (sclerenchyma)","ප්ලෝයමය"],"සංකීර්ණ පටකයක සෛල වර්ග කිහිපයක් ඇත. ශෛලමය සහ ප්ලෝයමය සංකීර්ණ පටක වේ. අනෙක් තුන සරල පටකයි (එක් සෛල වර්ගයකි)."],["Which of these plant tissues is a complex tissue?",["parenchyma","collenchyma","sclerenchyma","phloem"],"A complex tissue has several cell types. Xylem and phloem are complex; the other three are simple tissues (one cell type)."],"2022 Q5"],["CELL",1,["සිනිඳු පේශි දක්නට ලැබෙන්නේ කොතැනද?",["හෘදයේ බිත්තියේ","ආහාර මාර්ගයේ බිත්තියේ","ද්විශිරස්කයේ (biceps)","කකුලේ පේශිවල"],"සිනිඳු පේශි ආහාර මාර්ගය, රුධිර වාහිනී, මුත්‍රාශය වැනි හිස් ඉන්ද්‍රියවල බිත්තිවල ඇත. ඒවා ක්‍රමාකුංචනයෙන් ආහාර ඉදිරියට තල්ලු කරයි."],["Where is smooth muscle found?",["in the wall of the heart","in the wall of the alimentary canal","in the biceps","in the leg muscles"],"Smooth muscle is in the walls of hollow organs such as the gut, blood vessels and bladder. It pushes food along by peristalsis."],"2022 Q13"],["CELL",0,["ශාක සෛල බිත්තිය ප්‍රධාන වශයෙන් සෑදී ඇත්තේ කුමන ද්‍රව්‍යයෙන්ද?",["සෙලියුලෝස්","පිෂ්ඨය","ග්ලයිකෝජන්","ප්‍රෝටීන"],"සෙලියුලෝස් යනු ග්ලූකෝස්වලින් සෑදුණු බහුශර්කරාවකි. එය සෛලයට හැඩය සහ ශක්තිය දෙයි."],["What is the plant cell wall mainly made of?",["cellulose","starch","glycogen","protein"],"Cellulose is a polysaccharide made of glucose. It gives the cell its shape and strength."],"2023 Q7"],["CELL",1,["සත්ව සෛලවල (අක්මාව, පේශි) ගබඩා කරන බහුශර්කරාව කුමක්ද?",["පිෂ්ඨය","ග්ලයිකෝජන්","සෙලියුලෝස්","සුක්‍රෝස්"],"සතුන් අතිරික්ත ග්ලූකෝස් ග්ලයිකෝජන් ලෙස අක්මාවේ සහ පේශිවල ගබඩා කරයි. ශාක ගබඩා කරන්නේ පිෂ්ඨය ලෙසයි."],["Which polysaccharide is stored in animal cells (liver, muscle)?",["starch","glycogen","cellulose","sucrose"],"Animals store extra glucose as glycogen in the liver and muscles. Plants store it as starch."],"2023 Q24"],["CELL",2,["ශාකයට යාන්ත්‍රික ශක්තිය සපයන, මිය ගිය ඝන බිත්ති සහිත සෛල ඇති පටකය කුමක්ද?",["මෘදුස්තර","විභාජක පටකය","දෘඪස්තර","ප්ලෝයමය"],"දෘඪස්තර සෛලවල ලිග්නින් තැන්පත් වූ ඝන බිත්ති ඇති අතර පරිණත වූ විට මිය යයි. තන්තු සහ ගල් සෛල (උදා. පේර ගෙඩියේ) මෙයට අයත්ය."],["Which tissue gives a plant mechanical strength and has dead cells with thick walls?",["parenchyma","meristematic tissue","sclerenchyma","phloem"],"Sclerenchyma cells have thick, lignified walls and are dead when mature. Fibres and stone cells (e.g. in guava) belong to it."],"2024 Q1"],["CELL",1,["සෛලයේ ක්‍රියාකාරකම් පාලනය කරන සහ ප්‍රවේණික තොරතුරු (DNA) දරන ඉන්ද්‍රියිකාව කුමක්ද?",["රයිබසෝමය","න්‍යෂ්ටිය","හරිතලවය","රික්තකය"],"න්‍යෂ්ටියේ වර්ණදේහ (DNA) ඇත. එය සෛලයේ ක්‍රියා පාලනය කර ප්‍රවේණික ලක්ෂණ ඊළඟ පරම්පරාවට ගෙන යයි."],["Which organelle controls the cell's activities and carries the genetic information (DNA)?",["ribosome","nucleus","chloroplast","vacuole"],"The nucleus holds the chromosomes (DNA). It controls the cell and passes characteristics to the next generation."],"2024 Q6"],["CELL",3,["ප්‍රෝටීනවල අනිවාර්යයෙන්ම අඩංගු, නමුත් කාබෝහයිඩ්‍රේටවල නොමැති මූලද්‍රව්‍යය කුමක්ද?",["කාබන්","හයිඩ්‍රජන්","ඔක්සිජන්","නයිට්‍රජන්"],"කාබෝහයිඩ්‍රේට C, H, O වලින් පමණක් සෑදී ඇත. ප්‍රෝටීනවල C, H, O සමඟ N ද (සමහර විට S ද) ඇත."],["Which element is always found in proteins but not in carbohydrates?",["carbon","hydrogen","oxygen","nitrogen"],"Carbohydrates contain only C, H and O. Proteins also contain N (and sometimes S)."],"2025 Q1"],["CELL",0,["ළූණු පටලයේ සෛල අයඩින් වලින් වර්ණ ගන්වා ආලෝක අන්වීක්ෂයෙන් බලන විට පැහැදිලිව පෙනෙන ව්‍යුහ මොනවාද?",["සෛල බිත්තිය සහ න්‍යෂ්ටිය","රයිබසෝම සහ ගොල්ගි දේහ","හරිතලව සහ න්‍යෂ්ටිය","මයිටොකොන්ඩ්‍රියා සහ රයිබසෝම"],"ආලෝක අන්වීක්ෂයෙන් සෛල බිත්තිය සහ න්‍යෂ්ටිය පෙනේ. රයිබසෝම, ගොල්ගි, මයිටොකොන්ඩ්‍රියා බැලීමට ඉලෙක්ට්‍රෝන අන්වීක්ෂයක් අවශ්‍යයි. ළූණු පටලයේ හරිතලව නැත."],["Onion skin cells stained with iodine are viewed under a light microscope. Which structures are clearly seen?",["cell wall and nucleus","ribosomes and Golgi bodies","chloroplasts and nucleus","mitochondria and ribosomes"],"A light microscope shows the cell wall and nucleus. Ribosomes, Golgi bodies and mitochondria need an electron microscope. Onion skin has no chloroplasts."],"2025 Q2"],["CELL",0,["සෛලය, පටකය සහ ඉන්ද්‍රිය පිළිවෙළින් නිවැරදිව දැක්වෙන්නේ කුමන විකල්පයේද?",["ස්නායු සෛලය, ස්නායු පටකය, මොළය","මොළය, ස්නායු පටකය, ස්නායු සෛලය","ස්නායු පටකය, ස්නායු සෛලය, මොළය","ස්නායු සෛලය, මොළය, ස්නායු පටකය"],"සංවිධාන මට්ටම්: සෛලය (ස්නායු සෛලය) → පටකය (ස්නායු පටකය) → ඉන්ද්‍රිය (මොළය) → පද්ධතිය (ස්නායු පද්ධතිය)."],["Which option gives a cell, a tissue and an organ, in that order?",["nerve cell, nervous tissue, brain","brain, nervous tissue, nerve cell","nervous tissue, nerve cell, brain","nerve cell, brain, nervous tissue"],"Levels: cell (nerve cell) → tissue (nervous tissue) → organ (brain) → system (nervous system)."],"2025 Q6"],["CELL",0,["අතු බෙදුණු, ඉරි සහිත, එක් න්‍යෂ්ටියක් ඇති සහ වෙහෙසට පත් නොවන පේශි සෛල ඇත්තේ කුමන පේශි වර්ගයේද?",["හෘද පේශි","කංකාල පේශි","සිනිඳු පේශි","ද්විශිරස්ක පේශි"],"හෘද පේශි සෛල අතු බෙදී එකිනෙකට සම්බන්ධ වී ඇත. ඒවා ඉරි සහිත, ඒක න්‍යෂ්ටික සහ වෙහෙසට පත් නොවේ."],["Which muscle type has branched, striated cells with one nucleus that do not get tired?",["cardiac muscle","skeletal muscle","smooth muscle","biceps muscle"],"Cardiac muscle cells are branched and joined together. They are striated, have one nucleus and do not tire."],"2025 Q18"],["MOLE",1,["H₂SO₄ හි සාපේක්ෂ අණුක ස්කන්ධය කීයද? (H = 1, O = 16, S = 32)",["49","98","96","100"],"(2 × 1) + 32 + (4 × 16) = 2 + 32 + 64 = 98."],["What is the relative molecular mass of H₂SO₄? (H = 1, O = 16, S = 32)",["49","98","96","100"],"(2 × 1) + 32 + (4 × 16) = 2 + 32 + 64 = 98."],"2018 Q17"],["MOLE",2,["NH₃ මවුල 1ක ඇති මුළු පරමාණු ගණන කීයද? (L = 6.022 × 10²³ mol⁻¹)",["6.022 × 10²³","3 × 6.022 × 10²³","4 × 6.022 × 10²³","17 × 6.022 × 10²³"],"NH₃ අණුවක පරමාණු 4ක් (N 1 + H 3) ඇත. මවුල 1ක අණු 6.022 × 10²³ ඇති නිසා පරමාණු = 4 × 6.022 × 10²³."],["How many atoms in total are in 1 mole of NH₃? (L = 6.022 × 10²³ mol⁻¹)",["6.022 × 10²³","3 × 6.022 × 10²³","4 × 6.022 × 10²³","17 × 6.022 × 10²³"],"Each NH₃ molecule has 4 atoms (1 N + 3 H). One mole has 6.022 × 10²³ molecules, so atoms = 4 × 6.022 × 10²³."],"2018 Q21"],["MOLE",1,["2H₂ + O₂ → 2H₂O. O₂ මවුල 3ක් සමඟ සම්පූර්ණයෙන් ප්‍රතික්‍රියා කිරීමට අවශ්‍ය H₂ මවුල ගණන කීයද?",["3","6","1.5","2"],"සමීකරණයට අනුව H₂ : O₂ = 2 : 1. O₂ මවුල 3 සඳහා H₂ = 2 × 3 = 6 mol."],["2H₂ + O₂ → 2H₂O. How many moles of H₂ react completely with 3 moles of O₂?",["3","6","1.5","2"],"From the equation, H₂ : O₂ = 2 : 1. For 3 mol O₂, H₂ = 2 × 3 = 6 mol."],"2018 Q22"],["MOLE",0,["CO₂ මවුල 1ක් සහ N₂ මවුල 3ක් ඇති වායු මිශ්‍රණයක CO₂ හි මවුල භාගය කීයද?",["0.25","0.33","0.75","1"],"මවුල භාගය = CO₂ මවුල ÷ මුළු මවුල = 1 ÷ (1 + 3) = 0.25."],["A gas mixture has 1 mole of CO₂ and 3 moles of N₂. What is the mole fraction of CO₂?",["0.25","0.33","0.75","1"],"Mole fraction = moles of CO₂ ÷ total moles = 1 ÷ (1 + 3) = 0.25."],"2018 Q28"],["MOLE",1,["එතනෝල් (C₂H₅OH) අණුවක ඇති මුළු පරමාණු ගණන කීයද?",["8","9","6","3"],"C 2 + H (5 + 1) 6 + O 1 = 9."],["How many atoms in total are in one molecule of ethanol (C₂H₅OH)?",["8","9","6","3"],"C 2 + H (5 + 1) 6 + O 1 = 9."],"2019 Q4"],["MOLE",1,["ඔක්සිජන්වල සාපේක්ෂ පරමාණුක ස්කන්ධය 16 යන්නෙහි තේරුම කුමක්ද?",["ඔක්සිජන් පරමාණුවක ස්කන්ධය 16 g බව","ඔක්සිජන් පරමාණුවක ස්කන්ධය, ¹²C පරමාණුවක ස්කන්ධයෙන් 1/12 මෙන් 16 ගුණයක් බව","ඔක්සිජන් ග්‍රෑම් 1ක පරමාණු 16ක් ඇති බව","ඔක්සිජන් පරමාණුවක ප්‍රෝටෝන 16ක් ඇති බව"],"සාපේක්ෂ පරමාණුක ස්කන්ධය ඒකක රහිත අගයකි. එය ¹²C පරමාණුවක ස්කන්ධයෙන් 1/12 සමඟ සසඳයි. ඔක්සිජන් පරමාණුවක ප්‍රෝටෝන 8කි."],["What does \"the relative atomic mass of oxygen is 16\" mean?",["an oxygen atom has a mass of 16 g","an oxygen atom is 16 times as heavy as 1/12 of a ¹²C atom","1 g of oxygen contains 16 atoms","an oxygen atom has 16 protons"],"Relative atomic mass has no unit. It compares the atom's mass with 1/12 of the mass of a ¹²C atom. Oxygen has 8 protons."],"2019 Q7"],["MOLE",0,["1.0 mol dm⁻³ NaCl ද්‍රාවණයක් 250 cm³ සෑදීමට අවශ්‍ය NaCl ස්කන්ධය කීයද? (Na = 23, Cl = 35.5)",["14.6 g","58.5 g","234 g","5.85 g"],"n = 1.0 × 0.25 = 0.25 mol. NaCl = 58.5 g mol⁻¹. ස්කන්ධය = 0.25 × 58.5 ≈ 14.6 g."],["What mass of NaCl is needed to make 250 cm³ of 1.0 mol dm⁻³ NaCl solution? (Na = 23, Cl = 35.5)",["14.6 g","58.5 g","234 g","5.85 g"],"n = 1.0 × 0.25 = 0.25 mol. NaCl = 58.5 g mol⁻¹. Mass = 0.25 × 58.5 ≈ 14.6 g."],"2019 Q14"],["MOLE",0,["CaCO₃ → CaO + CO₂. CaCO₃ 50 g සම්පූර්ණයෙන් වියෝජනය කළ විට ලැබෙන CO₂ ස්කන්ධය කීයද? (C = 12, O = 16, Ca = 40)",["22 g","44 g","50 g","28 g"],"CaCO₃ = 100 g mol⁻¹, එබැවින් 50 g = 0.5 mol. CO₂ ද 0.5 mol. CO₂ ස්කන්ධය = 0.5 × 44 = 22 g."],["CaCO₃ → CaO + CO₂. What mass of CO₂ forms when 50 g of CaCO₃ decomposes completely? (C = 12, O = 16, Ca = 40)",["22 g","44 g","50 g","28 g"],"CaCO₃ = 100 g mol⁻¹, so 50 g = 0.5 mol, giving 0.5 mol CO₂. Mass = 0.5 × 44 = 22 g."],"2019 Q17"],["MOLE",1,["CH₄ + 2O₂ → CO₂ + 2H₂O. CH₄ 8 g සම්පූර්ණයෙන් දහනය කළ විට සෑදෙන ජල ස්කන්ධය කීයද? (H = 1, C = 12, O = 16)",["9 g","18 g","36 g","8 g"],"CH₄ = 16 g mol⁻¹, 8 g = 0.5 mol. CH₄ : H₂O = 1 : 2, එබැවින් H₂O = 1 mol = 18 g."],["CH₄ + 2O₂ → CO₂ + 2H₂O. What mass of water forms when 8 g of CH₄ burns completely? (H = 1, C = 12, O = 16)",["9 g","18 g","36 g","8 g"],"CH₄ = 16 g mol⁻¹, so 8 g = 0.5 mol. CH₄ : H₂O = 1 : 2, so H₂O = 1 mol = 18 g."],"2019 Q30"],["MOLE",1,["ජලය 9 g හි ඇති ජල අණු ගණන කීයද? (H = 1, O = 16, L = 6.022 × 10²³ mol⁻¹)",["6.022 × 10²³","3.011 × 10²³","9 × 6.022 × 10²³","1.5 × 6.022 × 10²³"],"H₂O = 18 g mol⁻¹. 9 g = 0.5 mol. අණු = 0.5 × 6.022 × 10²³ = 3.011 × 10²³."],["How many water molecules are in 9 g of water? (H = 1, O = 16, L = 6.022 × 10²³ mol⁻¹)",["6.022 × 10²³","3.011 × 10²³","9 × 6.022 × 10²³","1.5 × 6.022 × 10²³"],"H₂O = 18 g mol⁻¹. 9 g = 0.5 mol. Molecules = 0.5 × 6.022 × 10²³ = 3.011 × 10²³."],"2020 Q13"],["MOLE",0,["O₂ මවුල 2ක් සහ N₂ මවුල 8ක් ඇති වායු මිශ්‍රණයක O₂ හි මවුල භාගය කීයද?",["0.2","0.25","0.8","2"],"මවුල භාගය = 2 ÷ (2 + 8) = 0.2."],["A gas mixture has 2 moles of O₂ and 8 moles of N₂. What is the mole fraction of O₂?",["0.2","0.25","0.8","2"],"Mole fraction = 2 ÷ (2 + 8) = 0.2."],"2020 Q30"],["MOLE",2,["0.5 mol dm⁻³ NaOH ද්‍රාවණ 2 dm³ හි ඇති NaOH ස්කන්ධය කීයද? (NaOH = 40)",["10 g","20 g","40 g","80 g"],"n = සාන්ද්‍රණය × පරිමාව = 0.5 × 2 = 1 mol. ස්කන්ධය = 1 × 40 = 40 g."],["What mass of NaOH is in 2 dm³ of 0.5 mol dm⁻³ NaOH solution? (NaOH = 40)",["10 g","20 g","40 g","80 g"],"n = concentration × volume = 0.5 × 2 = 1 mol. Mass = 1 × 40 = 40 g."],"2021 Q11"],["MOLE",1,["CO₂ 22 g හි ඇති ඔක්සිජන් පරමාණු ගණන කීයද? (C = 12, O = 16, L = 6.022 × 10²³ mol⁻¹)",["3.011 × 10²³","6.022 × 10²³","1.2044 × 10²⁴","22 × 6.022 × 10²³"],"CO₂ = 44 g mol⁻¹, 22 g = 0.5 mol අණු. සෑම අණුවකම O පරමාණු 2ක් නිසා O = 1 mol = 6.022 × 10²³."],["How many oxygen atoms are in 22 g of CO₂? (C = 12, O = 16, L = 6.022 × 10²³ mol⁻¹)",["3.011 × 10²³","6.022 × 10²³","1.2044 × 10²⁴","22 × 6.022 × 10²³"],"CO₂ = 44 g mol⁻¹, so 22 g = 0.5 mol of molecules. Each has 2 O atoms, so O = 1 mol = 6.022 × 10²³."],"2021 Q16"],["MOLE",1,["NH₄NO₃ හි නයිට්‍රජන් ස්කන්ධ ප්‍රතිශතය කීයද? (H = 1, N = 14, O = 16)",["17.5%","35%","28%","60%"],"NH₄NO₃ = 14 + 4 + 14 + 48 = 80. N ස්කන්ධය = 28. (28 ÷ 80) × 100 = 35%."],["What is the percentage by mass of nitrogen in NH₄NO₃? (H = 1, N = 14, O = 16)",["17.5%","35%","28%","60%"],"NH₄NO₃ = 14 + 4 + 14 + 48 = 80. Mass of N = 28. (28 ÷ 80) × 100 = 35%."],"2022 Q17"],["MOLE",1,["O₂ 64 g හි ඇති මවුල ගණන කීය
