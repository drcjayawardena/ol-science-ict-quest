e pressure and force on the wall are greatest there. A thicker base withstands it."],"2018 Q37"],["PRESS",1,["වායුගෝලීය පීඩනය 1 × 10⁵ Pa නම්, 0.5 m² පෘෂ්ඨයක් මත වායුගෝලය යොදන බලය කීයද?",["2 × 10⁵ N","5 × 10⁴ N","1 × 10⁵ N","5 × 10⁵ N"],"F = P × A = 1 × 10⁵ × 0.5 = 5 × 10⁴ N."],["Atmospheric pressure is 1 × 10⁵ Pa. What force does the atmosphere exert on a surface of 0.5 m²?",["2 × 10⁵ N","5 × 10⁴ N","1 × 10⁵ N","5 × 10⁵ N"],"F = P × A = 1 × 10⁵ × 0.5 = 5 × 10⁴ N."],"2019 Q23"],["PRESS",1,["ද්‍රවයක සම්පූර්ණයෙන් ගිල්වූ වස්තුවක් මත ක්‍රියා කරන උත්ප්ලාවකතාව රඳා පවතින්නේ කුමක් මතද?",["වස්තුවේ ස්කන්ධය","විස්ථාපනය කළ ද්‍රව පරිමාව සහ ද්‍රවයේ ඝනත්වය","වස්තුවේ හැඩය","වස්තුව ඇති ගැඹුර"],"උත්ප්ලාවකතාව = විස්ථාපිත ද්‍රවයේ බර = V × ρ × g. එය වස්තුවේ ස්කන්ධය හෝ ගැඹුර මත රඳා නොපවතී."],["The upthrust on a body fully immersed in a liquid depends on",["the mass of the body","the volume of liquid displaced and the density of the liquid","the shape of the body","the depth of the body"],"Upthrust = weight of liquid displaced = V × ρ × g. It does not depend on the body's mass or its depth."],"2019 Q32"],["PRESS",3,["ද්‍රවයක ලක්ෂ්‍යයක පීඩනය රඳා නොපවතින්නේ කුමක් මතද?",["ගැඹුර","ද්‍රවයේ ඝනත්වය","ගුරුත්වජ ත්වරණය","බඳුනේ හැඩය"],"P = hρg. ද්‍රව පීඩනය ගැඹුර, ඝනත්වය සහ g මත පමණක් රඳා පවතී, බඳුනේ හැඩය හෝ පළල මත නොවේ."],["The pressure at a point in a liquid does NOT depend on",["depth","the density of the liquid","gravitational acceleration","the shape of the container"],"P = hρg. Liquid pressure depends only on depth, density and g, not on the shape or width of the container."],"2019 Q37"],["PRESS",0,["ගල් කැටයක් ජලයේ ගිලෙන්නේ ඇයි?",["ගල මත උත්ප්ලාවකතාව එහි බරට වඩා අඩු නිසා","ගල මත උත්ප්ලාවකතාවක් ක්‍රියා නොකරන නිසා","ගල ජලය විස්ථාපනය නොකරන නිසා","ජලයේ ඝනත්වය ගලට වඩා වැඩි නිසා"],"ගලට ද උත්ප්ලාවකතාවක් ඇත. නමුත් ගලේ ඝනත්වය ජලයට වඩා වැඩි නිසා බර, උත්ප්ලාවකතාවට වඩා වැඩිය."],["Why does a stone sink in water?",["the upthrust on it is less than its weight","no upthrust acts on it","it does not displace any water","water is denser than the stone"],"There is upthrust on the stone, but the stone is denser than water, so its weight is greater than the upthrust."],"2020 Q27"],["PRESS",0,["වාතයේදී දුනු තරාදියේ 10 N ලෙස කියවෙන වස්තුවක් ජලයේ සම්පූර්ණයෙන් ගිල්වූ විට 6 N ලෙස කියවේ. උත්ප්ලාවකතාව කීයද?",["4 N","6 N","10 N","16 N"],"උත්ප්ලාවකතාව = බරෙහි අඩු වීම = 10 − 6 = 4 N. එය විස්ථාපිත ජලයේ බරට සමානයි."],["An object reads 10 N on a spring balance in air and 6 N when fully immersed in water. What is the upthrust?",["4 N","6 N","10 N","16 N"],"Upthrust = loss in weight = 10 − 6 = 4 N, equal to the weight of water displaced."],"2021 Q28"],["PRESS",0,["පීඩනයේ SI ඒකකය වන පැස්කල් (1 Pa) යනු කුමක්ද?",["1 N m⁻²","1 N m","1 N m²","1 kg m⁻²"],"පීඩනය = බලය ÷ වර්ගඵලය, එබැවින් 1 Pa = 1 N m⁻²."],["What is one pascal (1 Pa), the SI unit of pressure?",["1 N m⁻²","1 N m","1 N m²","1 kg m⁻²"],"Pressure = force ÷ area, so 1 Pa = 1 N m⁻²."],"2022 Q2"],["PRESS",0,["රසදිය පීඩනමානයක රසදිය කඳේ උස අඩු වන්නේ කුමන අවස්ථාවේදීද?",["පීඩනමානය කන්දක මුදුනට ගෙන ගිය විට","නළය ඇල කළ විට","පළල් නළයක් භාවිත කළ විට","දිගු නළයක් භාවිත කළ විට"],"උස යන විට වායුගෝලීය පීඩනය අඩු වන නිසා කඳේ උසද අඩු වේ. නළය ඇල කිරීම හෝ පළල වෙනස් කිරීම සිරස් උසට බලපාන්නේ නැත."],["When does the height of the mercury column in a barometer decrease?",["when the barometer is taken to a mountain top","when the tube is tilted","when a wider tube is used","when a longer tube is used"],"Atmospheric pressure falls with altitude, so the column height falls. Tilting or widening the tube does not change the vertical height."],"2022 Q35"],["PRESS",0,["ඝන වස්තුවක් ද්‍රවයක පාවීමට අවශ්‍ය කොන්දේසිය කුමක්ද?",["වස්තුවේ ඝනත්වය ද්‍රවයේ ඝනත්වයට වඩා අඩු වීම","වස්තුවේ ස්කන්ධය ද්‍රවයේ ස්කන්ධයට වඩා අඩු වීම","වස්තුවේ පරිමාව ද්‍රවයේ පරිමාවට වඩා වැඩි වීම","වස්තුවේ බර ශුන්‍ය වීම"],"වස්තුවේ ඝනත්වය ද්‍රවයට වඩා අඩු නම්, ගිලෙන කොටසකින්ම එහි බරට සමාන උත්ප්ලාවකතාවක් ලැබේ, එබැවින් පාවේ."],["What condition must a solid object meet to float in a liquid?",["its density is less than the liquid's density","its mass is less than the liquid's mass","its volume is greater than the liquid's volume","its weight is zero"],"If the object is less dense than the liquid, part of it under the surface already gives upthrust equal to its weight, so it floats."],"2023 Q26"],["PRESS",1,["ඇණයක තුඩ උල් කර ඇත්තේ ඇයි?",["යොදන බලය වැඩි කිරීමට","කුඩා වර්ගඵලයක් මත බලය යෙදී පීඩනය වැඩි වීමට","ඇණයේ ස්කන්ධය අඩු කිරීමට","ඝර්ෂණය වැඩි කිරීමට"],"P = F ÷ A. තුඩේ වර්ගඵලය ඉතා කුඩා නිසා එම බලයෙන්ම ඉතා ඉහළ පීඩනයක් ඇති වී ඇණය පහසුවෙන් ඇතුළු වේ."],["Why is the tip of a nail made sharp?",["to increase the force applied","so the force acts on a small area, giving a high pressure","to reduce the mass of the nail","to increase friction"],"P = F ÷ A. The tip has a tiny area, so the same force gives a very high pressure and the nail goes in easily."],"2024 Q8"],["PRESS",0,["වසා ඇති ජල බෝතලයක පාවෙන කුඩා \"Cartesian diver\" එකක්, බෝතලය මිරිකූ විට ගිලෙන්නේ ඇයි?",["එය තුළට ජලය ඇතුළු වී වාතය සම්පීඩනය වී, විස්ථාපිත පරිමාව සහ උත්ප්ලාවකතාව අඩු වන නිසා","එහි බර වැඩි වන නිසා","ජලයේ ඝනත්වය අඩු වන නිසා","බෝතලයේ උෂ්ණත්වය වැඩි වන නිසා"],"මිරිකීමෙන් පීඩනය වැඩි වී diver එක තුළට ජලය ඇතුළු වේ. වාත බුබුල කුඩා වන නිසා විස්ථාපනය කරන ජල පරිමාව අඩු වී උත්ප්ලාවකතාව බරට වඩා අඩු වේ."],["A small \"Cartesian diver\" floats in a sealed water bottle. Why does it sink when the bottle is squeezed?",["water enters it and compresses the air, so the volume displaced and the upthrust decrease","its weight increases","the density of the water decreases","the temperature of the bottle rises"],"Squeezing raises the pressure, pushing water into the diver. The air bubble shrinks, so less water is displaced and the upthrust drops below the weight."],"2024 Q24"],["PRESS",0,["මිශ්‍ර නොවන A (ඉහළින්) සහ B (පහළින්) ද්‍රව දෙකක් ඇත. ඝන ගෝලයක් ඒ දෙක අතර මායිමේ පාවෙයි. ඝනත්ව අතර සම්බන්ධතාවය කුමක්ද?",["ρ_A < ρ_ගෝලය < ρ_B","ρ_B < ρ_ගෝලය < ρ_A","ρ_ගෝලය < ρ_A < ρ_B","ρ_A = ρ_B = ρ_ගෝලය"],"බර ද්‍රවය (B) පහළට යයි, එබැවින් ρ_A < ρ_B. ගෝලය A හි ගිලෙයි (A ට වඩා ඝනයි), නමුත් B මත පාවේ (B ට වඩා සැහැල්ලුයි)."],["Two immiscible liquids, A (top) and B (bottom), are in a jar. A solid ball floats at the boundary between them. How are the densities related?",["ρ_A < ρ_ball < ρ_B","ρ_B < ρ_ball < ρ_A","ρ_ball < ρ_A < ρ_B","ρ_A = ρ_B = ρ_ball"],"The denser liquid (B) is at the bottom, so ρ_A < ρ_B. The ball sinks in A (denser than A) but floats on B (less dense than B)."],"2025 Q22"],["PRESS",0,["වාහනවල හයිඩ්‍රොලික් තිරිංග ක්‍රියා කරන්නේ කුමන මූලධර්මය මතද?",["සංවෘත තරලයක යොදන පීඩනය සෑම දිශාවකටම සමානව සම්ප්‍රේෂණය වීම (පැස්කල් නියමය)","ආකිමිඩීස් මූලධර්මය","නිව්ටන්ගේ පළමු නියමය","ඕම් නියමය"],"පැඩලය මත යොදන කුඩා බලය තෙලේ පීඩනයක් ඇති කරයි. එම පීඩනය රෝදවල විශාල පිස්ටන වෙත සම්ප්‍රේෂණය වී විශාල බලයක් ලබා දෙයි."],["Hydraulic brakes in vehicles work on which principle?",["pressure applied to an enclosed fluid is transmitted equally in all directions (Pascal's law)","Archimedes' principle","Newton's first law","Ohm's law"],"A small force on the pedal creates pressure in the oil. This pressure is passed to larger pistons at the wheels, giving a large force."],"2025 Q35"],["PLANT",0,["ජලය මගින් විසුරුවා හැරීමට වඩාත් හොඳින් අනුවර්තනය වූ ඵලය කුමක්ද?",["පොල් ගෙඩිය (සැහැල්ලු තන්තුමය කෙඳි ආවරණය)","කටු සහිත ඵලයක්","පියාපත් සහිත ඇට","පුපුරන කරල්"],"පොල් ගෙඩියේ තන්තුමය කෙඳි (පොල් ලෙලි) වාතය රඳවා ගන්නා නිසා එය ජලයේ පාවී දුර ගමන් කරයි."],["Which fruit is best adapted for dispersal by water?",["a coconut (light, fibrous husk)","a spiny fruit","a winged seed","an exploding pod"],"The coconut's fibrous husk traps air, so it floats and can travel long distances on water."],"2018 Q9"],["PLANT",2,["ශාකයක මුල්වල සිට පත්‍ර දක්වා ජලය හා ඛනිජ ලවණ ගෙන යන පටකය කුමක්ද?",["ප්ලෝයමය","අපිචර්මය","ශෛලමය (xylem)","විභාජක පටකය"],"ශෛලමය ජලය හා ඛනිජ ඉහළට ගෙන යන අතර යාන්ත්‍රික ආධාරකයද සපයයි. ප්ලෝයමය ආහාර (සීනි) ගෙන යයි."],["Which tissue carries water and minerals from the roots to the leaves?",["phloem","epidermis","xylem","meristem"],"Xylem carries water and minerals upwards and also gives support. Phloem carries food (sugars)."],"2018 Q13"],["PLANT",1,["කොළ සහ සුදු කොටස් ඇති විචිත්‍ර පත්‍රයක් හිරු එළියේ තබා පිෂ්ඨ පරීක්ෂාව කළ විට නිල්-කළු වන්නේ කුමන කොටස්ද?",["සුදු කොටස් පමණි","කොළ කොටස් පමණි","සම්පූර්ණ පත්‍රයම","කිසිදු කොටසක් නැත"],"හරිතප්‍රද ඇත්තේ කොළ කොටස්වල පමණි. එහි පමණක් ප්‍රභාසංශ්ලේෂණය සිදු වී පිෂ්ඨ සෑදේ. මෙයින් ප්‍රභාසංශ්ලේෂණයට හරිතප්‍රද අවශ්‍ය බව පෙන්වයි."],["A variegated (green and white) leaf is kept in sunlight and then tested for starch. Which parts turn blue-black?",["only the white parts","only the green parts","the whole leaf","no part"],"Only the green parts have chlorophyll, so only they photosynthesize and make starch. This shows chlorophyll is needed."],"2018 Q19"],["PLANT",1,["ඉඟුරු අයත් වන භූගත කඳ වර්ගය කුමක්ද?",["කඳ අල","රයිසෝමය","බල්බය","කෝමය"],"ඉඟුරු සහ කහ පසට සමාන්තරව තිරස් අතට වැඩෙන, පුරුක් සහ පත්‍ර කොරපොතු ඇති රයිසෝම වේ."],["What type of underground stem is ginger?",["stem tuber","rhizome","bulb","corm"],"Ginger and turmeric are rhizomes: horizontal underground stems with nodes and scale leaves."],"2019 Q5"],["PLANT",0,["ශාක පත්‍රවල වායු හුවමාරුව ප්‍රධාන වශයෙන් සිදු වන්නේ කුමක් හරහාද?",["පුටිකා (stomata)","ශෛලමය","ප්ලෝයමය","මූල කේශ"],"පත්‍රයේ (බොහෝ විට යටි පෘෂ්ඨයේ) ඇති පුටිකා හරහා CO₂ ඇතුළු වී O₂ සහ ජල වාෂ්ප පිට වේ."],["Gas exchange in leaves mainly takes place through the",["stomata","xylem","phloem","root hairs"],"CO₂ enters and O₂ and water vapour leave through stomata, mostly on the lower surface of the leaf."],"2019 Q10"],["PLANT",2,["සුළඟ මගින් විසුරුවා හරින බීජ හෝ ඵලවල දක්නට ලැබෙන අනුවර්තනයක් කුමක්ද?",["මාංසල, පැණිරස ආවරණයක්","කොකු හෝ කටු","පියාපත් වැනි කොටස් හෝ සිහින් කෙඳි","ඝන, බර ආවරණයක්"],"පියාපත් (උදා. මහෝගනී) හෝ කෙඳි (උදා. වරා) නිසා බීජ සැහැල්ලු වී සුළඟේ පාවේ. කොකු සතුන් මගින් විසුරුවීමට, මාංසල ආවරණ සතුන් කෑමට අනුවර්තනයි."],["Which adaptation is found in seeds or fruits dispersed by wind?",["a fleshy, sweet covering","hooks or spines","wing-like parts or fine hairs","a thick, heavy covering"],"Wings (e.g. mahogany) or hairs (e.g. wara) make seeds light so the wind carries them. Hooks suit animal dispersal; fleshy coverings are eaten by animals."],"2020 Q18"],["PLANT",1,["කොකු හෝ කටු සහිත බීජ විසුරුවා හරින්නේ ප්‍රධාන වශයෙන් කුමක් මගින්ද?",["සුළඟ","සතුන්","ජලය","පිපිරීම"],"කොකු සතුන්ගේ ලොම් හෝ මිනිසුන්ගේ ඇඳුම්වල ඇලී දුර ප්‍රදේශවලට ගෙන යයි (උදා. ඇට්ටේරියා)."],["Seeds with hooks or spines are mainly dispersed by",["wind","animals","water","explosion"],"The hooks catch on animal fur or people's clothes and are carried far away."],"2021 Q5"],["PLANT",1,["ප්‍රභාසංශ්ලේෂණයට CO₂ අවශ්‍ය බව පෙන්වන පරීක්ෂණයේදී පාලක (control) සැකසුමේ පත්‍රය තබන්නේ කුමක් සහිත ජාඩියකද?",["KOH ද්‍රාවණය","KOH වෙනුවට ජලය","අයඩින් ද්‍රාවණය","ඇල්කොහොල්"],"පරීක්ෂණ පත්‍රය KOH සමඟ (CO₂ නැත). පාලක පත්‍රය ජලය සමඟ (CO₂ ඇත). වෙනස් වන්නේ CO₂ පමණක් නිසා ප්‍රතිඵලය CO₂ නිසා බව තහවුරු වේ."],["In the experiment showing CO₂ is needed for photosynthesis, the control leaf is kept in a jar containing",["KOH solution","water instead of KOH","iodine solution","alcohol"],"The test leaf has KOH (no CO₂); the control leaf has water (CO₂ present). Only CO₂ differs, so any difference is due to CO₂."],"2022 Q29"],["PLANT",0,["පිෂ්ඨ පරීක්ෂණයකට පෙර ශාකය පැය 48ක් පමණ අඳුරේ තබන්නේ ඇයි?",["පත්‍රවල දැනට ඇති පිෂ්ඨ ඉවත් කිරීමට (destarching)","ශාකයට විවේකයක් දීමට","හරිතප්‍රද වැඩි කිරීමට","ජලය අවශෝෂණය වැඩි කිරීමට"],"අඳුරේදී ප්‍රභාසංශ්ලේෂණය නොවන නිසා පත්‍රයේ පිෂ්ඨ වෙනත් කොටස්වලට ගෙන යයි. ඉන්පසු සෑදෙන පිෂ්ඨ පරීක්ෂණ තත්ත්වය නිසාම බව සහතික වේ."],["Why is a plant kept in the dark for about 48 hours before a starch experiment?",["to remove the starch already in the leaves (destarching)","to let the plant rest","to increase chlorophyll","to increase water uptake"],"In the dark there is no photosynthesis, so starch moves out of the leaves. Any starch found later must come from the test conditions."],"2022 Q30"],["PLANT",1,["පත්‍රවල සෑදෙන සීනි අල වැනි ගබඩා ඉන්ද්‍රිය වෙත ගෙන යන පටකය කුමක්ද?",["ශෛලමය","ප්ලෝයමය","අපිචර්මය","බාහිකය (cortex)"],"ප්ලෝයමය ප්‍රභාසංශ්ලේෂණ ඵල (සුක්‍රෝස්) ශාකයේ සෑම කොටසකටම ගෙන යයි. එය ස්ථානාන්තරණය (translocation) ලෙස හැඳින්වේ."],["Which tissue carries sugars made in the leaves to storage organs such as tubers?",["xylem","phloem","epidermis","cortex"],"Phloem carries the products of photosynthesis (sucrose) to all parts of the plant. This is called translocation."],"2023 Q4"],["PLANT",2,["දහවල් දැඩි හිරු එළියේදී කොළ පැහැති ශාකයක සිදු වන්නේ කුමක්ද?",["ශ්වසනය පමණි","ප්‍රභාසංශ්ලේෂණය පමණි","දෙකම සිදු වේ, ප්‍රභාසංශ්ලේෂණය වේගවත් නිසා CO₂ ශුද්ධ ලෙස අවශෝෂණය වේ","කිසිවක් සිදු නොවේ"],"ශාක දිවා රෑ දෙකේම ශ්වසනය කරයි. දහවල් ප්‍රභාසංශ්ලේෂණය ශ්වසනයට වඩා වේගවත් නිසා CO₂ අවශෝෂණය කර O₂ පිට කරයි."],["What happens in a green plant in bright midday sunlight?",["respiration only","photosynthesis only","both happen; photosynthesis is faster, so there is a net uptake of CO₂","neither happens"],"Plants respire day and night. In bright light photosynthesis is faster than respiration, so CO₂ is taken in and O₂ given out overall."],"2023 Q33"],["PLANT",3,["ප්‍රභාසංශ්ලේෂණයේ අතුරු ඵලය (by-product) ලෙස පිට වන්නේ කුමක්ද?",["ග්ලූකෝස්","CO₂","ජලය","ඔක්සිජන්"],"6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. ප්‍රධාන ඵලය ග්ලූකෝස්, අතුරු ඵලය O₂ වේ."],["What is given out as the by-product of photosynthesis?",["glucose","CO₂","water","oxygen"],"6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. The main product is glucose; the by-product is O₂."],"2024 Q27"],["PLANT",2,["ළූණු අයත් වන භූගත කඳ වර්ගය කුමක්ද?",["රයිසෝමය","කඳ අල","බල්බය","කෝමය"],"ළූණු බල්බයකි. කෙටි කඳ වටා ආහාර ගබඩා කළ මාංසල පත්‍ර ස්තර ඇත. අර්තාපල් කඳ අලයකි, ඉඟුරු රයිසෝමයකි."],["What type of underground stem is an onion?",["rhizome","stem tuber","bulb","corm"],"An onion is a bulb: a short stem surrounded by fleshy leaves that store food. Potato is a stem tuber; ginger is a rhizome."],"2025 Q10"],["PLANT",3,["පහත ඒවා අතරින් ප්‍රභාසංශ්ලේෂණයට අවශ්‍ය සාධකයක් නොවන්නේ කුමක්ද?",["ආලෝකය","CO₂","හරිතප්‍රද","ඔක්සිජන්"],"ප්‍රභාසංශ්ලේෂණයට ආලෝකය, CO₂, ජලය සහ හරිතප්‍රද අවශ්‍යයි. ඔක්සිජන් ඵලයක් මිස අවශ්‍යතාවක් නොවේ."],["Which of these is NOT needed for photosynthesis?",["light","CO₂","chlorophyll","oxygen"],"Photosynthesis needs light, CO₂, water and chlorophyll. Oxygen is a product, not a requirement."],"2025 Q19"],["CLASS",2,["පහත ශාක අතරින් බීජ නොසාදන ශාකය කුමක්ද?",["පොල්","පයිනස්","පර්ණාංගය (fern)","වී"],"පර්ණාංග බීජ වෙනුවට බීජාණු (spores) මගින් ප්‍රජනනය වේ. පයිනස් විවෘතබීජක, පොල් සහ වී සපුෂ්ප ශාකයි."],["Which of these plants does not produce seeds?",["coconut","Pinus","fern","paddy"],"Ferns reproduce by spores, not seeds. Pinus is a gymnosperm; coconut and paddy are flowering plants."],"2018 Q1"],["CLASS",3,["තෙත්, ග්‍රන්ථිමය සමක් ඇති, ජීවිතයේ කොටසක් ජලයේ සහ කොටසක් ගොඩබිම ගත කරන පෘෂ්ඨවංශී කාණ්ඩය කුමක්ද?",["මත්ස්‍ය","උරග","පක්ෂි","උභයජීවී"],"ගෙම්බා වැනි උභයජීවීන්ට තෙත් සමක් ඇති අතර සම හරහාද ශ්වසනය කරයි. ඔවුන් ජලයේ බිත්තර දමයි."],["Which vertebrate class has moist, glandular skin and lives partly in water and partly on land?",["fish","reptiles","birds","amphibians"],"Amphibians such as frogs have moist skin and also breathe through it. They lay eggs in water."],"2018 Q27"],["CLASS",2,["පහත සතුන් අතරින් ආත්‍රපෝඩා වංශයට අයත් සතා කුමක්ද?",["ගැඬවිලා","ගොළුබෙල්ලා","කකුළුවා","මුහුදු තාරකාව"],"කකුළුවාට බාහිර සැකිල්ලක් සහ සන්ධි සහිත පාද ඇත. ගැඬවිලා = ඇනලීඩා, ගොළුබෙල්ලා = මොලුස්කා, මුහුදු තාරකාව = එකයිනෝඩර්මේටා."],["Which of these animals belongs to the phylum Arthropoda?",["earthworm","snail","crab","starfish"],"A crab has an exoskeleton and jointed legs. Earthworm = Annelida, snail = Mollusca, starfish = Echinodermata."],"2019 Q22"],["CLASS",0,["උෂ්ණ රුධිර (නියත දේහ උෂ්ණත්ව) සතුන් ඇති පෘෂ්ඨවංශී කාණ්ඩ යුගලය කුමක්ද?",["පක්ෂීන් සහ ක්ෂීරපායීන්","උරගයින් සහ පක්ෂීන්","මත්ස්‍යයින් සහ ක්ෂීරපායීන්","උභයජීවීන් සහ උරගයින්"],"පක්ෂීන් සහ ක්ෂීරපායීන් පමණක් පරිසර උෂ්ණත්වය කුමක් වුවත් දේහ උෂ්ණත්වය නියතව තබා ගනී."],["Which two vertebrate classes are warm-blooded (keep a constant body temperature)?",["birds and mammals","reptiles and birds","fish and mammals","amphibians and reptiles"],"Only birds and mammals keep their body temperature constant whatever the surroundings."],"2020 Q22"],["CLASS",1,["වෛරස පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["ඒවාට සංවිධිත න්‍යෂ්ටියක් ඇත","ඒවා ජීවී සෛලයක් තුළ පමණක් ප්‍රජනනය වේ","ඒවා ප්‍රතිජීවක මගින් විනාශ වේ","ඒවා ප්‍රභාසංශ්ලේෂණය කරයි"],"වෛරසවලට සෛල ව්‍යුහයක් නැත. ඒවා ධාරක සෛලයක් තුළදී පමණක් ගුණනය වේ. ප්‍රතිජීවක වෛරසවලට බලපාන්නේ නැත."],["Which statement about viruses is correct?",["they have an organized nucleus","they reproduce only inside living cells","they are destroyed by antibiotics","they photosynthesize"],"Viruses have no cell structure and multiply only inside a host cell. Antibiotics do not affect viruses."],"2020 Q25"],["CLASS",1,["පහත යුගල අතරින් ශීත රුධිර සතුන් දෙදෙනාම ඇති යුගලය කුමක්ද?",["බල්ලා සහ කපුටා","කිඹුලා සහ ගෙම්බා","වවුලා සහ තල්මසා","කුකුළා සහ කිඹුලා"],"කිඹුලා (උරග) සහ ගෙම්බා (උභයජීවී) ශීත රුධිරයි. බල්ලා, වවුලා, තල්මසා ක්ෂීරපායී; කපුටා, කුකුළා පක්ෂි නිසා උෂ්ණ රුධිරයි."],["Which pair are both cold-blooded animals?",["dog and crow","crocodile and frog","bat and whale","hen and crocodile"],"The crocodile (reptile) and frog (amphibian) are cold-blooded. Dogs, bats and whales are mammals; crows and hens are birds, so warm-blooded."],"2021 Q23"],["CLASS",2,["සියලුම සාමාජිකයන් විෂමපෝෂී (තමන්ගේ ආහාර නිපදවා නොගන්නා) වන රාජධානි යුගලය කුමක්ද?",["ශාක සහ ප්‍රොටිස්ටා","ශාක සහ සත්ත්ව","දිලීර සහ සත්ත්ව","ප්‍රොටිස්ටා සහ දිලීර"],"දිලීර සහ සතුන් සියල්ලම විෂමපෝෂීය. ශාක ස්වයංපෝෂී වන අතර ප්‍රොටිස්ටා අතර ස්වයංපෝෂී (ඇල්ගී) සහ විෂමපෝෂී (අමීබා) දෙවර්ගයම ඇත."],["In which two kingdoms are all members heterotrophic (unable to make their own food)?",["plants and protists","plants and animals","fungi and animals","protists and fungi"],"All fungi and animals are heterotrophs. Plants are autotrophs, and protists include both autotrophs (algae) and heterotrophs (amoeba)."],"2022 Q9"],["CLASS",1,["ඛණ්ඩිත, දිගටි, තෙත් සමක් සහිත, පාද නැති ගැඬවිලා අයත් වංශය කුමක්ද?",["ආත්‍රපෝඩා","ඇනලීඩා","මොලුස්කා","නෙමටෝඩා"],"ඇනලීඩාවන්ට වළලු වැනි ඛණ්ඩ ඇති දිගටි දේහයක් ඇත. සන්ධි සහිත පාද නැත. සමෙන් ශ්වසනය කරයි."],["To which phylum does the earthworm, with a long, segmented, moist body and no legs, belong?",["Arthropoda","Annelida","Mollusca","Nematoda"],"Annelids have a long body of ring-like segments and no jointed legs, and they breathe through their skin."],"2022 Q16"],["CLASS",0,["ඒකබීජපත්‍රී ශාකවල ලක්ෂණ යුගලය කුමක්ද?",["සමාන්තර නාරටි සහ තන්තුමය මුල් පද්ධතිය","ජාලාකාර නාරටි සහ මූලික මුල","සමාන්තර නාරටි සහ මූලික මුල","ජාලාකාර නාරටි සහ තන්තුමය මුල් පද්ධතිය"],"ඒකබීජපත්‍රී (උදා. වී, පොල්, තණකොළ): සමාන්තර නාරටි, තන්තුමය මුල්. ද්විබීජපත්‍රී: ජාලාකාර නාරටි, මූලික මුල."],["Which pair of features belongs to monocot plants?",["parallel veins and a fibrous root system","net veins and a tap root","parallel veins and a tap root","net veins and a fibrous root system"],"Monocots (e.g. paddy, coconut, grass): parallel veins, fibrous roots. Dicots: net veins, a tap root."],"2023 Q8"],["CLASS",1,["ක්ෂීරපායීන්ට පමණක් ආවේණික ලක්ෂණය කුමක්ද?",["උෂ්ණ රුධිරය","රෝම සහ ක්ෂීර ග්‍රන්ථි","පෙනහළු මගින් ශ්වසනය","පෘෂ්ඨවංශයක් තිබීම"],"පක්ෂීන්ද උෂ්ණ රුධිර සහ පෙනහළු ඇති පෘෂ්ඨවංශීන්ය. රෝම සහ කිරි නිපදවන ක්ෂීර ග්‍රන්ථි ඇත්තේ ක්ෂීරපායීන්ට පමණි."],["Which feature is found only in mammals?",["being warm-blooded","hair and mammary glands","breathing with lungs","having a backbone"],"Birds are also warm-blooded vertebrates with lungs. Only mammals have hair and milk-producing mammary glands."],"2023 Q16"],["CLASS",0,["වී ශාකයේ විද්‍යාත්මක නාමය නිවැරදිව ලියා ඇත්තේ කුමන විකල්පයේද?",["<i>Oryza sativa</i>","<i>oryza sativa</i>","<i>Oryza Sativa</i>","Oryza sativa (ඇල අකුරු නැතිව)"],"ද්විපද නාමකරණයේ ගණ නාමය කැපිටල් අකුරෙන්, විශේෂ නාමය සිම්පල් අකුරෙන් ලියා, මුද්‍රණයේදී ඇල අකුරෙන් (අතින් ලියන විට වෙන වෙනම යටින් ඉරි ඇඳ) දැක්විය යුතුය."],["Which option shows the scientific name of the paddy plant written correctly?",["<i>Oryza sativa</i>","<i>oryza sativa</i>","<i>Oryza Sativa</i>","Oryza sativa (not in italics)"],"In binomial names the genus starts with a capital, the species with a small letter, and the name is printed in italics (underlined separately when handwritten)."],"2024 Q5"],["CLASS",2,["බැක්ටීරියා පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["ඒවාට සංවිධිත න්‍යෂ්ටියක් ඇත","ඒවා සියල්ලම රෝග කාරකයි","ඒවාට සංවිධිත න්‍යෂ්ටියක් නැත (ප්‍රාග් න්‍යෂ්ටික)","ඒවා ජීවී සෛල තුළ පමණක් ජීවත් වේ"],"බැක්ටීරියා ප්‍රාග් න්‍යෂ්ටික ජීවීන්ය. බොහෝ බැක්ටීරියා හානිකර නොවන අතර සමහරක් ප්‍රයෝජනවත්ය (උදා. යෝගට් සෑදීම, N₂ තිර කිරීම)."],["Which statement about bacteria is true?",["they have an organized nucleus","all of them cause disease","they have no organized nucleus (prokaryotic)","they live only inside living cells"],"Bacteria are prokaryotes. Most are harmless and some are useful (e.g. making yoghurt, fixing N₂)."],"2024 Q22"],["CLASS",2,["සපුෂ්ප ශාක (angiosperms) පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["ඒවා බීජාණු මගින් ප්‍රජනනය වේ","ඒවායේ බීජ විවෘතව පවතී","ඒවායේ බීජ ඵලයක් තුළ ආවරණය වී ඇති අතර ඒකබීජපත්‍රී සහ ද්විබීජපත්‍රී ලෙස බෙදේ","ඒවාට සනාල පටක නැත"],"සපුෂ්ප ශාක මල් හට ගෙන ඵල තුළ බීජ සාදයි. විවෘතබීජකවල (උදා. පයිනස්) බීජ ආවරණය වී නැත."],["Which statement about flowering plants (angiosperms) is correct?",["they reproduce by spores","their seeds are exposed","their seeds are enclosed in a fruit, and they are divided into monocots and dicots","they have no vascular tissue"],"Flowering plants produce flowers and form seeds inside fruits. Gymnosperms (e.g. Pinus) have exposed seeds."],"2025 Q5"],["BOND",1,["H₂O අණුවේ ලුවිස් ව්‍යුහයේ ඔක්සිජන් පරමාණුව වටා ඇති එකසර (lone) ඉලෙක්ට්‍රෝන යුගල ගණන කීයද?",["1","2","3","4"],"O හි පිටත ඉලෙක්ට්‍රෝන 6කි. H දෙකක් සමඟ යුගල 2ක් බන්ධනවලට යයි. ඉතිරි ඉලෙක්ට්‍රෝන 4 = එකසර යුගල 2."],["In the Lewis structure of H₂O, how many lone pairs are on the oxygen atom?",["1","2","3","4"],"O has 6 outer electrons. Two pairs form bonds with the two H atoms, leaving 4 electrons = 2 lone pairs."],"2018 Q30"],["BOND",2,["NaCl විදුලිය සන්නයනය කරන්නේ කුමන අවස්ථාවලදීද?",["ඝන අවස්ථාවේදී පමණි","ඝන සහ විලීන අවස්ථා දෙකේදීම","විලීන ( has valency 1 (X⁺). H₂Y shows Y has valency 2 (Y²⁻). So the formula is X₂Y."],"2024 Q9"],["CIRC",3,["රුධිරයේ සංඝටක සහ ඒවායේ කාර්ය නිවැරදිව ගැළපෙන්නේ කුමන විකල්පයේද?",["රතු රුධිරාණු — රුධිරය කැටි ගැසීම","සුදු රුධිරාණු — ඔක්සිජන් ප්‍රවාහනය","පට්ටිකා — ප්‍රතිදේහ නිපදවීම","ප්ලාස්මාව — ජීර්ණ ආහාර සහ හෝමෝන ප්‍රවාහනය"],"රතු රුධිරාණු O₂ ගෙන යයි, සුදු රුධිරාණු ආරක්ෂාව සපයයි, පට්ටිකා කැටි ගැසීමට උදව් වේ. ප්ලාස්මාව ජීර්ණ ආහාර, හෝමෝන, CO₂ ගෙන යයි."],["Which option correctly matches a blood component with its function?",["red blood cells — clotting","white blood cells — carrying oxygen","platelets — making antibodies","plasma — carrying digested food and hormones"],"Red cells carry O₂, white cells defend the body, platelets help clotting. Plasma carries digested food, hormones and CO₂."],"2019 Q6"],["CIRC",2,["මිනිස් රුධිර සංසරණය පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["සියලුම ධමනි ඔක්සිජන් සහිත රුධිරය ගෙන යයි","සියලුම ශිරා ඔක්සිජන් අඩු රුධිරය ගෙන යයි","ධමනි හෘදයෙන් ඉවතට රුධිරය ගෙන යයි","රුධිරය එක් වටයකදී හෘදය හරහා එක් වරක් පමණක් යයි"],"ධමනි හෘදයෙන් ඉවතට, ශිරා හෘදය වෙතට රුධිරය ගෙන යයි. පුප්ඵුසීය ධමනිය සහ ශිරාව \"සියල්ලම\" යන ප්‍රකාශ ව්‍යතිරේක කරයි. සංසරණය ද්විත්වයි."],["Which statement about human blood circulation is true?",["all arteries carry oxygenated blood","all veins carry deoxygenated blood","arteries carry blood away from the heart","blood passes through the heart once in each circuit"],"Arteries carry blood away from the heart and veins towards it. The pulmonary artery and vein are exceptions to the \"all\" statements. Circulation is double."],"2021 Q20"],["CIRC",2,["පට්ටිකා (platelets) ප්‍රමාණය සාමාන්‍ය අගයට වඩා බෙහෙවින් අඩු වූ විට වැඩි වශයෙන් ඇති විය හැක්කේ කුමක්ද?",["ඔක්සිජන් ප්‍රවාහනය අඩු වීම","ප්‍රතිශක්තිය වැඩි වීම","තුවාලයකින් රුධිරය ගැලීම නතර නොවීම","රුධිර පීඩනය ඉහළ යාම"],"පට්ටිකා රුධිරය කැටි ගැසීමට උදව් වේ. ඒවා අඩු වූ විට (උදා. ඩෙංගු රෝගයේදී) රුධිර වහනය ඇති විය හැක."],["If the platelet count falls far below normal, what is most likely?",["less oxygen is carried","immunity increases","bleeding from a wound does not stop","blood pressure rises"],"Platelets help blood clot. When they are low (e.g. in dengue), bleeding can occur."],"2023 Q30"],["CIRC",1,["පෙනහළුවල සිට ඔක්සිජන් සහිත රුධිරය හෘදයට ලැබෙන කුටීරය කුමක්ද?",["දකුණු කර්ණිකාව","වම් කර්ණිකාව","දකුණු කෝෂිකාව","වම් කෝෂිකාව"],"පුප්ඵුසීය ශිරාව ඔක්සිජන් සහිත රුධිරය වම් කර්ණිකාවට ගෙන එයි. ඉන්පසු එය වම් කෝෂිකාවෙන් මුළු සිරුරටම පොම්ප වේ."],["Which chamber of the heart receives oxygenated blood from the lungs?",["right atrium","left atrium","right ventricle","left ventricle"],"The pulmonary vein brings oxygenated blood to the left atrium. It then passes to the left ventricle, which pumps it to the body."],"2024 Q16"],["COORD",0,["ශරීරයේ සමබරතාව පවත්වා ගැනීම සහ චලන සමායෝජනය කරන මොළයේ කොටස කුමක්ද?",["අනුමස්තිෂ්කය (cerebellum)","මහා මස්තිෂ්කය (cerebrum)","සුෂුම්නා ශීර්ෂකය (medulla)","හයිපොතැලමසය"],"අනුමස්තිෂ්කය මාංශ පේශි චලන සමායෝජනය කර සමබරතාව පවත්වයි. එයට හානි වූ විට ඇවිදීමේ අපහසුතා ඇති වේ."],["Which part of the brain maintains balance and coordinates movement?",["cerebellum","cerebrum","medulla oblongata","hypothalamus"],"The cerebellum coordinates muscle movements and keeps balance. Damage to it causes difficulty in walking."],"2019 Q9"],["COORD",3,["තයිරොක්සින් හෝමෝනය නිපදවීමට අත්‍යවශ්‍ය ඛනිජය කුමක්ද? එහි ඌනතාවයෙන් ඇති වන්නේ කුමක්ද?",["යකඩ — රක්තහීනතාව","කැල්සියම් — රිකට්ස්","සෝඩියම් — පේශි පෙරළීම","අයඩින් — ගලගණ්ඩය (goitre)"],"තයිරොයිඩ් ග්‍රන්ථියට තයිරොක්සින් සෑදීමට අයඩින් අවශ්‍යයි. අයඩින් ඌනතාවයෙන් ගලගණ්ඩය ඇති වන නිසා අයඩින් මිශ්‍ර ලුණු භාවිත කරයි."],["Which mineral is essential for making the hormone thyroxine, and what does its deficiency cause?",["iron — anaemia","calcium — rickets","sodium — muscle cramps","iodine — goitre"],"The thyroid gland needs iodine to make thyroxine. Iodine deficiency causes goitre, which is why iodized salt is used."],"2021 Q10"],["COORD",1,["අපේ කැමැත්ත අනුව සිදු කරන ක්‍රියා, සිතීම, මතකය සහ බුද්ධිය පාලනය කරන මොළයේ කොටස කුමක්ද?",["අනුමස්තිෂ්කය","මහා මස්තිෂ්කය","සුෂුම්නා ශීර්ෂකය","සුෂුම්නාව"],"මහා මස්තිෂ්කය මොළයේ විශාලතම කොටසයි. ස්වේච්ඡා ක්‍රියා, සංවේදන, මතකය, සිතීම පාලනය කරයි."],["Which part of the brain controls voluntary actions, thinking, memory and intelligence?",["cerebellum","cerebrum","medulla oblongata","spinal cord"],"The cerebrum is the largest part of the brain. It controls voluntary actions, senses, memory and thinking."],"2021 Q26"],["COORD",0,["හදිසි අවස්ථාවකදී හෘද ස්පන්දන වේගය සහ රුධිරයේ ග්ලූකෝස් මට්ටම වැඩි කරන හෝමෝනය කුමක්ද?",["ඇඩ්‍රිනලින්","ඉන්සියුලින්","තයිරොක්සින්","වර්ධක හෝමෝනය"],"ඇඩ්‍රිනල් ග්‍රන්ථියෙන් ස්‍රාවය වන ඇඩ්‍රිනලින් \"සටන් හෝ පලා යාම\" (fight or flight) ප්‍රතිචාරය ඇති කරයි."],["Which hormone increases heart rate and blood glucose in an emergency?",["adrenaline","insulin","thyroxine","growth hormone"],"Adrenaline, released by the adrenal glands, causes the \"fight or flight\" response."],"2022 Q22"],["COORD",3,["හෘද ස්පන්දනය, ශ්වසනය සහ ගිලීම වැනි අනිච්ඡානුගත ක්‍රියා පාලනය කරන මොළයේ කොටස කුමක්ද?",["මහා මස්තිෂ්කය","අනුමස්තිෂ්කය","හයිපොතැලමසය","සුෂුම්නා ශීර්ෂකය (medulla oblongata)"],"සුෂුම්නා ශීර්ෂකය හෘද ස්පන්දනය, ශ්වසන වේගය, ගිලීම, කැස්ස, වමනය වැනි ජීවිතයට අත්‍යවශ්‍ය අනිච්ඡා ක්‍රියා පාලනය කරයි."],["Which part of the brain controls involuntary actions such as heartbeat, breathing and swallowing?",["cerebrum","cerebellum","hypothalamus","medulla oblongata"],"The medulla oblongata controls vital involuntary actions such as heartbeat, breathing rate, swallowing, coughing and vomiting."],"2023 Q21"],["COORD",1,["අනතුරකින් පසු පුද්ගලයෙකුගේ ශ්වසනය අක්‍රමවත් වී හෘද ස්පන්දනය වෙනස් විය. හානි වී ඇති බවට වැඩිම ඉඩක් ඇති මොළයේ කොටස කුමක්ද?",["අනුමස්තිෂ්කය","සුෂුම්නා ශීර්ෂකය","මහා මස්තිෂ්කයේ වම් අර්ධය","මහා මස්තිෂ්කයේ දකුණු අර්ධය"],"ශ්වසනය සහ හෘද ස්පන්දනය පාලනය කරන්නේ සුෂුම්නා ශීර්ෂකය (මොළ කඳ) යි."],["After an accident, a person's breathing became irregular and their heartbeat changed. Which part of the brain is most likely damaged?",["cerebellum","medulla oblongata","left cerebral hemisphere","right cerebral hemisphere"],"Breathing and heartbeat are controlled by the medulla oblongata (brain stem)."],"2025 Q30"],["ELECCHEM",0,["යකඩ නළයක් විඛාදනයෙන් ආරක්ෂා කිරීමට එයට Mg කුට්ටියක් සම්බන්ධ කරයි. එහිදී සිදු වන්නේ කුමක්ද?",["Mg ඔක්සිකරණය වී (Mg → Mg²⁺ + 2e⁻) යකඩ ආරක්ෂා කරයි","යකඩ ඔක්සිකරණය වේ","Mg ඔක්සිහරණය වේ","යකඩ මත Mg ආලේප වේ"],"Mg යකඩට වඩා සක්‍රිය නිසා ඇනෝඩය ලෙස ක්‍රියා කර පළමුව විඛාදනය වේ. මෙය පූජනීය ඇනෝඩ (sacrificial anode) ආරක්ෂණයයි."],["A block of Mg is connected to an iron pipe to protect it from corrosion. What happens?",["Mg is oxidized (Mg → Mg²⁺ + 2e⁻) and protects the iron","the iron is oxidized","Mg is reduced","Mg is coated onto the iron"],"Mg is more reactive than iron, so it acts as the anode and corrodes first. This is sacrificial protection."],"2020 Q36"],["ELECCHEM",1,["යකඩ හැන්දකට තඹ ආලේප කිරීමේදී (electroplating) නිවැරදි සැකසුම කුමක්ද?",["හැන්ද ඇනෝඩය, තඹ තහඩුව කැතෝඩය","හැන්ද කැතෝඩය, තඹ තහඩුව ඇනෝඩය, CuSO₄ ද්‍රාවණය","හැන්ද සහ තඹ දෙකම කැතෝඩ","හැන්ද කැතෝඩය, ZnSO₄ ද්‍රාවණය"],"ආලේප කළ යුතු වස්තුව කැතෝඩය (−) වේ. ආලේප ලෝහය (Cu) ඇනෝඩය වන අතර එම ලෝහයේ අයන (Cu²⁺) ඇති ද්‍රාවණයක් භාවිත කරයි."],["What is the correct set-up for copper-plating an iron spoon?",["spoon as anode, copper plate as cathode","spoon as cathode, copper plate as anode, CuSO₄ solution","both spoon and copper as cathodes","spoon as cathode, ZnSO₄ solution"],"The object to be plated is the cathode (−). The plating metal (Cu) is the anode, and the solution contains its ions (Cu²⁺)."],"2021 Q34"],["ELECCHEM",2,["යකඩ මල බැඳීමට (rusting) අවශ්‍ය සාධක මොනවාද?",["ජලය පමණි","ඔක්සිජන් පමණි","ජලය සහ ඔක්සිජන් දෙකම","CO₂ පමණි"],"යකඩ මල බැඳීමට ජලය සහ ඔක්සිජන් දෙකම අවශ්‍යයි. ලුණු (මුහුදු ජලය) මල බැඳීම වේගවත් කරයි."],["What is needed for iron to rust?",["water only","oxygen only","both water and oxygen","CO₂ only"],"Rusting needs both water and oxygen. Salt (sea water) speeds it up."],"2022 Q33"],["ELECCHEM",1,["Zn සහ Cu ඉලෙක්ට්‍රෝඩ ඇති සරල කෝෂයක බාහිර කම්බිය හරහා ඉලෙක්ට්‍රෝන ගලන්නේ කුමන දිශාවටද?",["Cu සිට Zn දෙසට","Zn සිට Cu දෙසට","දෙපැත්තටම","ඉලෙක්ට්‍රෝන නොගලයි"],"Zn වඩා සක්‍රිය නිසා ඔක්සිකරණය වී ඉලෙක්ට්‍රෝන නිදහස් කරයි. ඒවා කම්බිය හරහා Cu වෙත ගලයි. සම්මත ධාරාව Cu සිට Zn දෙසටයි."],["In a simple cell with Zn and Cu electrodes, which way do electrons flow through the external wire?",["from Cu to Zn","from Zn to Cu","both ways","no electrons flow"],"Zn is more reactive, so it is oxidized and releases electrons, which flow through the wire to Cu. Conventional current flows from Cu to Zn."],"2023 Q12"],["ELECCHEM",2,["තනුක H₂SO₄ ඇති Zn–Cu සරල කෝෂයේ කැතෝඩයේ (Cu) සිදු වන ප්‍රතික්‍රියාව කුමක්ද?",["Zn → Zn²⁺ + 2e⁻","Cu → Cu²⁺ + 2e⁻","2H⁺ + 2e⁻ → H₂","Zn²⁺ + 2e⁻ → Zn"],"කැතෝඩයේදී ඉලෙක්ට්‍රෝන ලබා ගැනීම (ඔක්සිහරණය) සිදු වේ. ද්‍රාවණයේ H⁺ අයන ඉලෙක්ට්‍රෝන ලබා H₂ වායුව සාදයි."],["In a Zn–Cu simple cell with dilute H₂SO₄, what reaction happens at the cathode (Cu)?",["Zn → Zn²⁺ + 2e⁻","Cu → Cu²⁺ + 2e⁻","2H⁺ + 2e⁻ → H₂","Zn²⁺ + 2e⁻ → Zn"],"At the cathode, electrons are gained (reduction). H⁺ ions from the solution gain electrons and form H₂ gas."],"2023 Q13"],["ELECCHEM",3,["යකඩ ගැල්වනයිස් (galvanize) කිරීම සඳහා ආලේප කරන ලෝහය කුමක්ද?",["Sn (ටින්)","Cu","Ag","Zn"],"ගැල්වනයිස් කිරීම යනු යකඩ මත Zn ආලේප කිරීමයි. ආලේපය සීරුණත් Zn වඩා සක්‍රිය නිසා යකඩ ආරක්ෂා වේ."],["Which metal is coated onto iron when it is galvanized?",["Sn (tin)","Cu","Ag","Zn"],"Galvanizing means coating iron with Zn. Even if scratched, Zn is more reactive, so it still protects the iron."],"2024 Q32"],["ELECCHEM",0,["ටින් (Sn) ආලේප කළ යකඩ කෑනයක ආලේපය සීරුණු විට කුමක් සිදු වේද?",["යකඩ, Sn ට වඩා සක්‍රිය නිසා යකඩ වේගයෙන් මල බඳී","Sn වේගයෙන් විඛාදනය වී යකඩ ආරක්ෂා කරයි","කිසිදු වෙනසක් නැත","යකඩ මත Zn තැන්පත් වේ"],"Sn යකඩට වඩා අඩු සක්‍රියයි. සීරීමෙන් යකඩ නිරාවරණය වූ විට යකඩ ඇනෝඩය වී වේගයෙන් මල බඳී. Zn ආලේපයක (ගැල්වනයිස්) මෙය සිදු නොවේ."],["What happens when the tin (Sn) coating on an iron can is scratched?",["iron is more reactive than Sn, so the iron rusts quickly","Sn corrodes quickly and protects the iron","nothing changes","Zn is deposited on the iron"],"Sn is less reactive than iron. Once iron is exposed, it becomes the anode and rusts fast. This does not happen with a zinc (galvanized) coating."],"2025 Q33"],["ELECCHEM",0,["පහත සරල කෝෂ අතරින් බාහිර පරිපථයේ විශාලතම වෝල්ටීයතාව ලබා දෙන්නේ කුමකින්ද?",["Mg – Cu","Zn – Cu","Fe – Cu","Cu – Cu"],"ලෝහ දෙක සක්‍රියතා ශ්‍රේණියේ එකිනෙකට දුරින් ඇති තරමට වෝල්ටීයතාව වැඩිය. Mg සහ Cu අතර දුර වැඩිම වේ. Cu – Cu හි විභව අන්තරයක් නැත."],["Which simple cell gives the largest voltage in the external circuit?",["Mg – Cu","Zn – Cu","Fe – Cu","Cu – Cu"],"The further apart two metals are in the activity series, the larger the voltage. Mg and Cu are furthest apart. Cu – Cu gives no potential difference."],"2025 Q36"],["ELTRON",3,["ප්‍රත්‍යාවර්ත ධාරාවක් (AC) ඩයෝඩයක් හරහා යැවූ පසු ප්‍රතිදානය සුමට කිරීමට (smoothing) භාවිත කරන උපාංගය කුමක්ද?",["ප්‍රතිරෝධකය","ට්‍රාන්සිස්ටරය","LED","ධාරිත්‍රකය (capacitor)"],"ඩයෝඩය ධාරාව එක් දිශාවකට පමණක් ගලන්නට ඉඩ දෙයි (සෘජුකරණය). ධාරිත්‍රකය ආරෝපණය ගබඩා කර නිදහස් කරමින් ප්‍රතිදානය සුමට කරයි."],["After AC is rectified by a diode, which component is used to smooth the output?",["resistor","transistor","LED","capacitor"],"The diode lets current flow one way only (rectification). A capacitor stores and releases charge to smooth the output."],"2018 Q15"],["ELTRON",3,["ට්‍රාන්සිස්ටරයක අග්‍ර තුනේ නම් මොනවාද?",["ඇනෝඩය, කැතෝඩය, ද්වාරය","ධන, සෘණ, භූගත","ප්‍රදාන, ප්‍රතිදාන, පාලක","විමෝචකය, පාදම, සංග්‍රාහකය"],"ට්‍රාන්සිස්ටරයට විමෝචකය (emitter), පාදම (base) සහ සංග්‍රාහකය (collector) යන අග්‍ර ඇත. එය ස්විචයක් හෝ වර්ධකයක් ලෙස භාවිත කරයි."],["What are the three terminals of a transistor?",["anode, cathode, gate","positive, negative, earth","input, output, control","emitter, base, collector"],"A transistor has an emitter, a base and a collector. It is used as a switch or an amplifier."],"2018 Q4"],["ELTRON",0,["බැටරිය වැරදි දිශාවට සම්බන්ධ කළහොත් ඉලෙක්ට්‍රොනික උපකරණයකට හානි නොවීමට ශ්‍රේණිගතව සම්බන්ධ කරන උපාංගය කුමක්ද?",["ඩයෝඩය","ප්‍රතිරෝධකය","ධාරිත්‍රකය","ට්‍රාන්සිස්ටරය"],"ඩයෝඩය පෙර නැඹුරු (forward bias) වූ විට පමණක් ධාරාව ගලයි. බැටරිය වැරදියට සම්බන්ධ කළ විට පසු නැඹුරු වී ධාරාව නවත්වයි."],["Which component, connected in series, protects an electronic device if the battery is connected the wrong way round?",["diode","resistor","capacitor","transistor"],"A diode conducts only when forward biased. If the battery is reversed, it is reverse biased and blocks the current."],"2019 Q20"],["ELTRON",0,["npn ට්‍රාන්සිස්ටරයක පාදම (base) සෑදී ඇත්තේ කුමන වර්ගයේ අර්ධ සන්නායකයකින්ද?",["p වර්ගය","n වර්ගය","නෛසර්ගික Si","ලෝහයක්"],"npn හි මැද ස්තරය (පාදම) p වර්ගය වන අතර විමෝචකය සහ සංග්‍රාහකය n වර්ගයයි. pnp හි පාදම n වර්ගයයි."],["In an npn transistor, what type of semiconductor is the base made of?",["p-type","n-type","intrinsic Si","a metal"],"In npn, the middle layer (base) is p-type and the emitter and collector are n-type. In pnp, the base is n-type."],"2021 Q32"],["ELTRON",2,["බල්බයක් සමඟ ශ්‍රේණිගතව ඩයෝඩයක් සම්බන්ධ කර ඇත. ඩයෝඩය පසු නැඹුරු (reverse bias) වී ඇත්නම් කුමක් සිදු වේද?",["බල්බය දීප්තිමත්ව දැල්වේ","බල්බය අඳුරුව දැල්වේ","බල්බය නොදැල්වේ","බල්බය නිවී නිවී දැල්වේ"],"පසු නැඹුරු ඩයෝඩයක් හරහා (ප්‍රායෝගිකව) ධාරාවක් නොගලයි. ඒ නිසා ශ්‍රේණිගත බල්බය දැල්වෙන්නේ නැත."],["A diode is in series with a bulb. If the diode is reverse biased, what happens?",["the bulb lights brightly","the bulb lights dimly","the bulb does not light","the bulb flickers"],"Practically no current flows through a reverse-biased diode, so the bulb in series does not light."],"2024 Q28"],["ELTRON",2,["p-n සන්ධියක් පෙර නැඹුරු (forward bias) කිරීම යනු කුමක්ද?",["p පැත්ත බැටරියේ සෘණ අග්‍රයට සම්බන්ධ කිරීම","දෙපැත්තම ධන අග්‍රයට සම්බන්ධ කිරීම","p පැත්ත ධන අග්‍රයට සහ n පැත්ත සෘණ අග්‍රයට සම්බන්ධ කිරීම","සන්ධිය රත් කිරීම"],"පෙර නැඹුරු කළ විට ක්ෂය කලාපය (depletion region) පටු වී විභව බාධකය අඩු වන නිසා ධාරාව පහසුවෙන් ගලයි."],["What does forward biasing a p-n junction mean?",["connecting the p side to the negative terminal","connecting both sides to the positive terminal","connecting the p side to the positive terminal and the n side to the negative","heating the junction"],"When forward biased, the depletion region narrows and the potential barrier falls, so current flows easily."],"2025 Q21"],["EMAG",3,["පහත උපකරණ අතරින් විද්‍යුත් චුම්බක ප්‍රේරණය මත ක්‍රියා කරන්නේ කුමක්ද?",["විදුලි සීනුව","DC මෝටරය","විදුලි උදුන","ඩයිනමෝව (බයිසිකල් ඩයිනමෝව)"],"ඩයිනමෝවේ චුම්බකයක් දඟරයක් තුළ භ්‍රමණය වන විට දඟරයේ වෝල්ටීයතාවක් ප්‍රේරණය වේ. මෝටරය සහ සීනුව ධාරාවේ චුම්බක ආචරණය භාවිත කරයි."],["Which of these devices works by electromagnetic induction?",["electric bell","DC motor","electric cooker","dynamo (bicycle dynamo)"],"In a dynamo a magnet turns inside a coil, inducing a voltage. Motors and bells use the magnetic effect of a current."],"2018 Q8"],["EMAG",1,["පරිණාමකයක ප්‍රාථමික දඟරයේ වට 500ක් සහ ද්විතීයික දඟරයේ වට 50ක් ඇත. ප්‍රාථමිකයට 230 V සපයන විට ද්විතීයික වෝල්ටීයතාව කීයද?",["2300 V","23 V","46 V","11.5 V"],"Vs/Vp = Ns/Np. Vs = 230 × 50 ÷ 500 = 23 V. මෙය අවකර (step-down) පරිණාමකයකි."],["A transformer has 500 turns on the primary and 50 on the secondary. If the primary is supplied with 230 V, what is the secondary voltage?",["2300 V","23 V","46 V","11.5 V"],"Vs/Vp = Ns/Np. Vs = 230 × 50 ÷ 500 = 23 V. This is a step-down transformer."],"2019 Q24"],["EMAG",3,["චුම්බක ක්ෂේත්‍රයක ඇති ධාරා ගෙන යන සන්නායකයක් මත බලයක් ඇති වීම (මෝටර ආචරණය) භාවිත කරන උපකරණය කුමක්ද?",["පරිණාමකය","ඩයිනමෝව","මයික්‍රොෆෝනය","ශබ්ද විකාශකය (loudspeaker)"],"ශබ්ද විකාශකයේ දඟරය හරහා ධාරාව ගලන විට චුම්බකය නිසා බලයක් ඇති වී කේතුව කම්පනය වේ. ඩයිනමෝව සහ මයික්‍රොෆෝනය ප්‍රේරණය භාවිත කරයි."],["Which device uses the force on a current-carrying conductor in a magnetic field (the motor effect)?",["transformer","dynamo","microphone","loudspeaker"],"Current in the loudspeaker coil feels a force from the magnet, making the cone vibrate. Dynamos and microphones use induction."],"2019 Q28"],["EMAG",2,["චුම්බක ක්ෂේත්‍රයක ඇති ධාරා ගෙන යන සන්නායකයක් මත බලයේ දිශාව සොයා ගැනීමට භාවිත කරන නීතිය කුමක්ද?",["ෆ්ලෙමින්ගේ දකුණත් නීතිය","මැක්ස්වෙල්ගේ කෝක්ස්ක්‍රූ නීතිය","ෆ්ලෙමින්ගේ වමත් නීතිය","ඕම් නියමය"],"වමත් නීතිය = මෝටර ආචරණය (බලය). දකුණත් නීතිය = ප්‍රේරිත ධාරාවේ දිශාව. කෝක්ස්ක්‍රූ නීතිය = ධාරාවක් වටා ක්ෂේත්‍රයේ දිශාව."],["Which rule gives the direction of the force on a current-carrying conductor in a magnetic field?",["Fleming's right-hand rule","Maxwell's corkscrew rule","Fleming's left-hand rule","Ohm's law"],"Left-hand rule = motor effect (force). Right-hand rule = direction of induced current. Corkscrew rule = direction of the field around a current."],"2020 Q33"],["EMAG",1,["දඟරයකට චුම්බකයක් ඇතුළු කරන විට ගැල්වනෝමීටරය උත්ක්‍රමණය වේ. චුම්බකය දඟරය තුළ නිශ්චලව තබා ඇති විට කුමක් සිදු වේද?",["උත්ක්‍රමණය වැඩි වේ","උත්ක්‍රමණයක් නැත","ප්‍රතිවිරුද්ධ දිශාවට උත්ක්‍රමණය වේ","උත්ක්‍රමණය නියතව පවතී"],"වෝල්ටීයතාවක් ප්‍රේරණය වන්නේ චුම්බක ක්ෂේත්‍රය වෙනස් වන විට පමණි. චුම්බකය නිශ්චල නම් ක්ෂේත්‍රය වෙනස් නොවන නිසා ධාරාවක් නැත."],["A galvanometer deflects as a magnet is pushed into a coil. What happens when the magnet is held still inside the coil?",["the deflection increases","there is no deflection","it deflects the other way","the deflection stays steady"],"A voltage is induced only while the magnetic field is changing. A stationary magnet does not change the field, so there is no current."],"2020 Q38"],["EMAG",0,["පරිණාමකයක ප්‍රාථමික සහ ද්විතීයික වෝල්ටීයතා (Vp, Vs) සහ වට ගණන් (Np, Ns) අතර සම්බන්ධතාවය කුමක්ද?",["Vp/Vs = Np/Ns","Vp/Vs = Ns/Np","Vp × Vs = Np × Ns","Vp + Vs = Np + Ns"],"වෝල්ටීයතා අනුපාතය වට අනුපාතයට සමානයි: Vp/Vs = Np/Ns."],["What is the relationship between the primary and secondary voltages (Vp, Vs) and turns (Np, Ns) of a transformer?",["Vp/Vs = Np/Ns","Vp/Vs = Ns/Np","Vp × Vs = Np × Ns","Vp + Vs = Np + Ns"],"The voltage ratio equals the turns ratio: Vp/Vs = Np/Ns."],"2021 Q36"],["EMAG",3,["පරිපූර්ණ පරිණාමකයක ප්‍රාථමිකය 240 V, 0.5 A වේ. ද්විතීයික වෝල්ටීයතාව 12 V නම් ද්විතීයික ධාරාව කීයද?",["0.025 A","0.5 A","5 A","10 A"],"පරිපූර්ණ පරිණාමකයක ජවය සමානයි: VpIp = VsIs. 240 × 0.5 = 120 W. Is = 120 ÷ 12 = 10 A."],["An ideal transformer has 240 V, 0.5 A in the primary. If the secondary voltage is 12 V, what is the secondary current?",["0.025 A","0.5 A","5 A","10 A"],"In an ideal transformer power is equal: VpIp = VsIs. 240 × 0.5 = 120 W. Is = 120 ÷ 12 = 10 A."],"2022 Q24"],["EMAG",3,["යකඩ හරයක් වටා ඔතා ඇති දඟර දෙකකින් පළමු දඟරයේ ස්විචය වැසූ හෝ විවෘත කළ මොහොතේ පමණක් දෙවන දඟරයට සම්බන්ධ ගැල්වනෝමීටරය උත්ක්‍රමණය වේ. මෙය හඳුන්වන්නේ කුමක් ලෙසද?",["ස්වයං ප්‍රේරණය","මෝටර ආචරණය","තාප ආචරණය","අන්‍යෝන්‍ය ප්‍රේරණය (mutual induction)"],"පළමු දඟරයේ ධාරාව වෙනස් වන මොහොතේ පමණක් ක්ෂේත්‍රය වෙනස් වී දෙවන දඟරයේ වෝල්ටීයතාවක් ප්‍රේරණය වේ. පරිණාමක ක්‍රියා කරන්නේ මෙලෙසයි."],["Two coils are wound on an iron core. A galvanometer on the second coil deflects only at the moment the first coil's switch is closed or opened. This is called",["self-induction","the motor effect","the heating effect","mutual induction"],"Only while the current in the first coil changes does its field change, inducing a voltage in the second coil. Transformers work this way."],"2023 Q35"],["EMAG",0,["විදුලිය ඉතා ඉහළ වෝල්ටීයතාවයකින් දිගු දුර සම්ප්‍රේෂණය කරන්නේ ඇයි?",["ධාරාව අඩු වී කම්බිවල තාපයෙන් වන ශක්ති හානිය අඩු වන නිසා","කම්බිවල ප්‍රතිරෝධය වැඩි කිරීමට","ධාරාව වැඩි කිරීමට","නිවෙස්වලට ඉහළ වෝල්ටීයතාවක් ලබා දීමට"],"එකම ජවය (P = VI) ඉහළ V වලින් යවන විට I අඩුය. තාප හානිය I²R නිසා එය බෙහෙවින් අඩු වේ. නිවෙස් අසල අවකර පරිණාමක මගින් 230 V දක්වා අඩු කරයි."],["Why is electricity transmitted over long distances at very high voltage?",["the current is smaller, so less energy is lost as heat in the cables","to increase the resistance of the cables","to increase the current","to supply homes with high voltage"],"For the same power (P = VI), a high V means a small I. Heat loss is I²R, so it falls greatly. Step-down transformers reduce it to 230 V near homes."],"2024 Q15"],["EMAG",2,["පරිපූර්ණ පරිණාමකයක ප්‍රාථමික දඟරයට 230 V සැපයුමකින් 460 W ජවයක් ලැබේ. ප්‍රාථමික ධාරාව කීයද?",["0.5 A","1 A","2 A","4 A"],"P = VI. I = 460 ÷ 230 = 2 A."],["The primary coil of an ideal transformer takes 460 W from a 230 V supply. What is the primary current?",["0.5 A","1 A","2 A","4 A"],"P = VI. I = 460 ÷ 230 = 2 A."],"2025 Q12"],["EMAG",0,["ධාරාවක් ගෙන යන සෘජු සන්නායකයක් වටා චුම්බක ක්ෂේත්‍රයේ දිශාව සොයා ගැනීමට භාවිත කරන නීති යුගලය කුමක්ද?",["මැක්ස්වෙල්ගේ කෝක්ස්ක්‍රූ නීතිය සහ දකුණත් ග්‍රහණ නීතිය","ෆ්ලෙමින්ගේ වමත් සහ දකුණත් නීති","ෆ්ලෙමින්ගේ වමත් නීතිය සහ ඕම් නියමය","ෆ්ලෙමින්ගේ දකුණත් නීතිය සහ ලෙන්ස් නියමය"],"කෝක්ස්ක්‍රූ නීතිය සහ දකුණත් ග්‍රහණ නීතිය (මාපටැඟිල්ල ධාරාවේ දිශාවට, ඇඟිලි ක්ෂේත්‍රයේ දිශාවට) දෙකම ධාරාවක් වටා ක්ෂේත්‍රය දෙයි."],["Which pair of rules gives the direction of the magnetic field around a straight current-carrying conductor?",["Maxwell's corkscrew rule and the right-hand grip rule","Fleming's left- and right-hand rules","Fleming's left-hand rule and Ohm's law","Fleming's right-hand rule and Lenz's law"],"The corkscrew rule and the right-hand grip rule (thumb along the current, fingers show the field) both give the field around a current."],"2025 Q16"],["EXCR",2,["වකුගඩුවේ ග්ලෝමරුලසයේදී රුධිරයෙන් පෙරී නොයන්නේ කුමක්ද?",["ජලය","ග්ලූකෝස්","රතු රුධිරාණු සහ විශාල ප්‍රෝටීන","යූරියා"],"ග්ලෝමරුලසයේ පෙරීමේදී කුඩා අණු (ජලය, ග්ලූකෝස්, ලවණ, යූරියා) පෙරී යයි. රුධිරාණු සහ විශාල ප්‍රෝටීන රුධිරයේ ඉතිරි වේ."],["In the glomerulus of the kidney, what is NOT filtered out of the blood?",["water","glucose","red blood cells and large proteins","urea"],"Small molecules (water, glucose, salts, urea) are filtered. Blood cells and large proteins stay in the blood."],"2018 Q6"],["EXCR",0,["නිරෝගී පුද්ගලයෙකුගේ මුත්‍රාවල සාමාන්‍යයෙන් අඩංගු නොවන්නේ කුමක්ද?",["ග්ලූකෝස්","ජලය","යූරියා","ලවණ"],"ග්ලූකෝස් පෙරී ගියද වෘක්කාණු නාලිකාවලදී සම්පූර්ණයෙන්ම නැවත අවශෝෂණය වේ. මුත්‍රාවල ග්ලූකෝස් තිබීම දියවැඩියාවේ ලක්ෂණයකි."],["What is normally absent from the urine of a healthy person?",["glucose","water","urea","salts"],"Glucose is filtered but fully reabsorbed in the tubules. Glucose in urine is a sign of diabetes."],"2019 Q26"],["EXCR",0,["ග්ලෝමරුලස පෙරනයේ ඇති නමුත් සාමාන්‍ය මුත්‍රාවල නොමැති ද්‍රව්‍ය යුගලය කුමක්ද?",["ග්ලූකෝස් සහ ඇමයිනෝ අම්ල","යූරියා සහ ජලය","ලවණ සහ ජලය","යූරියා සහ ලවණ"],"ග්ලූකෝස් සහ ඇමයිනෝ අම්ල ප්‍රයෝජනවත් නිසා නාලිකාවලදී නැවත රුධිරයට අවශෝෂණය වේ."],["Which pair of substances is in the glomerular filtrate but not in normal urine?",["glucose and amino acids","urea and water","salts and water","urea and salts"],"Glucose and amino acids are useful, so they are reabsorbed into the blood in the tubules."],"2021 Q18"],["EXCR",3,["සිරුරේ ජලය, ලවණ සහ උෂ්ණත්වය නියතව තබා ගැනීමට (සමස්ථිතිය) දායක වන ඉන්ද්‍රිය යුගලය කුමක්ද?",["හෘදය සහ ආමාශය","මොළය සහ මුත්‍රාශය","ආමාශය සහ සම","වකුගඩු සහ සම"],"වකුගඩු ජලය සහ ලවණ පාලනය කරයි. සම දහඩිය සහ රුධිර වාහිනී මගින් උෂ්ණත්වය පාලනය කරයි."],["Which pair of organs helps keep the body's water, salts and temperature constant (homeostasis)?",["heart and stomach","brain and bladder","stomach and skin","kidneys and skin"],"The kidneys control water and salts. The skin controls temperature through sweat and blood vessels."],"2021 Q22"],["EXCR",0,["වකුගඩුවේ ව්‍යුහමය හා කෘත්‍යමය ඒකකය කුමක්ද?",["වෘක්කාණුව (nephron)","ග්ලෝමරුලසය","මුත්‍රවාහිනිය","මුත්‍රාශය"],"එක් වකුගඩුවක වෘක්කාණු මිලියනයක් පමණ ඇත. පෙරීම, නැවත අවශෝෂණය සහ ස්‍රාවය සිදු වන්නේ වෘක්කාණුවේදීය."],["What is the structural and functional unit of the kidney?",["nephron","glomerulus","ureter","bladder"],"Each kidney has about a million nephrons. Filtration, reabsorption and secretion happen in the nephron."],"2022 Q1"],["EXCR",1,["යූරියා නිපදවන්නේ සිරුරේ කුමන ඉන්ද්‍රියයේද?",["වකුගඩුව","අක්මාව","පෙනහළු","සම"],"අතිරික්ත ඇමයිනෝ අම්ල අක්මාවේදී බිඳී යූරියා සාදයි. වකුගඩු යූරියා රුධිරයෙන් ඉවත් කර මුත්‍රා ලෙස බැහැර කරයි."],["In which organ is urea made?",["kidney","liver","lungs","skin"],"Excess amino acids are broken down in the liver to form urea. The kidneys remove it from the blood in urine."],"2023 Q1"],["GEN",0,["විෂමයුග්මක (Rr) රතු මල් ඇති ශාක දෙකක් ගුණනය කළ විට (R රතු ප්‍රමුඛ, r සුදු නිලීන) ලැබෙන රූපාණු දර්ශ අනුපාතය කුමක්ද?",["රතු 3 : සුදු 1","රතු 1 : සුදු 1","රතු 1 : සුදු 3","සියල්ල රතු"],"Rr × Rr → RR, Rr, Rr, rr. R ඇති තුනම රතු, rr එක සුදු. 3 : 1."],["Two heterozygous red-flowered plants (Rr) are crossed (R red is dominant, r white is recessive). What is the phenotype ratio?",["3 red : 1 white","1 red : 1 white","1 red : 3 white","all red"],"Rr × Rr → RR, Rr, Rr, rr. The three with R are red; rr is white. 3 : 1."],"2018 Q16"],["GEN",2,["Tt × Tt ගුණනයේදී ලැබෙන ප්‍රවේණි දර්ශ අනුපාතය (TT : Tt : tt) කුමක්ද?",["3 : 1 : 0","1 : 1 : 1","1 : 2 : 1","2 : 1 : 1"],"Punnett කොටුව: TT 1, Tt 2, tt 1."],["What is the genotype ratio (TT : Tt : tt) from the cross Tt × Tt?",["3 : 1 : 0","1 : 1 : 1","1 : 2 : 1","2 : 1 : 1"],"Punnett square: TT 1, Tt 2, tt 1."],"2020 Q10"],["GEN",3,["තැලසීමියාව පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["එය බෝවන රෝගයකි","එය ලිංග-ප්‍රතිබද්ධ රෝගයකි","එය විටමින් ඌනතාවයකි","එය හිමොග්ලොබින් නිපදවීමට බලපාන ප්‍රවේණික රෝගයකි"],"තැලසීමියාව නිලීන ඇලීලයක් නිසා ඇති වන ප්‍රවේණික රෝගයකි. රෝගී දරුවෙකු ඇති වීමට දෙමාපියන් දෙදෙනාම වාහකයන් විය යුතුය."],["Which statement about thalassaemia is correct?",["it is an infectious disease","it is a sex-linked disease","it is a vitamin deficiency","it is a genetic disease affecting haemoglobin production"],"Thalassaemia is a genetic disease caused by a recessive allele. Both parents must be carriers for a child to have it."],"2020 Q9"],["GEN",1,["Aa × aa ගුණනයේදී ලැබෙන ප්‍රවේණි දර්ශ ගණන සහ රූපාණු දර්ශ ගණන පිළිවෙළින් කීයද?",["1 සහ 1","2 සහ 2","3 සහ 2","2 සහ 1"],"Aa × aa → Aa, Aa, aa, aa. ප්‍රවේණි දර්ශ 2ක් (Aa, aa) සහ රූපාණු දර්ශ 2ක් (ප්‍රමුඛ, නිලීන), 1 : 1 අනුපාතයෙන්."],["How many genotypes and how many phenotypes, respectively, come from the cross Aa × aa?",["1 and 1","2 and 2","3 and 2","2 and 1"],"Aa × aa → Aa, Aa, aa, aa. Two genotypes (Aa, aa) and two phenotypes (dominant, recessive), in a 1 : 1 ratio."],"2023 Q27"],["GEN",1,["මිනිස් ශුක්‍රාණුවක ඇති අලිංගික වර්ණදේහ (autosomes) ගණන සහ ලිංගික වර්ණදේහය කුමක් විය හැකිද?",["23 සහ X පමණි","22 සහ X හෝ Y","44 සහ XY","22 සහ XX"],"ජන්මාණුවක වර්ණදේහ 23කි: අලිංගික 22 + ලිංගික 1. ශුක්‍රාණුවක එය X හෝ Y වන අතර ඩිම්බයක සෑම විටම X වේ."],["A human sperm cell contains how many autosomes, and which sex chromosome can it have?",["23 and X only","22 and X or Y","44 and XY","22 and XX"],"A gamete has 23 chromosomes: 22 autosomes + 1 sex chromosome. In sperm it is X or Y; in an egg it is always X."],"2024 Q29"],["GEN",3,["පහත රෝග යුගල අතරින් දෙකම ලිංග-ප්‍රතිබද්ධ (X වර්ණදේහයේ) ප්‍රවේණික රෝග වන්නේ කුමක්ද?",["තැලසීමියාව සහ ඇල්බිනිසම්","දියවැඩියාව සහ අධි රුධිර පීඩනය","හිමොෆීලියාව සහ තැලසීමියාව","හිමොෆීලියාව සහ වර්ණ අන්ධතාව"],"හිමොෆීලියාව සහ රතු-කොළ වර්ණ අන්ධතාව X වර්ණදේහයේ ජාන නිසා ඇති වේ. තැලසීමියාව සහ ඇල්බිනිසම් අලිංගික වර්ණදේහවල ජාන නිසාය."],["Which pair are both sex-linked (X chromosome) genetic disorders?",["thalassaemia and albinism","diabetes and high blood pressure","haemophilia and thalassaemia","haemophilia and colour blindness"],"Haemophilia and red-green colour blindness are caused by genes on the X chromosome. Thalassaemia and albinism are caused by genes on autosomes."],"2025 Q9"],["HEALTH",3,["පහත රෝග අතරින් ජීවන රටාව වෙනස් කිරීමෙන් වැළැක්විය නොහැකි රෝගය කුමක්ද?",["දෙවන වර්ගයේ දියවැඩියාව","අධි රුධිර පීඩනය","තරබාරුකම","වර්ණ අන්ධතාව"],"වර්ණ අන්ධතාව ප්‍රවේණික රෝගයකි. දියවැඩියාව, අධි රුධිර පීඩනය, තරබාරුකම ආහාර සහ ව්‍යායාම වැනි ජීවන රටා වෙනස්කම්වලින් පාලනය හෝ වැළැක්විය හැක."],["Which of these diseases cannot be prevented by changing lifestyle?",["type 2 diabetes","high blood pressure","obesity","colour blindness"],"Colour blindness is genetic. Diabetes, high blood pressure and obesity can be controlled or prevented by diet and exercise."],"2025 Q37"],["HEAT",2,["වාෂ්පීකරණය සහ තාපාංකයේදී නැටීම (boiling) පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["දෙකම නිශ්චිත උෂ්ණත්වයකදී පමණක් සිදු වේ","වාෂ්පීකරණය ද්‍රවය පුරාම සිදු වේ","වාෂ්පීකරණය ඕනෑම උෂ්ණත්වයක ද්‍රව පෘෂ්ඨයෙන් පමණක් සිදු වේ","නැටීම ද්‍රව පෘෂ්ඨයෙන් පමණක් සිදු වේ"],"වාෂ්පීකරණය ඕනෑම උෂ්ණත්වයක පෘෂ්ඨයේ සිදු වේ. නැටීම තාපාංකයේදී පමණක්, ද්‍රවය පුරාම බුබුළු සාදමින් සිදු වේ."],["Which statement about evaporation and boiling is correct?",["both happen only at a fixed temperature","evaporation happens throughout the liquid","evaporation happens at any temperature, only at the surface","boiling happens only at the surface"],"Evaporation happens at the surface at any temperature. Boiling happens only at the boiling point, with bubbles throughout the liquid."],"2019 Q39"],["HEAT",1,["අයිස් රත් කරන විට උෂ්ණත්වය-කාල ප්‍රස්තාරයේ 0 °C හිදී තිරස් කොටසක් ඇති වන්නේ ඇයි?",["තාපය සැපයීම නතර වන නිසා","සපයන තාපය අවස්ථා වෙනස (දිය වීම) සඳහා ගුප්ත තාපය ලෙස යොදා ගන්නා නිසා","අයිස්වල විශිෂ්ට තාප ධාරිතාව ශුන්‍ය නිසා","තාපය පරිසරයට හානි වන නිසා"],"දිය වන අතරතුර සපයන තාපය අණු අතර බන්ධන බිඳීමට (ගුප්ත තාපය) යොදා ගන්නා නිසා උෂ්ණත්වය වෙනස් නොවේ."],["When ice is heated, why is there a flat part on the temperature-time graph at 0 °C?",["heating stops","the heat supplied is used as latent heat to change state (melt)","the specific heat capacity of ice is zero","heat is lost to the surroundings"],"While melting, the heat supplied breaks bonds between molecules (latent heat), so the temperature does not change."],"2020 Q34"],["HEAT",0,["සූර්යයාගෙන් පෘථිවියට තාපය පැමිණෙන්නේ කුමන ක්‍රමයෙන්ද?",["විකිරණය","සන්නයනය","සංවහනය","වාෂ්පීකරණය"],"අවකාශය රික්තයකි. සන්නයනයට හා සංවහනයට මාධ්‍යයක් අවශ්‍යයි. විකිරණයට (විද්‍යුත් චුම්බක තරංග) මාධ්‍යයක් අවශ්‍ය නැත."],["How does heat from the Sun reach the Earth?",["radiation","conduction","convection","evaporation"],"Space is a vacuum. Conduction and convection need a medium; radiation (electromagnetic waves) does not."],"2020 Q6"],["HEAT",0,["වාහන එන්ජින් සිසිල් කිරීමට ජලය භාවිත කිරීමට ප්‍රධාන හේතුව කුමක්ද?",["ජලයේ විශිෂ්ට තාප ධාරිතාව ඉහළ වීම","ජලයේ ඝනත්වය අඩු වීම","ජලය හොඳ විදුලි සන්නායකයක් වීම","ජලය අවර්ණ වීම"],"ජලයේ විශිෂ්ට තාප ධාරිතාව (4200 J kg⁻¹ °C⁻¹) ඉහළ නිසා උෂ්ණත්වය ස්වල්පයක් වැඩි වන විට වැඩි තාපයක් අවශෝෂණය කර ගනී."],["Why is water used to cool car engines?",["water has a high specific heat capacity","water has a low density","water is a good electrical conductor","water is colourless"],"Water's specific heat capacity (4200 J kg⁻¹ °C⁻¹) is high, so it absorbs a lot of heat with only a small temperature rise."],"2021 Q8"],["HEAT",1,["මුහුදු සුළඟ (sea breeze) ඇති වීම පැහැදිලි කරන තාප සංක්‍රාමණ ක්‍රමය කුමක්ද?",["සන්නයනය","සංවහනය","විකිරණය","වාෂ්පීකරණය"],"දහවල ගොඩබිම ඉක්මනින් රත් වී ඉහළ වාතය උණුසුම් වී ඉහළ නගී. මුහුදේ සිට සිසිල් වාතය ඒ වෙනුවට ගලා එයි. මෙය සංවහනයයි."],["Which method of heat transfer explains the sea breeze?",["conduction","convection","radiation","evaporation"],"In the day the land heats faster; warm air above it rises and cooler air flows in from the sea. This is convection."],"2022 Q21"],["HEAT",3,["පිත්තල සහ යකඩ තීරු එකට ඇලවූ ද්වි-ලෝහ තීරුවක් රත් කළ විට එය නැමෙන්නේ ඇයි? (පිත්තල වැඩිපුර ප්‍රසාරණය වේ)",["යකඩ වැඩිපුර ප්‍රසාරණය වන නිසා යකඩ පැත්තට නැමේ","ලෝහ දෙකම සමානව ප්‍රසාරණය වන නිසා","ලෝහ දෙකම සංකෝචනය වන නිසා","පිත්තල වැඩිපුර ප්‍රසාරණය වන නිසා පිත්තල පිටත (උත්තල) පැත්තට සිටින සේ නැමේ"],"ප්‍රසාරණය වැඩි ලෝහය දිගු වන නිසා එය වක්‍රයේ පිටත පැත්තට යයි. උෂ්ණත්ව පාලක (thermostat) සහ ගිනි අනතුරු ඇඟවීම් මේ ලෙස ක්‍රියා කරයි."],["A bimetallic strip of brass and iron is heated (brass expands more). Why does it bend?",["iron expands more, so it bends towards the iron","both metals expand equally","both metals contract","brass expands more, so it bends with brass on the outside (convex) side"],"The metal that expands more becomes longer, so it is on the outside of the curve. Thermostats and fire alarms use this."],"2023 Q25"],["HEAT",1,["80 °C ජලය 300 g ක් 20 °C ජලය 300 g ක් සමඟ මිශ්‍ර කළ විට අවසාන උෂ්ණත්වය කීයද? (තාප හානියක් නැත)",["40 °C","50 °C","60 °C","100 °C"],"ස්කන්ධ සමාන නිසා උණුසුම් ජලය අහිමි කරන තාපය = සීතල ජලය ලබා ගන්නා තාපය. අවසාන උෂ්ණත්වය = (80 + 20) ÷ 2 = 50 °C."],["300 g of water at 80 °C is mixed with 300 g of water at 20 °C. What is the final temperature? (no heat loss)",["40 °C","50 °C","60 °C","100 °C"],"The masses are equal, so heat lost by the hot water = heat gained by the cold water. Final temperature = (80 + 20) ÷ 2 = 50 °C."],"2025 Q34"],["HEATCHEM",1,["මීතේන් දහනය (CH₄ + 2O₂ → CO₂ + 2H₂O) සඳහා නිවැරදි ශක්ති මට්ටම් සටහන කුමක්ද?",["ඵල ප්‍රතික්‍රියකවලට ඉහළින්, ΔH > 0","ඵල ප්‍රතික්‍රියකවලට පහළින්, ΔH < 0","ඵල සහ ප්‍රතික්‍රියක එකම මට්ටමේ","ඵල ප්‍රතික්‍රියකවලට පහළින්, ΔH > 0"],"දහනය තාපදායකයි. තාපය පිට වන නිසා ඵලවල ශක්තිය අඩුය, ΔH සෘණයි."],["Which energy level diagram is correct for burning methane (CH₄ + 2O₂ → CO₂ + 2H₂O)?",["products above reactants, ΔH > 0","products below reactants, ΔH < 0","products and reactants at the same level","products below reactants, ΔH > 0"],"Combustion is exothermic. Heat is released, so the products have less energy and ΔH is negative."],"2019 Q31"],["HEATCHEM",0,["ප්‍රබල අම්ලයක් සහ ප්‍රබල භෂ්මයක් අතර උදාසීනීකරණය පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["එය තාපදායක ප්‍රතික්‍රියාවකි","එය තාපාවශෝෂක ප්‍රතික්‍රියාවකි","එහිදී තාප වෙනසක් නැත","එහිදී වායුවක් පිට වේ"],"H⁺ + OH⁻ → H₂O ප්‍රතික්‍රියාවේදී තාපය පිට වන නිසා ද්‍රාවණය රත් වේ."],["Which statement about neutralization between a strong acid and a strong base is correct?",["it is exothermic","it is endothermic","there is no heat change","a gas is given off"],"In H⁺ + OH⁻ → H₂O heat is released, so the solution warms up."],"2020 Q32"],["HEATCHEM",0,["ඵලවල ශක්තිය ප්‍රතික්‍රියකවලට වඩා ඉහළ මට්ටමක ඇති ශක්ති මට්ටම් සටහනකට ගැළපෙන වෙනස කුමක්ද?",["NH₄Cl ජලයේ දිය වීම","ස්වභාවික වායු දහනය","Mg සහ HCl ප්‍රතික්‍රියාව","NaOH සහ HCl උදාසීනීකරණය"],"ඵල ඉහළින් නම් තාපය අවශෝෂණය වේ (තාපාවශෝෂක). NH₄Cl දිය වීම තාපාවශෝෂකයි. අනෙක් තුනම තාපදායකයි."],["Which change matches an energy level diagram with the products above the reactants?",["dissolving NH₄Cl in water","burning natural gas","Mg reacting with HCl","neutralizing NaOH with HCl"],"Products above reactants means heat is absorbed (endothermic). Dissolving NH₄Cl is endothermic; the other three are exothermic."],"2025 Q29"],["INDUS",1,["පුපුරු උදුනේ (blast furnace) යකඩ ඔක්සයිඩය යකඩ බවට ඔක්සිහරණය කරන ප්‍රධාන ද්‍රව්‍යය කුමක්ද?",["CO₂","CO (කාබන් මොනොක්සයිඩ්)","CaO","O₂"],"කෝක් දහනයෙන් CO₂ සෑදී, එය කෝක් සමඟ CO සාදයි. Fe₂O₃ + 3CO → 2Fe + 3CO₂."],["In the blast furnace, what mainly reduces iron oxide to iron?",["CO₂","CO (carbon monoxide)","CaO","O₂"],"Coke burns to CO₂, which reacts with more coke to form CO. Fe₂O₃ + 3CO → 2Fe + 3CO₂."],"2018 Q14"],["INDUS",2,["පුපුරු උදුනට හුණුගල් (CaCO₃) එකතු කරන්නේ ඇයි?",["යකඩ ඔක්සිහරණය කිරීමට","උෂ්ණත්වය අඩු කිරීමට","වැලි (SiO₂) වැනි අපද්‍රව්‍ය ධාතුමලය (slag) ලෙස ඉවත් කිරීමට","CO වායුව සෑදීමට"],"CaCO₃ → CaO + CO₂. CaO (භාස්මික) SiO₂ (ආම්ලික) සමඟ CaSiO₃ ධාතුමලය සාදයි. එය උණු වූ යකඩ මත පාවී ඉවත් කළ හැක."],["Why is limestone (CaCO₃) added to the blast furnace?",["to reduce the iron","to lower the temperature","to remove impurities such as sand (SiO₂) as slag","to make CO gas"],"CaCO₃ → CaO + CO₂. CaO (basic) reacts with SiO₂ (acidic) to form CaSiO₃ slag, which floats on the molten iron."],"2019 Q34"],["INDUS",1,["ලුණු ලේවායක මුහුදු ජලයෙන් ලුණු ලබා ගැනීමේදී පළමුව තැන්පත් වන ලවණ (ලුණුවලට පෙර) මොනවාද?",["NaCl","CaCO₃ සහ CaSO₄ (ජිප්සම්)","MgCl₂ සහ MgSO₄","KCl"],"ද්‍රාව්‍යතාව අඩු CaCO₃ සහ CaSO₄ පළමුව තැන්පත් වේ. ඉන්පසු NaCl. ද්‍රාව්‍යතාව වැඩි Mg ලවණ \"කිවුල් ජලයේ\" ඉතිරි වේ."],["When salt is made from sea water in salterns, which salts deposit first (before common salt)?",["NaCl","CaCO₃ and CaSO₄ (gypsum)","MgCl₂ and MgSO₄","KCl"],"The less soluble CaCO₃ and CaSO₄ deposit first, then NaCl. The very soluble Mg salts stay in the \"bittern\"."],"2020 Q26"],["LIGHT",0,["උත්තල කාචයක නාභියේ (F) කුඩා ආලෝක ප්‍රභවයක් තැබූ විට කාචයෙන් පිටවන ආලෝක කදම්බය කෙසේද?",["ප්‍රධාන අක්ෂයට සමාන්තර කදම්බයක්","අභිසාරී කදම්බයක්","අපසාරී කදම්බයක්","කාචය හරහා ආලෝකය නොයයි"],"නාභිය හරහා එන කිරණ වර්තනයෙන් පසු අක්ෂයට සමාන්තරව යයි. සෙවුම් ලාම්පු (searchlight) ක්‍රියා කරන්නේ මෙලෙසයි."],["A small lamp is placed at the principal focus (F) of a convex lens. What kind of beam leaves the lens?",["a beam parallel to the principal axis","a converging beam","a diverging beam","no light passes through"],"Rays through the focus come out parallel to the axis after refraction. Searchlights work this way."],"2018 Q25"],["LIGHT",0,["අත් කාචයක් (magnifying glass) ලෙස භාවිත කරන කාචය සහ එය සාදන ප්‍රතිබිම්බය කුමක්ද?",["උත්තල කාචය; අතාත්වික, උඩුකුරු, විශාල","අවතල කාචය; අතාත්වික, උඩුකුරු, කුඩා","උත්තල කාචය; තාත්වික, යටිකුරු, විශාල","අවතල කාචය; තාත්වික, යටිකුරු, කුඩා"],"වස්තුව නාභිය සහ කාචය අතර තැබූ විට උත්තල කාචය අතාත්වික, උඩුකුරු, විශාල ප්‍රතිබිම්බයක් සාදයි."],["Which lens is used as a magnifying glass, and what image does it form?",["convex lens; virtual, upright, magnified","concave lens; virtual, upright, diminished","convex lens; real, inverted, magnified","concave lens; real, inverted, diminished"],"With the object between the focus and the lens, a convex lens forms a virtual, upright, magnified image."],"2018 Q26"],["LIGHT",0,["පූර්ණ අභ්‍යන්තර පරාවර්තනය සිදු වීමට අවශ්‍ය කොන්දේසි මොනවාද?",["ආලෝකය ඝන මාධ්‍යයක සිට විරල මාධ්‍යයකට යාම සහ පතන කෝණය අවධි කෝණයට වඩා වැඩි වීම","ආලෝකය විරල මාධ්‍යයක සිට ඝන මාධ්‍යයකට යාම","පතන කෝණය ශුන්‍ය වීම","පතන කෝණය අවධි කෝණයට වඩා අඩු වීම"],"ජලයේ සිට වාතයට හෝ වීදුරුවේ සිට වාතයට යන විට පමණක්, පතන කෝණය අවධි කෝණය ඉක්මවූ විට සම්පූර්ණ පරාවර්තනය සිදු වේ."],["What conditions are needed for total internal reflection?",["light goes from a denser to a less dense medium and the angle of incidence is greater than the critical angle","light goes from a less dense to a denser medium","the angle of incidence is zero","the angle of incidence is less than the critical angle"],"Only when going from e.g. water or glass into air, with the angle of incidence above the critical angle, is all the light reflected."],"2020 Q20"],["LIGHT",2,["වාහනවල පසු පස බැලීමේ කැඩපත් ලෙස උත්තල දර්පණ භාවිත කිරීමට හේතුව කුමක්ද?",["තාත්වික ප්‍රතිබිම්බ සාදන නිසා","විශාල ප්‍රතිබිම්බ සාදන නිසා","උඩුකුරු, කුඩා ප්‍රතිබිම්බ සාදමින් පුළුල් දර්ශන ක්ෂේත්‍රයක් ලබා දෙන නිසා","යටිකුරු ප්‍රතිබිම්බ සාදන නිසා"],"උත්තල දර්පණය සැමවිටම අතාත්වික, උඩුකුරු, කුඩා ප්‍රතිබිම්බයක් සාදයි. ඒ නිසා පිටුපස විශාල ප්‍රදේශයක් පෙනේ."],["Why are convex mirrors used as vehicle rear-view mirrors?",["they form real images","they form magnified images","they form upright, diminished images and give a wide field of view","they form inverted images"],"A convex mirror always forms a virtual, upright, diminished image, so a wide area behind is visible."],"2021 Q14"],["LIGHT",2,["පහත ඒවා අතරින් පූර්ණ අභ්‍යන්තර පරාවර්තනය භාවිත කරන්නේ කුමක්ද?",["තල දර්පණය","කැමරා කාචය","ප්‍රකාශ තන්තු (optical fibre)","ඇසේ කාචය"],"ප්‍රකාශ තන්තුවක ආලෝකය බිත්ති මත නැවත නැවත පූර්ණ අභ්‍යන්තර පරාවර්තනය වී දිගු දුරක් ගමන් කරයි. වෛද්‍ය එන්ඩොස්කෝප සහ අන්තර්ජාල කේබල්වල භාවිත කරයි."],["Which of these makes use of total internal reflection?",["a plane mirror","a camera lens","an optical fibre","the eye lens"],"In an optical fibre, light is totally internally reflected again and again along the walls. Used in endoscopes and internet cables."],"2022 Q11"],["LIGHT",1,["ජල බඳුනක පතුල සැබෑ ගැඹුරට වඩා නොගැඹුරු ලෙස පෙනෙන්නේ ඇයි?",["ආලෝකය පරාවර්තනය වන නිසා","ජලයේ සිට වාතයට එන ආලෝකය අභිලම්බයෙන් ඉවතට වර්තනය වන නිසා","ආලෝකය ජලයේ අවශෝෂණය වන නිසා","පූර්ණ අභ්‍යන්තර පරාවර්තනය නිසා"],"ජලයේ සිට වාතයට එන කිරණ අභිලම්බයෙන් ඉවතට නැමේ. ඇසට ඒවා ඉහළ ලක්ෂ්‍යයකින් එන සේ පෙනේ."],["Why does the bottom of a container of water look shallower than it really is?",["light is reflected","light from the water bends away from the normal as it enters the air","light is absorbed by the water","total internal reflection"],"Rays from water to air bend away from the normal, so to the eye they seem to come from a higher point."],"2023 Q14"],["LIGHT",2,["තල දර්පණයක සාදන ප්‍රතිබිම්බය පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["එය තාත්වික වේ","එය වස්තුවට වඩා කුඩා වේ","එය පාර්ශ්වික ලෙස යටිකුරු (වම-දකුණ මාරු) වේ","එය දර්පණයට වස්තුවට වඩා ළඟින් සෑදේ"],"තල දර්පණයක ප්‍රතිබිම්බය අතාත්වික, උඩුකුරු, සමාන ප්‍රමාණය, පාර්ශ්වික ලෙස යටිකුරු වන අතර දර්පණයේ පිටුපස එම දුරින්ම සෑදේ."],["Which statement about the image in a plane mirror is true?",["it is real","it is smaller than the object","it is laterally inverted (left and right swapped)","it forms closer to the mirror than the object"],"A plane mirror image is virtual, upright, the same size, laterally inverted, and as far behind the mirror as the object is in front."],"2024 Q19"],["LIGHT",0,["අවතල දර්පණයක නාභිය සහ ධ්‍රැවය (P) අතර වස්තුවක් තැබූ විට සෑදෙන ප්‍රතිබිම්බය කුමක්ද?",["අතාත්වික, උඩුකුරු, විශාල","තාත්වික, යටිකුරු, විශාල","තාත්වික, යටිකුරු, කුඩා","අතාත්වික, උඩුකුරු, කුඩා"],"මෙම ස්ථානයේදී පරාවර්තිත කිරණ අපසාරී වේ. ඒවා දර්පණය පිටුපසට දික් කළ විට අතාත්වික, උඩුකුරු, විශාල ප්‍රතිබිම්බයක් ලැබේ. රැවුල කපන දර්පණය මෙයට උදාහරණයකි."],["An object is placed between the focus and the pole (P) of a concave mirror. What image forms?",["virtual, upright, magnified","real, inverted, magnified","real, inverted, diminished","virtual, upright, diminished"],"Here the reflected rays diverge; traced back behind the mirror they give a virtual, upright, magnified image. A shaving mirror is an example."],"2025 Q11"],["MOTION",0,["ප්‍රවේග-කාල ප්‍රස්තාරයක ධන අනුක්‍රමණයක් ඇති සරල රේඛාවකින් දැක්වෙන්නේ කුමක්ද?",["ඒකාකාර ත්වරණය","ඒකාකාර ප්‍රවේගය","නිශ්චලතාව","ඒකාකාර මන්දනය"],"v-t ප්‍රස්තාරයේ අනුක්‍රමණය = ත්වරණය. නියත ධන අනුක්‍රමණය = ඒකාකාර ත්වරණය. තිරස් රේඛාව = ඒකාකාර ප්‍රවේගය."],["On a velocity-time graph, what does a straight line with a positive gradient show?",["uniform acceleration","uniform velocity","being at rest","uniform deceleration"],"On a v-t graph, gradient = acceleration. A constant positive gradient means uniform acceleration; a horizontal line means uniform velocity."],"2019 Q15"],["MOTION",0,["පහත රාශි අතරින් දෛශික රාශියක් වන්නේ කුමක්ද?",["විස්ථාපනය","දුර","වේගය","ස්කන්ධය"],"විස්ථාපනයට විශාලත්වය සහ දිශාව යන දෙකම ඇත. දුර, වේගය, ස්කන්ධය අදිශ රාශි වේ."],["Which of these is a vector quantity?",["displacement","distance","speed","mass"],"Displacement has both magnitude and direction. Distance, speed and mass are scalars."],"2019 Q3"],["MOTION",3,["ළමයෙක් 400 m ක ධාවන පථයක් එක් වටයක් දිව ආරම්භක ස්ථානයටම පැමිණේ. ගමන් කළ දුර සහ විස්ථාපනය පිළිවෙළින් කීයද?",["0 m සහ 400 m","400 m සහ 400 m","200 m සහ 0 m","400 m සහ 0 m"],"දුර = ගමන් කළ මාර්ගයේ මුළු දිග = 400 m. විස්ථාපනය = ආරම්භයේ සිට අවසානයට සෘජු දුර = 0 m."],["A child runs one lap of a 400 m track and ends at the starting point. What are the distance travelled and the displacement?",["0 m and 400 m","400 m and 400 m","200 m and 0 m","400 m and 0 m"],"Distance = total length of the path = 400 m. Displacement = straight-line distance from start to finish = 0 m."],"2020 Q11"],["MOTION",1,["විස්ථාපන-කාල ප්‍රස්තාරයක තිරස් සරල රේඛාවකින් දැක්වෙන්නේ කුමක්ද?",["ඒකාකාර ප්‍රවේගය","වස්තුව නිශ්චලව සිටීම","ඒකාකාර ත්වරණය","ප්‍රවේගය වැඩි වීම"],"විස්ථාපනය කාලයත් සමඟ වෙනස් නොවේ නම් වස්තුව චලනය නොවේ. d-t ප්‍රස්තාරයේ අනුක්‍රමණය = ප්‍රවේගය = 0."],["On a displacement-time graph, what does a horizontal straight line show?",["uniform velocity","the object is at rest","uniform acceleration","increasing velocity"],"If displacement does not change with time, the object is not moving. Gradient of a d-t graph = velocity = 0."],"2020 Q8"],["MOTION",1,["උසක සිට නිදහසේ වැටෙන ගලක ප්‍රවේගය තත්පර 2කට පසු කීයද? (g = 10 m s⁻², වායු ප්‍රතිරෝධය නොසලකන්න)",["10 m s⁻¹","20 m s⁻¹","5 m s⁻¹","40 m s⁻¹"],"v = u + at = 0 + 10 × 2 = 20 m s⁻¹."],["A stone falls freely from rest. What is its velocity after 2 s? (g = 10 m s⁻², ignore air resistance)",["10 m s⁻¹","20 m s⁻¹","5 m s⁻¹","40 m s⁻¹"],"v = u + at = 0 + 10 × 2 = 20 m s⁻¹."],"2021 Q19"],["MOTION",2,["කාරයක ප්‍රවේගය තත්පර 5ක් තුළ 10 m s⁻¹ සිට 30 m s⁻¹ දක්වා ඒකාකාරව වැඩි වේ. ත්වරණය කීයද?",["2 m s⁻²","6 m s⁻²","4 m s⁻²","8 m s⁻²"],"a = (v − u) ÷ t = (30 − 10) ÷ 5 = 4 m s⁻²."],["A car's velocity increases uniformly from 10 m s⁻¹ to 30 m s⁻¹ in 5 s. What is its acceleration?",["2 m s⁻²","6 m s⁻²","4 m s⁻²","8 m s⁻²"],"a = (v − u) ÷ t = (30 − 10) ÷ 5 = 4 m s⁻²."],"2021 Q6"],["MOTION",2,["වස්තුවක් තත්පර 10ක් 6 m s⁻¹ නියත ප්‍රවේගයෙන් ගමන් කරයි. v-t ප්‍රස්තාරය යට වර්ගඵලය (විස්ථාපනය) කීයද?",["16 m","30 m","60 m","0.6 m"],"ප්‍රස්තාරය යට සෘජුකෝණාස්‍රයේ වර්ගඵලය = 6 × 10 = 60 m."],["An object moves at a constant 6 m s⁻¹ for 10 s. What is the area under its v-t graph (the displacement)?",["16 m","30 m","60 m","0.6 m"],"Area of the rectangle under the graph = 6 × 10 = 60 m."],"2022 Q26"],["MOTION",2,["v-t ප්‍රස්තාරයක පහළට බෑවුම් වන (සෘණ අනුක්‍රමණයක් ඇති) සරල රේඛාවකින් දැක්වෙන්නේ කුමක්ද?",["ඒකාකාර ත්වරණය","නිශ්චලතාව","ඒකාකාර මන්දනය","ඒකාකාර ප්‍රවේගය"],"ප්‍රවේගය නියත ශීඝ්‍රතාවයකින් අඩු වන නිසා එය ඒකාකාර මන්දනයයි (ත්වරණය සෘණයි)."],["On a v-t graph, what does a straight line sloping downwards (negative gradient) show?",["uniform acceleration","being at rest","uniform deceleration","uniform velocity"],"The velocity falls at a constant rate, so this is uniform deceleration (negative acceleration)."],"2023 Q36"],["MOTION",3,["පහත යුගල අතරින් දෛශික රාශි දෙකම ඇති යුගලය කුමක්ද?",["දුර සහ වේගය","ස්කන්ධය සහ කාලය","ශක්තිය සහ කාර්යය","ප්‍රවේගය සහ ත්වරණය"],"ප්‍රවේගය සහ ත්වරණයට දිශාවක් ඇති නිසා දෛශිකයි. දුර, වේගය, ස්කන්ධය, කාලය, ශක්තිය, කාර්යය අදිශයි."],["Which pair are both vector quantities?",["distance and speed","mass and time","energy and work","velocity and acceleration"],"Velocity and acceleration have direction, so they are vectors. Distance, speed, mass, time, energy and work are scalars."],"2024 Q2"],["NUTR",1,["රාත්‍රී අන්ධතාව ඇති වන්නේ කුමන විටමින් ඌනතාවයෙන්ද?",["විටමින් C","විටමින් A","විටමින් D","විටමින් K"],"විටමින් A පෙනීමට අවශ්‍යයි. ඌනතාවයෙන් රාත්‍රී අන්ධතාව ඇති වේ. C — ස්කර්වි, D — රිකට්ස්, K — රුධිරය කැටි නොගැසීම."],["Night blindness is caused by a deficiency of which vitamin?",["vitamin C","vitamin A","vitamin D","vitamin K"],"Vitamin A is needed for vision; lack of it causes night blindness. C — scurvy, D — rickets, K — poor blood clotting."],"2019 Q12"],["NUTR",0,["මේද (ලිපිඩ) මේද අම්ල සහ ග්ලිසරෝල් බවට ජීර්ණය කරන එන්සයිමය කුමක්ද?",["ලයිපේස්","ඇමයිලේස්","පෙප්සින්","ට්‍රිප්සින්"],"ලයිපේස් (අග්න්‍යාශ යුෂයේ) මේද ජීර්ණය කරයි. ඇමයිලේස් — පිෂ්ඨය, පෙප්සින් සහ ට්‍රිප්සින් — ප්‍රෝටීන."],["Which enzyme digests fats (lipids) into fatty acids and glycerol?",["lipase","amylase","pepsin","trypsin"],"Lipase (in pancreatic juice) digests fats. Amylase — starch; pepsin and trypsin — proteins."],"2019 Q16"],["NUTR",2,["ආහාරයේ තන්තු (සෙලියුලෝස්) වැදගත් වන්නේ ඇයි?",["එය ප්‍රධාන ශක්ති ප්‍රභවය නිසා","එය මිනිසා විසින් ග්ලූකෝස් බවට ජීර්ණය කරන නිසා","එය ආහාර මාර්ගය දිගේ ආහාර චලනයට උදව් වී මලබද්ධය වළක්වන නිසා","එය මාංශ පේශි ගොඩනැගීමට උදව් වන නිසා"],"මිනිසාට සෙලියුලෝස් ජීර්ණය කිරීමට එන්සයිම නැත. එහෙත් තන්තු ආහාර මාර්ගයේ ක්‍රමාකුංචනයට උදව් කරයි."],["Why is dietary fibre (cellulose) important?",["it is the main energy source","humans digest it into glucose","it helps food move along the gut and prevents constipation","it helps build muscle"],"Humans have no enzyme to digest cellulose, but fibre helps peristalsis move food along the gut."],"2019 Q25"],["NUTR",2,["ග්‍රෑමයකට වැඩිම ශක්තියක් ලබා දෙන පෝෂක වර්ගය කුමක්ද?",["කාබෝහයිඩ්‍රේට","ප්‍රෝටීන","ලිපිඩ (මේද)","විටමින්"],"ලිපිඩ ග්‍රෑමයකින් ~37 kJ ලැබෙන අතර කාබෝහයිඩ්‍රේට සහ ප්‍රෝටීනවලින් ~17 kJ පමණ ලැබේ. විටමින් ශක්තිය සපයන්නේ නැත."],["Which nutrient gives the most energy per gram?",["carbohydrate","protein","lipid (fat)","vitamins"],"Lipids give about 37 kJ per gram; carbohydrates and proteins give about 17 kJ. Vitamins give no energy."],"2020 Q15"],["NUTR",3,["පහත ආහාර අතරින් ග්ලූකෝස් සහ අනෙකුත් සීනි ඉක්මනින් ලබා දෙන ආහාරය කුමක්ද?",["බිත්තර සුදු මදය","මාළු","පොල් තෙල්","ඉදුණු කෙසෙල් සහ මී පැණි"],"පලතුරු සහ මී පැණිවල සරල සීනි (ග්ලූකෝස්, ෆ්‍රක්ටෝස්) ඇත. බිත්තර සුදු මදය සහ මාළු ප්‍රෝටීන, පොල් තෙල් ලිපිඩ වේ."],["Which food quickly provides glucose and other sugars?",["egg white","fish","coconut oil","ripe banana and honey"],"Fruit and honey contain simple sugars (glucose, fructose). Egg white and fish are protein; coconut oil is lipid."],"2020 Q16"],["NUTR",2,["ආහාර මාර්ගයේත් ශ්වසන මාර්ගයේත් පොදු කොටස කුමක්ද?",["ආහාර නාලය (oesophagus)","ශ්වාසනාලය (trachea)","ග්‍රසනිය (pharynx)","ස්වරාලය (larynx)"],"ග්‍රසනිය (උගුර) හරහා ආහාර සහ වාතය දෙකම ගමන් කරයි. ගිලින විට අපිජිහ්වාව ශ්වාසනාලය වසයි."],["Which part is shared by both the digestive and respiratory tracts?",["oesophagus","trachea","pharynx","larynx"],"Both food and air pass through the pharynx (throat). When swallowing, the epiglottis closes the trachea."],"2020 Q28"],["NUTR",1,["පිත නිපදවන සහ ගබඩා කරන ඉන්ද්‍රිය පිළිවෙළින් මොනවාද?",["අග්න්‍යාශය සහ ආමාශය","අක්මාව සහ පිත්තාශය","පිත්තාශය සහ අක්මාව","ආමාශය සහ කුඩා අන්ත්‍රය"],"පිත අක්මාවේ නිපදවා පිත්තාශයේ ගබඩා කරයි. එය කුඩා අන්ත්‍රයට (ග්‍රහණියට) මුදා හැර මේද පායනය කරයි."],["Which organs make and store bile, respectively?",["pancreas and stomach","liver and gall bladder","gall bladder and liver","stomach and small intestine"],"Bile is made in the liver and stored in the gall bladder. It is released into the small intestine (duodenum) to emulsify fats."],"2021 Q9"],["NUTR",2,["ආහාර ගමන් කරන නිවැරදි පිළිවෙළ කුමක්ද?",["මුඛය → ආමාශය → ආහාර නාලය → කුඩා අන්ත්‍රය","මුඛය → කුඩා අන්ත්‍රය → ආමාශය → මහා අන්ත්‍රය","මුඛය → ආහාර නාලය → ආමාශය → කුඩා අන්ත්‍රය → මහා අන්ත්‍රය","මුඛය → ආහාර නාලය → මහා අන්ත්‍රය → කුඩා අන්ත්‍රය"],"මුඛය → ග්‍රසනිය → ආහාර නාලය → ආමාශය → කුඩා අන්ත්‍රය → මහා අන්ත්‍රය → ගුදය."],["What is the correct order in which food passes through the gut?",["mouth → stomach → oesophagus → small intestine","mouth → small intestine → stomach → large intestine","mouth → oesophagus → stomach → small intestine → large intestine","mouth → oesophagus → large intestine → small intestine"],"Mouth → pharynx → oesophagus → stomach → small intestine → large intestine → anus."],"2024 Q10"],["NUTR",0,["ආමාශයේ සහ කුඩා අන්ත්‍රයේ (ග්‍රහණිය) මාධ්‍යයේ pH අගයන් සඳහා වඩාත් ගැළපෙන යුගලය කුමක්ද?",["ආමාශය ≈ 2, කුඩා අන්ත්‍රය ≈ 8","ආමාශය ≈ 8, කුඩා අන්ත්‍රය ≈ 2","දෙකම ≈ 7","ආමාශය ≈ 12, කුඩා අන්ත්‍රය ≈ 7"],"ආමාශයේ HCl නිසා ආම්ලිකයි. කුඩා අන්ත්‍රයට එන පිත සහ අග්න්‍යාශ යුෂ (බයිකාබනේට්) නිසා මද භාස්මික වේ."],["Which pair of pH values best fits the stomach and the small intestine (duodenum)?",["stomach ≈ 2, small intestine ≈ 8","stomach ≈ 8, small intestine ≈ 2","both ≈ 7","stomach ≈ 12, small intestine ≈ 7"],"The stomach is acidic because of HCl. Bile and pancreatic juice (bicarbonate) make the small intestine slightly basic."],"2024 Q11"],["NUTR",1,["ආහාර සාම්පලයකට බෙනඩික්ට් ද්‍රාවණය එක් කර රත් කළ විට වර්ණ වෙනසක් නැත. තනුක අම්ලයක් සමඟ රත් කර, උදාසීන කර නැවත පරීක්ෂා කළ විට තැඹිලි පැහැ විය. එහි ඇති සීනිය කුමක් විය හැකිද?",["ග්ලූකෝස්","සුක්‍රෝස්","ෆ්‍රක්ටෝස්","මෝල්ටෝස්"],"සුක්‍රෝස් ඔක්සිහාරක සීනියක් නොවන නිසා මුලින් බෙනඩික්ට් පරීක්ෂාව සෘණයි. අම්ලයෙන් ජල විච්ඡේදනය වී ග්ලූකෝස් සහ ෆ්‍රක්ටෝස් සෑදූ පසු ධනයි."],["A food sample gives no colour change when heated with Benedict's solution. After boiling with dilute acid, neutralizing and testing again, it turns orange. Which sugar could it contain?",["glucose","sucrose","fructose","maltose"],"Sucrose is not a reducing sugar, so the first Benedict's test is negative. Acid hydrolyses it to glucose and fructose, which test positive."],"2024 Q21"],["ORGANIC",1,["පහත ඒවා අතරින් ස්වාභාවික බහුඅවයවකයක් වන්නේ කුමක්ද?",["පොලිතීන්","සෙලියුලෝස්","PVC","නයිලෝන්"],"සෙලියුලෝස්, පිෂ්ඨය, ප්‍රෝටීන, ස්වාභාවික රබර් ස්වාභාවික බහුඅවයවක වේ. පොලිතීන්, PVC, නයිලෝන් කෘත්‍රිමය."],["Which of these is a natural polymer?",["polythene","cellulose","PVC","nylon"],"Cellulose, starch, proteins and natural rubber are natural polymers. Polythene, PVC and nylon are synthetic."],"2019 Q27"],["ORGANIC",1,["ස්වාභාවික රබර් වල ඒකාවයවකය (monomer) කුමක්ද?",["එතීන්","අයිසොප්‍රීන්","ග්ලූකෝස්","ක්ලෝරොප්‍රීන්"],"ස්වාභාවික රබර් = පොලිඅයිසොප්‍රීන්. ක්ලෝරොප්‍රීන් කෘත්‍රිම නියොප්‍රීන් රබර් වල ඒකාවයවකයයි."],["What is the monomer of natural rubber?",["ethene","isoprene","glucose","chloroprene"],"Natural rubber is polyisoprene. Chloroprene is the monomer of synthetic neoprene rubber."],"2020 Q35"],["ORGANIC",1,["ගෘහස්ථ LP ගෑස් සිලින්ඩරවල ප්‍රධාන වශයෙන් අඩංගු හයිඩ්‍රොකාබන මොනවාද?",["මීතේන් සහ එතේන්","ප්‍රොපේන් සහ බියුටේන්","පෙන්ටේන් සහ හෙක්සේන්","එතීන් සහ ප්‍රොපීන්"],"LP ගෑස් (ද්‍රවීකෘත පෙට්‍රෝලියම් වායු) ප්‍රධාන වශයෙන් ප්‍රොපේන් (C₃H₈) සහ බියුටේන් (C₄H₁₀) වේ. ස්වභාවික වායුව ප්‍රධාන වශයෙන් මීතේන්ය."],["Which hydrocarbons are mainly found in household LP gas cylinders?",["methane and ethane","propane and butane","pentane and hexane","ethene and propene"],"LP gas (liquefied petroleum gas) is mainly propane (C₃H₈) and butane (C₄H₁₀). Natural gas is mainly methane."],"2021 Q2"],["ORGANIC",1,["පොලිතීන් බහුඅවයවකයේ පුනරාවර්තන ඒකකය කුමක්ද?",["–CH₂–","–CH₂–CH₂–","–CH=CH–","–CH₂–CHCl–"],"එතීන් (CH₂=CH₂) අණු ද්විත්ව බන්ධනය විවෘත වී එක් වේ. පුනරාවර්තන ඒකකය –CH₂–CH₂– වේ. –CH₂–CHCl– PVC හි ඒකකයයි."],["What is the repeating unit of polythene?",["–CH₂–","–CH₂–CH₂–","–CH=CH–","–CH₂–CHCl–"],"Ethene (CH₂=CH₂) molecules join as the double bond opens. The repeating unit is –CH₂–CH₂–. –CH₂–CHCl– is the unit of PVC."],"2022 Q10"],["ORGANIC",2,["ප්ලාස්ටික් පරිසරයට ගැටලුවක් වීමට ප්‍රධාන හේතුව කුමක්ද?",["ඒවා ඉක්මනින් දිරාපත් වීම","ඒවා විදුලිය සන්නයනය කිරීම","ඒවා ජෛව හායනය නොවීම (biodegradable නොවීම)","ඒවා ජලයේ දිය වීම"],"බොහෝ කෘත්‍රිම බහුඅවයවක ක්ෂුද්‍ර ජීවීන් මගින් දිරාපත් නොවන නිසා වසර සිය ගණනක් පරිසරයේ රැඳේ."],["Why are plastics a major environmental problem?",["they decompose quickly","they conduct electricity","they are not biodegradable","they dissolve in water"],"Most synthetic polymers cannot be broken down by microorganisms, so they stay in the environment for hundreds of years."],"2023 Q34"],["ORGANIC",0,["පහත ඒවා අතරින් කෘත්‍රිම බහුඅවයවකවල (ප්ලාස්ටික්) ගුණයක් නොවන්නේ කුමක්ද?",["පහසුවෙන් ජෛව හායනය වීම","විදුලි පරිවාරක වීම","අම්ලවලට ප්‍රතිරෝධී වීම","සැහැල්ලු සහ ශක්තිමත් වීම"],"ප්ලාස්ටික් පරිවාරක, රසායනිකව ස්ථායී සහ සැහැල්ලුය. නමුත් ඒවා ජෛව හායනය නොවේ."],["Which of these is NOT a property of synthetic polymers (plastics)?",["being easily biodegradable","being electrical insulators","resisting acids","being light and strong"],"Plastics are insulating, chemically stable and light, but they are not biodegradable."],"2024 Q14"],["ORGANIC",3,["ප්‍රොපේන් (C₃H₈) මවුල 1ක් සම්පූර්ණයෙන් දහනය කළ විට සෑදෙන ජල මවුල ගණන කීයද?",["1","2","3","4"],"C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. H පරමාණු 8 ÷ 2 = H₂O 4."],["How many moles of water form when 1 mole of propane (C₃H₈) burns completely?",["1","2","3","4"],"C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. 8 H atoms ÷ 2 = 4 H₂O."],"2025 Q20"],["RATE",1,["උත්ප්‍රේරකයක් පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["එය ප්‍රතික්‍රියාවේදී සම්පූර්ණයෙන්ම වැය වේ","එය ප්‍රතික්‍රියා ශීඝ්‍රතාව වැඩි කරන අතර ප්‍රතික්‍රියාව අවසානයේ වෙනස් නොවී ඉතිරි වේ","එය ඵල ප්‍රමාණය වැඩි කරයි","එය ප්‍රතික්‍රියාව නතර කරයි"],"උත්ප්‍රේරකය ප්‍රතික්‍රියාවට අවශ්‍ය ශක්තිය අඩු කර ශීඝ්‍රතාව වැඩි කරයි. එහි ස්කන්ධය සහ රසායනික ස්වභාවය අවසානයේ වෙනස් නොවේ. ඵල ප්‍රමාණය වැඩි නොකරයි."],["Which statement about a catalyst is true?",["it is used up completely in the reaction","it speeds up the reaction and is left unchanged at the end","it increases the amount of product","it stops the reaction"],"A catalyst lowers the energy needed and speeds up the reaction. Its mass and chemical nature are unchanged at the end, and it does not increase the yield."],"2018 Q10"],["RATE",3,["Zn සහ තනුක HCl ප්‍රතික්‍රියාවේ ශීඝ්‍රතාව අඩු කරන ක්‍රියාව කුමක්ද?",["අම්ල සාන්ද්‍රණය වැඩි කිරීම","උෂ්ණත්වය වැඩි කිරීම","Zn කුඩු කර භාවිත කිරීම","වැඩි ජලයක් එක් කර අම්ලය තනුක කිරීම"],"තනුක කිරීමෙන් අම්ල සාන්ද්‍රණය අඩු වී ගැටුම් අඩු වන නිසා ශීඝ්‍රතාව අඩු වේ. අනෙක් තුනම ශීඝ්‍රතාව වැඩි කරයි."],["Which action slows down the reaction between Zn and dilute HCl?",["increasing the acid concentration","raising the temperature","using powdered Zn","adding more water to dilute the acid"],"Diluting lowers the acid concentration, so there are fewer collisions and the rate falls. The other three speed it up."],"2020 Q31"],["RATE",0,["උෂ්ණත්වය වැඩි කළ විට ප්‍රතික්‍රියා ශීඝ්‍රතාව වැඩි වන්නේ ඇයි?",["අංශුවල චාලක ශක්තිය වැඩි වී ඵලදායී ගැටුම් වැඩි වන නිසා","අංශු ගණන වැඩි වන නිසා","පෘෂ්ඨ වර්ගඵලය වැඩි වන නිසා","උත්ප්‍රේරකයක් සෑදෙන නිසා"],"උණුසුම් වූ විට අංශු වේගයෙන් චලනය වී නිතර ගැටේ. වැඩි අංශු ප්‍රමාණයකට ප්‍රතික්‍රියාවට අවශ්‍ය ශක්තිය ලැබේ."],["Why does raising the temperature increase the rate of reaction?",["particles have more kinetic energy, so there are more effective collisions","the number of particles increases","the surface area increases","a catalyst is formed"],"When heated, particles move faster and collide more often, and more of them have enough energy to react."],"2021 Q27"],["RATE",3,["එකම ස්කන්ධයේ CaCO₃ පහත ආකාරවලින් තනුක HCl සමඟ ප්‍රතික්‍රියා කරයි. වේගවත්ම ප්‍රතික්‍රියාව කුමකින්ද?",["විශාල කැබැල්ලක්","කුඩා කැබලි කිහිපයක්","මධ්‍යම ප්‍රමාණ කැබලි","සියුම් කුඩු"],"කුඩු කළ විට පෘෂ්ඨ වර්ගඵලය වැඩිම වන නිසා අම්ලය සමඟ ගැටුම් වැඩිම වේ."],["The same mass of CaCO₃ reacts with dilute HCl in different forms. Which reacts fastest?",["one large lump","a few small pieces","medium-sized pieces","fine powder"],"A fine powder has the largest surface area, so there are the most collisions with the acid."],"2021 Q30"],["RATE",3,["CaCO₃ සහ HCl ඇති විවෘත ප්ලාස්කුවක් තරාදියක් මත තබා ඇත. CO₂ පිට වන විට තරාදියේ පාඨාංකය කාලයත් සමඟ වෙනස් වන ආකාරය කුමක්ද?",["නියතව පවතී","ඒකාකාරව වැඩි වේ","මුලදී සෙමින්, පසුව වේගයෙන් අඩු වේ","මුලදී වේගයෙන් අඩු වී, පසුව අඩු වීම මන්දගාමී වී නියත අගයකට පැමිණේ"],"මුලදී ප්‍රතික්‍රියක සාන්ද්‍රණය වැඩි නිසා CO₂ වේගයෙන් පිට වේ. ප්‍රතික්‍රියක වැය වන විට ශීඝ්‍රතාව අඩු වී, ප්‍රතික්‍රියාව අවසානයේ ස්කන්ධය නියත වේ."],["An open flask containing CaCO₃ and HCl is on a balance. As CO₂ escapes, how does the reading change with time?",["it stays constant","it increases steadily","it falls slowly at first, then quickly","it falls quickly at first, then more slowly, then becomes constant"],"At first the reactants are concentrated, so CO₂ escapes fast. As they are used up the rate falls, and the mass becomes constant when the reaction ends."],"2021 Q35"],["RATE",1,["H₂O₂ වියෝජනය (2H₂O₂ → 2H₂O + O₂) වේගවත් කිරීමට එකතු කරන උත්ප්‍රේරකය කුමක්ද?",["NaCl","MnO₂","CaCO₃","CuSO₄ ද්‍රාවණය නැතිව ජලය"],"MnO₂ උත්ප්‍රේරකය ලෙස ක්‍රියා කර O₂ වේගයෙන් පිට කරයි. පාසල් විද්‍යාගාරයේ O₂ සෑදීම
