TP, සෙවුම් යන්ත්‍රය","SMTP, DNS, සෙවුම් යන්ත්‍රය","සෙවුම් යන්ත්‍රය, SMTP, DNS","සෙවුම් යන්ත්‍රය, DNS, SMTP"],"සෙවුම් යන්ත්‍රය = සෙවීම, SMTP = ඊමේල් යැවීම, DNS = නාම → IP."],["Which do, respectively, searching web pages, sending email and translating domain names?",["DNS, SMTP, search engine","SMTP, DNS, search engine","search engine, SMTP, DNS","search engine, DNS, SMTP"],"Search engine = searching, SMTP = sending email, DNS = name → IP."],"2020 Q24"],["NET",1,["WWW පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?",["WWW යනු ලොව පුරා ඇති භෞතික ජාලයයි","WWW යනු හයිපර්සබැඳිවලින් සම්බන්ධ වූ වෙබ් පිටු එකතුවකි","WWW ඊමේල් යැවීමට භාවිත කරයි","WWW සහ අන්තර්ජාලය එකම දෙයකි"],"WWW = HTTP හරහා ප්‍රවේශ වන, සම්බන්ධිත වෙබ් පිටු එකතුව. භෞතික ජාලය අන්තර්ජාලයයි."],["Which statement about the WWW is correct?",["the WWW is the worldwide physical network","the WWW is a collection of web pages linked by hyperlinks","the WWW is used to send email","the WWW and the Internet are the same"],"The WWW = linked web pages accessed by HTTP. The physical network is the Internet."],"2020 Q25"],["NET",3,["සෑම පරිගණකයක්ම දෙපසින් එක බැගින් පරිගණක දෙකකට සම්බන්ධ වී වසා ඇති වළල්ලක් සාදන ජාල ස්ථලකය (topology) කුමක්ද?",["තරු (star)","බස් (bus)","දැල (mesh)","වළල්ල (ring)"],"Ring topology හි දත්ත වළල්ල වටා ගමන් කරයි."],["In which topology is each computer connected to two neighbours, forming a closed loop?",["star","bus","mesh","ring"],"In a ring topology data travels around the loop."],"2020 Q30"],["NET",0,["සියලු පරිගණක මධ්‍ය ස්විචයකට (switch) සම්බන්ධ වන ස්ථලකය කුමක්ද?",["තරු (star)","වළල්ල (ring)","බස් (bus)","දැල (mesh)"],"Star topology හි සෑම උපාංගයක්ම මධ්‍ය ස්විචයට/හබ් එකට සම්බන්ධ වේ."],["In which topology are all computers connected to a central switch?",["star","ring","bus","mesh"],"In a star topology every device connects to a central switch/hub."],"2021 Q5"],["NET",2,["පහත ඒවා අතරින් වලංගු IPv4 ලිපිනය කුමක්ද?",["192.168.1.256","192.168.1","192.168.10.25","192:168:10:25"],"IPv4 = තිත්වලින් වෙන් කළ කොටස් 4ක්, එක් එක් 0–255."],["Which is a valid IPv4 address?",["192.168.1.256","192.168.1","192.168.10.25","192:168:10:25"],"IPv4 = four parts separated by dots, each 0–255."],"2021 Q24"],["NET",1,["සේවාව සහ අදාළ ප්‍රොටෝකෝලය නිවැරදිව ගැළපෙන යුගලය කුමක්ද?",["ඊමේල් යැවීම – HTTP","වෙබ් පිටු බැලීම – HTTP","ගොනු හුවමාරුව – SMTP","වෙබ් පිටු බැලීම – FTP"],"වෙබ් = HTTP/HTTPS, ඊමේල් යැවීම = SMTP, ගොනු = FTP."],["Which service is correctly matched with its protocol?",["sending email – HTTP","viewing web pages – HTTP","file transfer – SMTP","viewing web pages – FTP"],"Web = HTTP/HTTPS, sending email = SMTP, files = FTP."],"2021 Q27"],["NET",3,["පාසල් LAN එකක් අන්තර්ජාලයට සම්බන්ධ කිරීමට සහ අනවසර ප්‍රවේශ වැළැක්වීමට පිළිවෙළින් භාවිත කරන්නේ කුමක්ද?",["ස්විචය, හබ්","හබ්, රවුටරය","ෆයර්වෝලය, ස්විචය","රවුටරය, ෆයර්වෝලය"],"රවුටරය ජාල සම්බන්ධ කරයි (LAN → අන්තර්ජාලය). ෆයර්වෝලය අනවසර ගමනාගමනය අවහිර කරයි."],["Which devices, respectively, connect a school LAN to the internet and block unauthorised access?",["switch, hub","hub, router","firewall, switch","router, firewall"],"A router connects networks (LAN → internet); a firewall blocks unauthorised traffic."],"2022 Q5"],["NET",0,["අන්තර්ජාලයේ ඇති පරිගණකයක් අනන්‍යව හඳුනාගන්නේ කුමක් මගින්ද?",["IP ලිපිනය","වසම් නාමය පමණි","ඊමේල් ලිපිනය","URL හි මාර්ගය"],"සෑම උපාංගයකටම අනන්‍ය IP ලිපිනයක් ඇත. වසම් නාම පහසුව සඳහා පමණි."],["What uniquely identifies a computer on the internet?",["its IP address","only its domain name","an email address","the path in a URL"],"Every device has a unique IP address; domain names are just for convenience."],"2022 Q36"],["NET",2,["DNS සේවාදායකයේ කාර්යය කුමක්ද?",["ඊමේල් ගබඩා කිරීම","වෙබ් පිටු නිර්මාණය කිරීම","වසම් නාම IP ලිපිනවලට පරිවර්තනය කිරීම","ගොනු සම්පීඩනය"],"DNS = Domain Name System."],["What does a DNS server do?",["stores email","creates web pages","translates domain names into IP addresses","compresses files"],"DNS = Domain Name System."],"2022 Q37"],["NET",1,["කාර්යාල දෙකක කළමනාකරුවන් වීඩියෝ සම්මන්ත්‍රණයක් (video conference) පැවැත්වීමට අවශ්‍ය නොවන්නේ කුමක්ද?",["වෙබ්කැම් සහ මයික්‍රොෆෝනය","ප්ලොටරය","අන්තර්ජාල සම්බන්ධතාවය","වීඩියෝ සම්මන්ත්‍රණ මෘදුකාංගය"],"ප්ලොටරය මුද්‍රණය සඳහාය. වීඩියෝ සම්මන්ත්‍රණයට කැමරාව, මයික්, ස්පීකර/තිරය, අන්තර්ජාලය, මෘදුකාංගය අවශ්‍යයි."],["What is NOT needed for managers in two offices to hold a video conference?",["webcam and microphone","a plotter","an internet connection","video-conferencing software"],"A plotter is for printing. Video conferencing needs a camera, mic, speakers/screen, internet and software."],"2022 Q38"],["NET",3,["Star topology එකක මධ්‍යයේ වඩාත් සුලභව භාවිත කරන උපාංගය කුමක්ද?",["මෝඩමය","රවුටරය පමණි","රිපීටරය","ස්විචය (switch)"],"ස්විචය දත්ත නිවැරදි පරිගණකයටම යවයි."],["Which device is most commonly at the centre of a star topology?",["modem","only a router","repeater","switch"],"A switch sends data only to the correct computer."],"2023 Q5"],["NET",0,["නිවසකට අන්තර්ජාල සම්බන්ධතාවය ලබා දෙන ආයතනය හඳුන්වන්නේ කුමක් ලෙසද?",["ISP (Internet Service Provider)","DNS","WWW","LAN"],"SLT, Dialog වැනි ISP අන්තර්ජාල ප්‍රවේශය ලබා දෙයි."],["What is the company that provides an internet connection to a home called?",["ISP (Internet Service Provider)","DNS","WWW","LAN"],"ISPs such as SLT and Dialog provide internet access."],"2023 Q36"],["NET",2,["Walkie-talkie එකක එක් වරකට එක් අයෙකුට පමණක් කතා කළ හැක, නමුත් දෙපැත්තටම සන්නිවේදනය වේ. මෙය කුමන සම්ප්‍රේෂණ ආකාරයද?",["Simplex","Full duplex","Half duplex","Broadcast"],"Simplex = එක් දිශාවකට පමණි (රේඩියෝ). Half duplex = දෙපැත්තට, එකවර නොවේ. Full duplex = එකවර දෙපැත්තට (දුරකථනය)."],["A walkie-talkie lets only one person speak at a time, but communication goes both ways. Which transmission mode is this?",["simplex","full duplex","half duplex","broadcast"],"Simplex = one way only (radio). Half duplex = both ways, not at once. Full duplex = both ways at once (phone)."],"2025 Q4"],["NET",1,["Star topology හි වාසියක් කුමක්ද?",["මධ්‍ය උපාංගය අසාර්ථක වුවත් ජාලය ක්‍රියා කරයි","එක් කේබලයක් කැඩුණත් අනෙක් පරිගණක දිගටම ක්‍රියා කරයි","අඩුම කේබල් ප්‍රමාණයක් අවශ්‍යයි","මධ්‍ය උපාංගයක් අවශ්‍ය නැත"],"සෑම පරිගණකයකටම වෙනම කේබලයක් ඇති නිසා එකක් කැඩුණත් අනෙක් ඒවාට බලපාන්නේ නැත. මධ්‍ය ස්විචය අසාර්ථක වුවහොත් සියල්ල නවතී."],["What is an advantage of a star topology?",["the network works even if the central device fails","if one cable breaks, the other computers keep working","it needs the least cable","it needs no central device"],"Each computer has its own cable, so one break does not affect others. If the central switch fails, everything stops."],"2025 Q5"],["NET",3,["IP ලිපින පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["IPv4 ලිපිනයක කොටස් 6ක් ඇත","එකම ජාලයේ පරිගණක දෙකකට එකම IP ලිපිනය තිබිය හැක","IP ලිපිනය අකුරුවලින් පමණක් සෑදේ","IPv4 ලිපිනයක් bit 32කින් සෑදී ඇත"],"IPv4 = bit 8 බැගින් කොටස් 4ක් = bit 32. එකම ජාලයේ ලිපින අනන්‍ය විය යුතුය."],["Which statement about IP addresses is true?",["an IPv4 address has 6 parts","two computers on the same network can share an IP address","an IP address is made only of letters","an IPv4 address is 32 bits long"],"IPv4 = four 8-bit parts = 32 bits. Addresses on one network must be unique."],"2025 Q36"],["SDLC",3,["මෘදුකාංග පරීක්ෂණයේ නිවැරදි පිළිවෙළ කුමක්ද?",["පිළිගැනීමේ, පද්ධති, ඒකාබද්ධ, ඒකක","පද්ධති, ඒකක, ඒකාබද්ධ, පිළිගැනීමේ","ඒකාබද්ධ, ඒකක, පද්ධති, පිළිගැනීමේ","ඒකක, ඒකාබද්ධ, පද්ධති, පිළිගැනීමේ"],"ඒකක (කොටස් වෙන වෙනම) → ඒකාබද්ධ (කොටස් එකට) → පද්ධති (සම්පූර්ණ) → පිළිගැනීමේ (පරිශීලකයා)."],["What is the correct order of software testing?",["acceptance, system, integration, unit","system, unit, integration, acceptance","integration, unit, system, acceptance","unit, integration, system, acceptance"],"Unit (parts separately) → integration (parts together) → system (whole) → acceptance (by the user)."],"2016 Q16"],["SDLC",1,["පුස්තකාලයේ අත්පොත් පද්ධතිය පරිගණක පද්ධතියකින් ප්‍රතිස්ථාපනය කිරීමේ වාසියක් කුමක්ද?",["අන්තර්ජාලය නැති අයට වඩා පහසු වීම","පොත් සෙවීම ඉක්මන් සහ නිවැරදි වීම","විදුලිය අවශ්‍ය නොවීම","පුහුණුවක් අවශ්‍ය නොවීම"],"පරිගණක පද්ධති කාර්යක්ෂමතාව සහ නිරවද්‍යතාව වැඩි කරයි. අන්තර්ජාලය නැති අයට එය අවාසියක් විය හැක."],["What is an advantage of replacing a library's manual system with a computer system?",["it is easier for people without internet","searching for books is faster and more accurate","it needs no electricity","no training is needed"],"Computer systems improve efficiency and accuracy. People without internet may be disadvantaged."],"2016 Q17"],["SDLC",0,["දිය ඇල්ල (waterfall) ආකෘතිය පිළිබඳ සත්‍ය ප්‍රකාශය කුමක්ද?",["එක් අදියරක් සම්පූර්ණ වූ පසු පමණක් ඊළඟ අදියර ආරම්භ වේ","පද්ධතිය කොටස් වශයෙන් නැවත නැවත දියුණු කරයි","පරිශීලකයා මුල් අදියරවලදීම පද්ධතිය දකී","අවශ්‍යතා වෙනස් කිරීම ඉතා පහසුය"],"Waterfall අනුක්‍රමිකයි. අවශ්‍යතා වෙනස් කිරීම අපහසුයි. පරිශීලකයා පද්ධතිය දකින්නේ අවසානයේ ය."],["Which statement about the waterfall model is true?",["each phase starts only after the previous one is complete","the system is improved in repeated increments","users see the system in the early phases","changing requirements is very easy"],"Waterfall is sequential; changing requirements is hard, and users see the system only at the end."],"2018 Q30"],["SDLC",2,["නව පද්ධතිය එක් අංශයක පමණක් මුලින් ස්ථාපනය කර, සාර්ථක වූ පසු සියලු අංශවලට ලබා දීම හඳුන්වන්නේ කුමක් ලෙසද?",["සෘජු (direct) යෙදවීම","සමාන්තර (parallel) යෙදවීම","නියමු (pilot) යෙදවීම","අදියර (phased) යෙදවීම"],"Pilot = එක් කණ්ඩායමක පළමුව පරීක්ෂා කිරීම. Phased = කොටස් එකින් එක. Parallel = පැරණි හා නව එකවර. Direct = එකවර මාරු කිරීම."],["What is it called when a new system is installed in one department first, then everywhere once it succeeds?",["direct deployment","parallel deployment","pilot deployment","phased deployment"],"Pilot = try in one group first. Phased = parts one by one. Parallel = old and new together. Direct = switch at once."],"2018 Q31"],["SDLC",1,["පරිශීලකයින් විසින් පද්ධතිය තම අවශ්‍යතාවලට ගැළපේදැයි පරීක්ෂා කරන අවසාන පරීක්ෂණය කුමක්ද?",["ඒකක පරීක්ෂණය","පිළිගැනීමේ පරීක්ෂණය (acceptance)","ඒකාබද්ධ පරීක්ෂණය","පද්ධති පරීක්ෂණය"],"පිළිගැනීමේ පරීක්ෂණය අවසාන පරිශීලකයින් කරයි."],["Which final test is done by users to check the system meets their needs?",["unit testing","acceptance testing","integration testing","system testing"],"Acceptance testing is done by the end users."],"2019 Q25"],["SDLC",3,["තොරතුරු පද්ධතියක ප්‍රධාන කාර්ය මොනවාද?",["මුද්‍රණය සහ ස්කෑන් කිරීම","නිර්මාණය සහ මකා දැමීම","ජාලගත කිරීම පමණි","ආදානය, සැකසීම, ගබඩාව සහ ප්‍රතිදානය"],"තොරතුරු පද්ධතියක් දත්ත ලබාගෙන (ආදානය), සකසා, ගබඩා කර, තොරතුරු ප්‍රතිදානය කරයි."],["What are the main functions of an information system?",["printing and scanning","creating and deleting","networking only","input, processing, storage and output"],"An information system takes data in, processes it, stores it and outputs information."],"2020 Q2"],["SDLC",0,["නව පද්ධතියක අවශ්‍යතා හඳුනාගැනීමට භාවිත කරන ක්‍රම මොනවාද?",["සම්මුඛ සාකච්ඡා, ප්‍රශ්නාවලි, නිරීක්ෂණය","කේතකරණය, පරීක්ෂණය","නඩත්තුව, යෙදවීම","මුද්‍රණය, ස්කෑන් කිරීම"],"අවශ්‍යතා එකතු කිරීමට සම්මුඛ සාකච්ඡා, ප්‍රශ්නාවලි, නිරීක්ෂණය සහ ලේඛන අධ්‍යයනය භාවිත කරයි."],["Which methods are used to identify the requirements of a new system?",["interviews, questionnaires, observation","coding, testing","maintenance, deployment","printing, scanning"],"Requirements are gathered by interviews, questionnaires, observation and studying documents."],"2020 Q10"],["SDLC",2,["පද්ධති සංවර්ධන ජීවන චක්‍රයේ නිවැරදි අදියර පිළිවෙළ කුමක්ද?",["සැලසුම, අවශ්‍යතා, පරීක්ෂණය, කේතකරණය","කේතකරණය, අවශ්‍යතා, සැලසුම, නඩත්තුව","අවශ්‍යතා, සැලසුම, කේතකරණය, පරීක්ෂණය, යෙදවීම, නඩත්තුව","පරීක්ෂණය, සැලසුම, යෙදවීම, අවශ්‍යතා"],"අවශ්‍යතා හඳුනාගෙන → සැලසුම් කර → කේත ලියා → පරීක්ෂා කර → යොදවා → නඩත්තු කරයි."],["What is the correct order of SDLC phases?",["design, requirements, testing, coding","coding, requirements, design, maintenance","requirements, design, coding, testing, deployment, maintenance","testing, design, deployment, requirements"],"Identify requirements → design → code → test → deploy → maintain."],"2020 Q11"],["SDLC",3,["නව සිසු තොරතුරු පද්ධතිය මුලින් 6 ශ්‍රේණියට පමණක් හඳුන්වා දී, සාර්ථක වූ පසු අනෙක් ශ්‍රේණිවලට ලබා දීම කුමන යෙදවීම් ක්‍රමයද?",["සෘජු","සමාන්තර","අදියර","නියමු (pilot)"],"එක් කණ්ඩායමක පළමුව පරීක්ෂා කිරීම pilot යෙදවීමයි."],["A new student system is introduced first to Grade 6 only, then to other grades after it works. Which deployment method is this?",["direct","parallel","phased","pilot"],"Trying it in one group first is pilot deployment."],"2021 Q32"],["SDLC",1,["කේතකරණයට පෙර සිදු වන SDLC අදියර කුමක්ද?",["පරීක්ෂණය","සැලසුම (design)","යෙදවීම","නඩත්තුව"],"අවශ්‍යතා → සැලසුම → කේතකරණය → පරීක්ෂණය."],["Which SDLC phase comes just before coding?",["testing","design","deployment","maintenance"],"Requirements → design → coding → testing."],"2022 Q34"],["SDLC",0,["වෙන වෙනම පරීක්ෂා කළ මොඩියුල එකට සම්බන්ධ කර නිවැරදිව ක්‍රියා කරනවාදැයි බලන පරීක්ෂණය කුමක්ද?",["ඒකාබද්ධ පරීක්ෂණය (integration)","ඒකක පරීක්ෂණය","පිළිගැනීමේ පරීක්ෂණය","නඩත්තු පරීක්ෂණය"],"Integration testing මොඩියුල අතර අන්තර්ක්‍රියා පරීක්ෂා කරයි."],["Which testing checks that separately tested modules work correctly together?",["integration testing","unit testing","acceptance testing","maintenance testing"],"Integration testing checks how modules work together."],"2022 Q35"],["SDLC",2,["පහත ප්‍රකාශ අතරින් සත්‍ය ඒවා කුමක්ද?<br>A - ඒකක පරීක්ෂණයේදී එක් එක් කොටස වෙන වෙනම පරීක්ෂා කරයි.<br>B - Iterative ආකෘතියේදී පද්ධතිය කොටස් වශයෙන් නැවත නැවත සංවර්ධනය කරයි.<br>C - Waterfall ආකෘතියේ අදියර එකවර සිදු වේ.",["A පමණි","B සහ C පමණි","A සහ B පමණි","A, B, C සියල්ල"],"Waterfall අදියර එකින් එක, අනුක්‍රමිකව සිදු වේ. එබැවින් C අසත්‍යයි."],["Which statements are true?<br>A - In unit testing each part is tested separately.<br>B - In the iterative model the system is developed in repeated parts.<br>C - In the waterfall model the phases happen at the same time.",["A only","B and C only","A and B only","all A, B and C"],"Waterfall phases happen one after another, so C is false."],"2023 Q32"],["SDLC",3,["පරිශීලකයාගේ අදහස් ලබා ගැනීමට, සම්පූර්ණ පද්ධතියට පෙර සාදන සරල, ක්‍රියාකාරී මාදිලිය හඳුන්වන්නේ කුමක් ලෙසද?",["ඇල්ගොරිතමය","ගැලීම් සටහන","පරීක්ෂණ දත්ත","මූලාකෘතිය (prototype)"],"මූලාකෘතියක් මගින් පරිශීලකයාට ඉක්මනින් පද්ධතිය දැක ප්‍රතිචාර දිය හැක."],["What is a simple working model, built before the full system to get user feedback, called?",["an algorithm","a flowchart","test data","a prototype"],"A prototype lets users see the system early and give feedback."],"2023 Q33"],["SDLC",0,["Iterative incremental ආකෘතියේ waterfall ආකෘතියට වඩා ඇති වාසිය කුමක්ද?",["පරිශීලක ප්‍රතිචාර අනුව පද්ධතිය අදියරෙන් අදියර වැඩිදියුණු කළ හැකි වීම","ලේඛන (documentation) අවශ්‍ය නොවීම","පරීක්ෂණ අවශ්‍ය නොවීම","සියලු අවශ්‍යතා ආරම්භයේදීම ස්ථිර විය යුතු වීම"],"Iterative ආකෘතිය කුඩා කොටස් ලබා දී ප්‍රතිචාර අනුව වෙනස් කිරීමට ඉඩ දෙයි."],["What advantage does the iterative incremental model have over the waterfall model?",["the system can be improved step by step from user feedback","no documentation is needed","no testing is needed","all requirements must be fixed at the start"],"The iterative model delivers small parts and allows changes based on feedback."],"2025 Q34"],["SDLC",1,["පුස්තකාලාධිපතිවරයා නව පද්ධතිය භාවිත කර එය තම අවශ්‍යතා සපුරාලන්නේදැයි පරීක්ෂා කරයි. මෙය කුමන පරීක්ෂණයද?",["ඒකක","පිළිගැනීමේ (acceptance)","ඒකාබද්ධ","පද්ධති"],"අවසාන පරිශීලකයා කරන පරීක්ෂණය පිළිගැනීමේ පරීක්ෂණයයි."],["The librarian uses the new system to check it meets their needs. Which testing is this?",["unit","acceptance","integration","system"],"Testing by the end user is acceptance testing."],"2025 Q35"],["SOC",3,["ඩිජිටල් බෙදීම (digital divide) අඩු කිරීමට උපකාරී වන යෝජනා කුමක්ද?<br>A - අඩු ආදායම් පවුල්වලට පරිගණක ණය පහසුකම්<br>B - ග්‍රාමීය ප්‍රදේශවල අන්තර්ජාල පහසුකම් වැඩි කිරීම<br>C - නාගරික පාසල්වලට පමණක් පරිගණක ලබා දීම",["A පමණි","C පමණි","B සහ C පමණි","A සහ B පමණි"],"ඩිජිටල් බෙදීම යනු තාක්ෂණය ඇති හා නැති අය අතර පරතරයයි. C පරතරය වැඩි කරයි."],["Which suggestions help reduce the digital divide?<br>A - computer loans for low-income families<br>B - better internet in rural areas<br>C - giving computers only to city schools",["A only","C only","B and C only","A and B only"],"The digital divide is the gap between those with and without technology. C widens it."],"2016 Q21"],["SOC",2,["ICT ඵලදායීව භාවිත කරන අවස්ථා මොනවාද?<br>A - දුරස්ථ වෛද්‍ය උපදෙස් (telemedicine)<br>B - ස්වයංක්‍රීය හරිතාගාර ජල සැපයුම<br>C - මාර්ගගතව පොත් මිලදී ගැනීම",["A පමණි","A සහ B පමණි","A, B, C සියල්ල","B සහ C පමණි"],"තුනම ICT හි ඵලදායී භාවිත වේ."],["Which are effective uses of ICT?<br>A - remote medical advice (telemedicine)<br>B - automatic greenhouse watering<br>C - buying books online",["A only","A and B only","all A, B and C","B and C only"],"All three are effective uses of ICT."],"2016 Q31"],["SOC",0,["පහත ප්‍රකාශ අතරින් සත්‍ය වන්නේ කුමක්ද?",["තනි පරිශීලක බලපත්‍රයක් ඇති මෘදුකාංගයක් පරිගණක කිහිපයක ස්ථාපනය කිරීම නීති විරෝධීය","e-waste ගෘහ කසළ සමඟ බැහැර කිරීම ආරක්ෂිතය","ෆයර්වෝලයක් ඇත්නම් මුරපද අවශ්‍ය නැත","නිදහස් මෘදුකාංග භාවිතය නීති විරෝධීය"],"බලපත්‍ර කොන්දේසි උල්ලංඝනය කිරීම මෘදුකාංග කොල්ලකෑමකි. e-waste විශේෂයෙන් බැහැර කළ යුතුය."],["Which statement is true?",["installing single-user licensed software on several computers is illegal","putting e-waste in household rubbish is safe","with a firewall, passwords are not needed","using free software is illegal"],"Breaking licence terms is software piracy. E-waste needs special disposal."],"2016 Q32"],["SOC",1,["පහත ඒවා අතරින් e-රාජ්‍ය සේවාවක් නොවන්නේ කුමක්ද?",["මාර්ගගතව විභාග ප්‍රතිඵල බැලීම","මාර්ගගත වෙළඳසැලකින් ඇඳුම් මිලදී ගැනීම","මාර්ගගතව වාහන ආදායම් බලපත්‍රය අලුත් කිරීම","රජයේ අඩවියකින් අයදුම්පත් බාගත කිරීම"],"පෞද්ගලික වෙළඳසැලකින් මිලදී ගැනීම e-වාණිජ්‍යයි, e-රාජ්‍ය නොවේ."],["Which is NOT an e-government service?",["viewing exam results online","buying clothes from an online shop","renewing a vehicle revenue licence online","downloading forms from a government site"],"Buying from a private shop is e-commerce, not e-government."],"2018 Q34"],["SOC",3,["දෘඪ තැටියක් අසාර්ථක වීමෙන් දත්ත නැති වීම වළක්වා ගැනීමට හොඳම ක්‍රමය කුමක්ද?",["ෆයර්වෝලයක් ස්ථාපනය","Antivirus ස්ථාපනය","ශක්තිමත් මුරපදයක්","නිතිපතා උපස්ථ (backup) ගැනීම"],"දෘඪාංග අසාර්ථක වීමෙන් ආරක්ෂා වීමට දත්තවල පිටපතක් වෙනත් තැනක තබා ගත යුතුය."],["What is the best way to protect data from a hard disk failure?",["installing a firewall","installing antivirus","a strong password","taking regular backups"],"To survive hardware failure, keep a copy of the data somewhere else."],"2019 Q2"],["SOC",0,["රජයෙන් පුරවැසියාට (G2C) සේවා පමණක් ඇති කුලකය කුමක්ද?",["මාර්ගගත විභාග ප්‍රතිඵල, මාර්ගගත ආදායම් බලපත්‍ර","මාර්ගගත ආහාර ඇණවුම්, මාර්ගගත ආදායම් බලපත්‍ර","සමාජ මාධ්‍ය, මාර්ගගත ආහාර ඇණවුම්","මාර්ගගත බැංකු, මාර්ගගත සාප්පු"],"ආහාර ඇණවුම්, බැංකු, සාප්පු පෞද්ගලික අංශයේ සේවා වේ."],["Which set contains only Government-to-Citizen (G2C) services?",["online exam results, online revenue licences","online food orders, online revenue licences","social media, online food orders","online banking, online shopping"],"Food orders, banking and shopping are private-sector services."],"2019 Q4"],["SOC",2,["පරිගණකයක් භාවිත කිරීමේ නිවැරදි ඉරියව්ව කුමක්ද?",["තිරය ඇස් මට්ටමට වඩා බෙහෙවින් ඉහළින්","ඉදිරියට නැමී වාඩි වීම","පිට කෙළින්, පාද බිම, තිරය ඇස් මට්ටමට මඳක් පහළින්","පාද හරස් කර වාඩි වීම"],"නිවැරදි ඉරියව්ව පිට, බෙල්ල, මැණික් කටුවල ආබාධ වළක්වයි."],["What is the correct posture when using a computer?",["screen well above eye level","leaning forward","back straight, feet flat, screen slightly below eye level","sitting with legs crossed"],"Good posture prevents back, neck and wrist problems."],"2019 Q32"],["SOC",1,["පහත ඒවා අතරින් G2C (රජයෙන් පුරවැසියාට) සේවාවක් කුමක්ද?",["සමාගම් අතර මාර්ගගත ගනුදෙනු","මාර්ගගතව උප්පැන්න සහතික පිටපතක් ලබා ගැනීම","මාර්ගගතව ඇඳුම් මිලදී ගැනීම","රජයේ ආයතන අතර ලිපි හුවමාරුව"],"උප්පැන්න සහතික රජය පුරවැසියාට දෙන සේවාවකි."],["Which is a G2C (Government-to-Citizen) service?",["online deals between companies","getting a copy of a birth certificate online","buying clothes online","letters between government offices"],"A birth certificate is a service from government to citizens."],"2020 Q7"],["SOC",3,["බලපත්‍රලාභී මෘදුකාංගයක් අනවස e banking","electronic voter lists"],"Cyberbullying is a harmful effect of ICT; the others are benefits."],"2021 Q31"],["SOC",3,["Google Docs වැනි, අන්තර්ජාලය හරහා බ්‍රවුසරයෙන් භාවිත කරන මෘදුකාංග සේවාව හඳුන්වන්නේ කුමක් ලෙසද?",["IaaS","PaaS","LAN","SaaS (Software as a Service)"],"SaaS = cloud මගින් මෘදුකාංග ලබා දීම. PaaS = සංවර්ධන වේදිකාව. IaaS = සේවාදායක/ගබඩා."],["What is a software service used through a browser over the internet, like Google Docs, called?",["IaaS","PaaS","LAN","SaaS (Software as a Service)"],"SaaS = software delivered via the cloud. PaaS = development platform. IaaS = servers/storage."],"2023 Q35"],["PRES",1,["වදන් සැකසුම් සහ ඉදිරිපත් කිරීම් මෘදුකාංග දෙකටම පොදු නොවන විශේෂාංගය කුමක්ද?",["Spell check","Slide transition","Find and Replace","Line spacing"],"Slide transition ඉදිරිපත් කිරීම් මෘදුකාංගවල පමණි."],["Which feature is NOT common to both word-processing and presentation software?",["spell check","slide transition","Find and Replace","line spacing"],"Slide transition exists only in presentation software."],"2016 Q10"],["PRES",3,["ස්ලයිඩයක මාතෘකාව සහ අන්තර්ගතය තබන ස්ථාන (placeholders) වෙනස් කිරීමට භාවිත කරන්නේ කුමක්ද?",["Slide transition","Slide sorter","Animation","Slide layout"],"Slide layout මගින් ස්ලයිඩයේ ස්ථාන සැකැස්ම තෝරයි."],["Which is used to change where the title and content placeholders are on a slide?",["slide transition","slide sorter","animation","slide layout"],"Slide layout chooses the arrangement of placeholders."],"2016 Q27"],["PRES",0,["ස්ලයිඩ් ප්‍රදර්ශනයේදී එක් ස්ලයිඩයක ඇති පෙළ සහ රූප පෙනී යන ආකාරය පාලනය කරන්නේ කුමක්ද?",["Animation","Slide transition","Slide layout","Slide design"],"Animation ස්ලයිඩය තුළ ඇති වස්තු සඳහාය. Transition ස්ලයිඩ මාරු වන විට ය."],["During a slide show, which controls how text and pictures appear on a slide?",["animation","slide transition","slide layout","slide design"],"Animation is for objects on a slide; transition is between slides."],"2016 Q28"],["PRES",2,["ස්ලයිඩ් ප්‍රදර්ශනයේදී ඊළඟ ස්ලයිඩයට යාම const save=()=>{try{localStorage.setItem(SK,JSON.stringify(ST))}catch(e){}};
const L=(si,en)=>LANG==='si'?si:en;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function streak(){const ds=new Set(ST.days);let n=0,d=new Date();if(!ds.has(today()))d.setDate(d.getDate()-1);
  while(ds.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const Q=i=>D.qs[i];const tq=i=>Q(i)[0];
const qL=i=>LANG==='si'?Q(i)[2]:Q(i)[3];
function tstat(t){let n=0,seen=0,r=0,w=0;D.qs.forEach((q,i)=>{if(q[0]!==t)return;n++;const s=ST.s[i];if(s){seen++;r+=s[0];w+=s[1]}});return{n,seen,acc:r+w?Math.round(100*r/(r+w)):null}}
function chstat(c){let n=0,seen=0;c.topics.forEach(t=>{const s=tstat(t);n+=s.n;seen+=s.seen});return{n,seen}}
function totals(){let r=0,w=0,seen=0;for(const k in ST.s){seen++;r+=ST.s[k][0];w+=ST.s[k][1]}return{seen,r,w,acc:r+w?Math.round(100*r/(r+w)):0}}
function record(i,ok){const s=ST.s[i]||[0,0];s[ok?0:1]++;ST.s[i]=s;
  const m=new Set(ST.mis);ok?m.delete(i):m.add(i);ST.mis=[...m];
  if(!ST.days.includes(today()))ST.days.push(today());save()}

 ['s3','දින 3 අඛණ්ඩව','3-day streak',()=>streak()>=3],

/* ---------- quiz engine ---------- */
function pick(n){const t=D.qs.map((q,i)=>i);const weak=t.filter(i=>!ST.s[i]);return shuffle(weak.length>=n?weak:t).slice(0,n)}
function start(ids,mode,title,mins,perms,paper){if(!ids.length)return;
  RUN={ids,mode,title,live:true,cur:0,ans:{},flag:{},paper,
    perms:perms||ids.map(()=>shuffle([0,1,2,3])),end:mins?Date.now()+mins*60000:0,t0:Date.now()};
  location.hash==='#quiz'?drawQ():location.hash='quiz'}
function startPaper(k){const p=D.papers[k];start(p.p1.map(x=>x[0]),'e',L('ආදර්ශ පත්‍රය '+(k+1)+' · I පත්‍රය','Model paper '+(k+1)+' · Paper I'),p.t1,p.p1.map(x=>x[1]),k)}
function fmt(ms){ms=Math.max(0,ms);const s=Math.round(ms/1000);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function drawQ(){const R=RUN,k=R.cur,i=R.ids[k],q=qL(i),perm=R.perms[k],ex=R.mode==='e';
  const a=R.ans[k],done=a!=null&&!ex,corr=perm.indexOf(Q(i)[1]);
  $('#app').innerHTML=`<section class="sec">
   <div class="row" style="justify-content:space-between"><h3>${esc(R.title)}</h3>${ex&&R.end?`<span class="timer" id="tm"></span>`:''}</div>
   <div class="qcard">
    <div class="qtop"><span>${L('ප්‍රශ්නය','Question')} ${k+1} / ${R.ids.length}</span><span>${esc(D.names[tq(i)][LANG==='si'?0:1])}${Q(i)[4]?' · '+L('පදනම ','based on ')+Q(i)[4]:''}</span></div>
    <div class="qtext">${esc(q[0])}</div>
    <div class="opts">${perm.map((o,j)=>{let c='';if(ex){if(a===j)c='sel'}else if(done){if(j===corr)c='ok';else if(j===a)c='bad'}
      return `<button class="opt ${c}" ${done?'disabled':''} onclick="choose(${j})"><span class="k">(${j+1})</span><span>${esc(q[1][o])}</span></button>`}).join('')}</div>
    ${done?`<div class="exp"><b>${a===corr?L('නිවැරදියි!','Correct!'):L('වැරදියි. නිවැරදි පිළිතුර ('+(corr+1)+')','Not quite. The answer is ('+(corr+1)+')')}</b><br>${esc(q[2])}</div>`:''}
    <div class="row" style="justify-content:space-between">
      <button ${k?'':'disabled'} onclick="go(-1)">← ${L('පෙර','Back')}</button>
      ${ex?`<button onclick="RUN.flag[${k}]=!RUN.flag[${k}];drawQ()">${R.flag[k]?L('සලකුණ ඉවත් කරන්න','Unflag'):L('සලකුණු කරන්න','Flag')}</button>`:''}
      ${k<R.ids.length-1?`<button class="pri" ${!ex&&!done?'disabled':''} onclick="go(1)">${L('ඊළඟ','Next')} →</button>`:`<button class="pri" ${!ex&&!done?'disabled':''} onclick="finish()">${L('අවසන් කරන්න','Finish')}</button>`}
    </div></div>
   ${ex?`<div class="pal">${R.ids.map((_,j)=>`<button class="${R.ans[j]!=null?'ans':''} ${j===k?'cur':''} ${R.flag[j]?'flag':''}" onclick="RUN.cur=${j};drawQ()">${j+1}</button>`).join('')}</div>
   <div class="row"><span class="mute">${L('පිළිතුරු දුන් ','Answered ')}${Object.keys(R.ans).length}/${R.ids.length}</span><button onclick="finish()">${L('පත්‍රය භාර දෙන්න','Submit paper')}</button></div>`:''}
   <div><button onclick="if(RUN){RUN.live=false};history.back()">${L('නවත්වන්න','Quit')}</button></div></section>`;
  if(ex&&R.end){const tick=()=>{const left=R.end-Date.now();const el=$('#tm');if(el){el.textContent=fmt(left);el.className='timer'+(left<300000?' low':'')}if(left<=0)finish()};tick();clearInterval(TIMER);TIMER=setInterval(tick,1000)}}
function choose(j){const R=RUN,k=R.cur;if(R.mode==='e'){R.ans[k]=j;return drawQ()}
  if(R.ans[k]!=null)return;R.ans[k]=j;const i=R.ids[k];record(i,R.perms[k][j]===Q(i)[1]);drawQ()}
function go(d){RUN.cur=Math.min(RUN.ids.length-1,Math.max(0,RUN.cur+d));drawQ();window.scrollTo(0,0)}
function finish(){clearInterval(TIMER);const R=RUN;if(!R||!R.live)return;R.live=false;let right=0;const tb={};
  R.ids.forEach((i,k)=>{const ok=R.ans[k]!=null&&R.perms[k][R.ans[k]]===Q(i)[1];if(ok)right++;
    if(R.mode==='e'&&R.ans[k]!=null)record(i,ok);if(R.mode==='e'&&R.ans[k]==null){const m=new Set(ST.mis);m.add(i);ST.mis=[...m]}
    const t=tq(i);tb[t]=tb[t]||[0,0];tb[t][ok?0:1]++});
  const pc=Math.round(100*right/R.ids.length);
  if(R.mode==='e'){ST.exams++;if(R.paper!=null)ST.best['p'+R.paper]=Math.max(ST.best['p'+R.paper]||0,pc);save()}
  const wrongIds=R.ids.filter((i,k)=>!(R.ans[k]!=null&&R.perms[k][R.ans[k]]===Q(i)[1]));
  $('#app').innerHTML=`<section class="sec"><h3>${esc(R.title)}</h3>
   <div class="row" style="gap:18px"><div class="score">${pc}%</div><div class="mute">${right} / ${R.ids.length} ${L('නිවැරදියි','correct')}<br>${L('ගත වූ කාලය ','Time ')}${fmt(Date.now()-R.t0)}</div></div>
   <div class="row"><button class="pri" ${wrongIds.length?'':'disabled'} onclick='start(${JSON.stringify(wrongIds)},"p",L("වැරදුණු ඒවා නැවත","Retry wrong ones"))'>${L('වැරදුණු ඒවා නැවත කරන්න','Retry wrong ones')}</button><button onclick="location.hash='home'">${L('මුල් පිටුවට','Home')}</button></div>
   <div class="lbl">${L('පාඩම් අනුව','By lesson')}</div>
   <div style="overflow-x:auto"><table class="tp">${Object.entries(tb).sort((a,b)=>(a[1][0]/(a[1][0]+a[1][1]))-(b[1][0]/(b[1][0]+b[1][1]))).map(([t,v])=>`<tr><td>${esc(D.names[t][LANG==='si'?0:1])}</td><td class="n">${v[0]}/${v[0]+v[1]}</td></tr>`).join('')}</table></div>
   <div class="lbl">${L('සමාලෝචනය','Review')}</div>
   <div class="rev">${R.ids.map((i,k)=>{const q=qL(i),perm=R.perms[k],a=R.ans[k],corr=perm.indexOf(Q(i)[1]),ok=a!=null&&perm[a]===Q(i)[1];
     return `<div class="rv ${ok?'r':'w'}"><div><b>${k+1}.</b> ${esc(q[0])}</div>
     <div>${L('ඔබේ පිළිතුර','Your answer')}: ${a==null?'–':'('+(a+1)+') '+esc(q[1][perm[a]])}</div>
     ${ok?'':`<div><b>${L('නිවැරදි','Answer')}: (${corr+1}) ${esc(q[1][Q(i)[1]])}</b></div>`}<div class="mute">${esc(q[2])}</div></div>`}).join('')}</div></section>`;
  window.scrollTo(0,0)}

function setLang(l){LANG=l;try{localStorage.setItem('olquest-lang',l)}catch(e){}RUN&&RUN.live?(nav(),drawQ()):route()}
$('#lgSi').onclick=()=>setLang('si');$('#lgEn').onclick=()=>setLang('en');

function subjBtns(){$('#sbS').className=CUR==='sci'?'on':'';$('#sbI').className=CUR==='ict'?'on':''}
function switchSubj(k){if(k===CUR)return;clearInterval(TIMER);RUN=null;useSubj(k);subjBtns();
  if(location.hash&&location.hash!=='#home')location.hash='home';else route()}
$('#sbS').onclick=()=>switchSubj('sci');$('#sbI').onclick=()=>switchSubj('ict');
subjBtns();if(location.hash==='#quiz'||location.hash.startsWith('#ch-'))location.hash='home';route();
</script>

</body>
